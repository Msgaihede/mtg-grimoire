[package]
name = "mtg-grimoire"
version = "0.42.0"
description = "MTG Grimoire"
authors = ["Markus Seerup"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mtg_grimoire_lib"
# `rlib` alone: the binary in `main.rs` and the tests are the only things that link it.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# **`unicode-normalization` is `grimoire-core`'s since 2026-10-02** — `schema::label_name_key` is the
# one function that names it, and the comment that argues it moved to that manifest with it.
flate2 = "1"
# **Reading** one entry — `mtg-grimoire.exe` — out of the portable release archive, which is
# `update`'s.
#
# `deflate` only, and `default-features = false`: the default set drags in bzip2, zstd, lzma
# and AES for formats this will never see.
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# rustls, never native-tls (no OpenSSL/schannel dependency in a portable build), and
# deliberately NO `gzip` feature: Scryfall bulk data is a real .gz *file*, not a
# Content-Encoding, so transparent decompression would corrupt the download. `stream` is what
# makes `bytes_stream()` available.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

# The user schema's derived uids, and the updater's integrity check: every GitHub release asset carries a
# `digest` (`sha256:…`, measured live 2026-08-09 on all five), which says a download arrived as
# it was uploaded. **It says nothing about who uploaded it** — anyone who can put a file on a
# release gets a valid digest computed for them. Update signing was removed on 2026-09-29; see
# docs/reference/in-app-updates.md.
sha2 = "0.10"
# **The pairing cryptography's crates are `grimoire-core`'s since 2026-10-02** — `x25519-dalek`,
# `chacha20poly1305`, `hkdf` and `qrcode` moved to that manifest with `sync_pair::crypto` and
# `sync_pair::invite`, the only code that names them, and their version arguments went with them.
#
# Random bytes for the mirror's installation name (`mirror::settings`). The same major the core
# asks for, which follows whichever one `x25519-dalek` resolved — `cargo tree -d` is the check.
getrandom = "0.4"

# **`image` was here too and is gone as of 2026-08-31.** It decoded whatever a reader picked as
# a custom deck cover and re-encoded it to WEBP; custom covers were removed in favour of the
# card-art crop, which is a `cover_card_id` and needs no encoder.
#
# **What went is the *direct* dependency and our feature request, not the crate.** `image` is
# still built, because `arboard` (under `tauri-plugin-clipboard-manager`) and
# `tauri-plugin-mcp-bridge` both pull it — `cargo tree -i image` is the question to ask, and it
# is the reason `cargo check` still prints `Checking image`. So this is a hygiene change rather
# than a size win: nothing in `src-tauri/src` names the crate any more, and no format is listed
# here that no code asks for. Which formats survive is now a fact about those two crates'
# feature sets and is deliberately not written down, since it would rot on their next bump.

# `bundled` is libsqlite3-sys compiling sqlite3.c with the host compiler. `hooks` is what the
# plain-text mirror watches through: an `update_hook` on the one write connection sees every
# insert, update and delete with the table's name, so no command has to remember to tell the
# mirror anything and none added later can forget to. Verified in the
# vendored manifest on 2026-08-25: `hooks = []` pulls in **no additional crates**, and the
# `Cargo.lock` diff for this change is therefore **empty** — a lockfile records resolved versions
# and dependency edges, never feature selections, so an empty diff is the evidence rather than a
# missing one.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
# File identity for the mirror's prune: whether two spellings of a path are one file on disk
# (`mirror::run::alias_of`). `canonicalize` cannot answer it — glibc's `realpath` keeps the
# spelling it was given on a case-folding FAT stick or CIFS share. Already in `Cargo.lock` at this
# version through `walkdir`, so the lockfile gains one edge and no package.
same-file = "1.0.6"
# Write a full backup beside its destination and replace it only after ZIP completion.
tempfile = "3"
# The card scanner. A plain path dependency on a standalone package — it is deliberately excluded
# from the workspace this package is a member of (the root `Cargo.toml` says why), so its three
# tools keep building into `crates/card-scanner/target/`. `corpus` is the join back to
# `corpus.db` for labels and unifies with the `rusqlite = "0.40"` above; `ocr` is the two
# readers. The session glue is the core's since the extraction's seventh step, which declares it
# the same way; this line stays because the commands still name the crate's types (a frame's
# options, its verdict, the filters).
card-scanner = { path = "../crates/card-scanner", features = ["corpus", "ocr"] }
# The engine with no window: what this host, the Android shell and the WASM build all link.
# A workspace member, unlike the scanner. Modules arrive there a step at a time and `lib.rs`
# re-exports each at the path it had here.
grimoire-core = { path = "../crates/grimoire-core" }
tauri = { version = "2", features = [] }
# Opening a link in the reader's browser, and nothing else: `capabilities/desktop.json` grants
# `opener:allow-open-url` and its scope `opener:allow-default-urls`, never `opener:default`, whose
# third entry reveals an unscoped list of paths in the file manager and has no caller here.
tauri-plugin-opener = "2"
# The system file dialogs — choosing a decklist (`import_pick_file`), saving an export
# (`export_save_file`) and moving the mirror (`mirror_pick_root`) — **used from Rust only,
# through `DialogExt`** (`src/file_dialog.rs`, issue #545). Each command opens its own dialog
# and reads or writes the path it answered, so no path crosses IPC in either direction. Until
# 2026-09-28 the page opened the dialog and handed the path to a command, and the
# `dialog:allow-open`/`allow-save` grants that made that possible fenced nothing: an app's own
# command takes whatever the page sends. `capabilities/desktop.json` now grants **no `dialog:`
# permission at all**, and a future file command follows the same shape — never a path argument.
tauri-plugin-dialog = "2"
# The one write it is here for: putting a decklist export on the clipboard. Grants
# `clipboard-manager:allow-write-text` and nothing else — not `:default`, which also grants
# the read, and nothing here reads the clipboard.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
# Windows 11 Snap Layouts, and the *only* thing it is here for. `tauri.conf.json` sets
# `decorations: false` so the app can draw its own caption (`src/components/TitleBar.tsx`),
# and an undecorated window loses the flyout Windows raises when the pointer rests on a real
# maximize button — because that flyout is the OS answering `HTMAXBUTTON` to its own
# `WM_NCHITTEST`, which a `<button>` in a webview is never asked. This plugin parks a
# transparent Win32 child window over the button's rectangle and answers it.
#
# It draws nothing: the caption buttons stay ours, in lucide, and the plugin finds the maximize
# one by DOM id (`SNAP_BUTTON_ID`, shared with the frontend through `src/lib/window.ts`).
# `tauri-plugin-decoration` was the other candidate and renders its own HTML controls, which
# would have replaced those buttons and needed a CSP loosened for its stylesheet.
#
# **A plain dependency rather than `[target.'cfg(windows)'.dependencies]`, for the reason the
# mcp-bridge paragraph below gives**: `tauri-build` discovers a plugin's ACL permissions
# through the dependency graph, so target-gating it would leave `capabilities/desktop.json`'s
# two `snap-layout:` entries unresolvable on the Linux half of the CI matrix. The crate ships a
# dummy implementation for every non-Windows target and compiles to nothing there.
tauri-plugin-snap-layout = "1"
# The other half of the Tauri MCP server in `.mcp.json`. That package is only ever a *client*:
# it dials a WebSocket this plugin opens inside the running app, so without the plugin nothing
# listens and `driver_session` answers `connected: false` forever. Registered under
# `#[cfg(debug_assertions)]` in `desktop.rs` — a release build compiles the crate and never
# opens the port — and, since 2026-09-28, only when `MTG_GRIMOIRE_MCP_BRIDGE=1` is set, because
# the socket authenticates nothing and a page in the developer's own browser can reach the
# loopback (`docs/reference/tauri-mcp-bridge.md`). It stays a plain dependency rather than an optional one on purpose:
# `tauri-build` discovers a plugin's ACL permissions through the dependency graph, so dropping it
# from the release profile would leave `capabilities/desktop.json`'s `mcp-bridge:` entries
# unresolvable and fail the build that needs them least.
tauri-plugin-mcp-bridge = "0.12"
# `rt` is not optional: tokio::fs runs every operation through spawn_blocking, which
# needs a runtime handle. It reaches us through tauri's tokio today, but this crate
# must not depend on another crate's feature selection to compile.
# `sync` is the semaphore that caps concurrent image fetches; `time` is the sleep the
# image cache's pacer and its 429 penalty are made of.
# **No `macros`**: it was `sync_engine::live`'s `tokio::select!` and nothing else, and that
# loop is `grimoire-core`'s since the light app's phase 6. The tests' `#[tokio::test]` asks for
# it under `[dev-dependencies]`.
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
# **`tokio-tungstenite`, the relay doorbell's socket, is `grimoire-core`'s since the light app's
# phase 6** — `platform::socket` is the one module that names it, and the argument for its
# version and its TLS roots moved to that manifest with it.

# Waiting for the process an update replaced to actually terminate, which is the one thing
# std cannot express: there is no portable "is this PID alive". `0.61` is already in the
# tree via tauri/tao, so this adds no build. Two functions, hence two features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
# The `ICoreWebView2::add_PermissionRequested` handler `camera.rs` installs, so the QR
# scanner's camera prompt is answered instead of falling through to WebView2's own default
# (Deny). Already in `Cargo.lock` transitively — `tauri` and `tauri-runtime-wry` both depend
# on it for their own WebView2 interop — so this adds a direct edge rather than a new crate. No
# features: the crate is a thin, feature-free wrapper over the COM bindings and there is nothing
# narrower to ask for.
webview2-com = "0.38"

[dev-dependencies]
# **The core's test scaffolding, for this crate's tests and nothing else**: `schema::memory_pair`,
# `schema::fixtures` and `scratch::path` are gated on this feature there, because a dependency's
# `cfg(test)` is off while another crate's tests build. Under `[dev-dependencies]` on purpose —
# cargo's resolver 2 leaves it out of every build that is not a test, so the shipped binary links
# the core without it. `cargo tree -p mtg-grimoire -e features,normal -i grimoire-core` is the check.
grimoire-core = { path = "../crates/grimoire-core", features = ["testing"] }
httpmock = "0.8"
# `test-util` is a paused clock: `pairing`'s departure test lets ten of a press's five-second
# bounds go by without spending them.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

# **The seventeen `[profile.dev.package.*]` overrides that make a dev scanner usable are in the
# workspace root's `Cargo.toml`, not here.** Cargo reads `[profile.*]` from the build root only,
# and since 2026-10-02 that is the repository root: left in this file they would be ignored with
# a warning, and a `tauri dev` scanner would be a slideshow again.
