name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A PR's runs share a group, so a new push cancels the stale run — the next one diffs the whole
# PR against its base and loses nothing. **A push to `main` gets a group of its own.** Its routing
# diffs from `github.event.before`, so a cancelled `main` run's changes are never routed again —
# and turning off `cancel-in-progress` alone would not save them, because GitHub still replaces a
# *pending* run in the same group with the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# **Every third-party action is pinned by commit SHA, the tag it was on in the comment**, and every
# checkout says `persist-credentials: false` — nothing here runs `git` against the remote after
# checking out (`changes` diffs history it already fetched), so the token has no reason to stay in
# `.git/config` for later steps to read. `release.yml` says why both matter; Dependabot keeps the
# SHAs current and `scripts/actions-pinned.test.mjs` fails on a floating tag or a kept token.
jobs:
  # Which jobs this change can possibly have broken. The decision is `scripts/ci-route.mjs`,
  # where every arm carries its reason; this job only finds the changed paths and hands them
  # over. **The two halves do read each other's files** — frontend tests read `src-tauri/` and
  # `crates/` sources as text, Rust tests read `src/lib/userTables.json`,
  # `src/lib/syncedTables.json` and the transfer golden — so a crossing routes to both, and
  # `scripts/ci-route.test.mjs` derives that census from the sources and fails when a crossing
  # routes to only one side.
  #
  # Deliberately NOT a workflow-level `paths:` filter: that skips the whole workflow,
  # `ci-ok` included, and a required check that never reports leaves every PR merge-blocked
  # forever. Filtering per job keeps `ci-ok` reporting on every push and every PR.
  changes:
    name: changes
    runs-on: ubuntu-22.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      core: ${{ steps.classify.outputs.core }}
      powershell: ${{ steps.classify.outputs.powershell }}
      storybook: ${{ steps.classify.outputs.storybook }}
      android: ${{ steps.classify.outputs.android }}
    steps:
      # The classification is a diff against the base, so this needs history, not a
      # depth-1 checkout. 188 commits of text — the full fetch costs a second or two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The router is a dependency-free Node script, so no `npm ci` — only a pinned Node, because
      # whatever the runner image ships is not a contract. `.nvmrc` is that pin for every job and
      # workflow here, and for a contributor's machine.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          # On a PR this is the base branch tip and HEAD is the merge commit, so the diff
          # is exactly the PR's own changes. On a push it is the previous tip of `main`.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A first push to a branch reports an all-zero `before`, and a force-push can
          # report a commit that no longer exists. Neither can be diffed, so both run
          # everything rather than guessing.
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit ('$BASE_SHA') — running every job."
            flags=$(node scripts/ci-route.mjs --all)
          else
            # `--no-renames` is load-bearing: with rename detection on (the default since
            # git 2.9) a file moved out of `src/` into `src-tauri/` is reported as the
            # destination path *only*, so the frontend job would skip a change that just
            # deleted one of its own files — a dangling import `tsc` would have caught.
            # Measured against a fixture repo: the move reports one path with detection on
            # and both paths with it off.
            files=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
            echo "Changed files vs $BASE_SHA:"
            echo "$files" | sed 's/^/  /'
            flags=$(printf '%s\n' "$files" | node scripts/ci-route.mjs)
          fi

          # Every output a job's `if:` reads must be printed, and printed as a boolean. A
          # missing one reads as `''`, every job gated on it skips, and `ci-ok` counts a skip
          # as a pass — so a router that printed nothing would take the gate green having run
          # nothing. Fail here instead.
          for job in frontend rust core powershell storybook android; do
            grep -Eqx "$job=(true|false)" <<< "$flags" \
              || { echo "ci-route.mjs printed no '$job=true|false' line:" >&2; echo "$flags" >&2; exit 1; }
          done

          echo "$flags" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed-path routing"
            echo
            echo "| job | runs |"
            echo "| --- | --- |"
            echo "$flags" | sed 's/^\([a-z]*\)=\(.*\)$/| \1 | `\2` |/'
          } >> "$GITHUB_STEP_SUMMARY"

  # **Five legs in parallel, where this was one serial job of 8–12 minutes.** Vitest alone was
  # 345–415 s for ~390 files on one runner, behind `npm run build` and `eslint .`, with
  # `build-storybook` after it — and branch protection is `strict`, so every merge into `main`
  # re-queues every open PR behind that whole critical path. One leg builds and lints; four split
  # the test files with vitest's `--shard`, which divides the collected files deterministically,
  # so a leg runs the same files on every run and a failure names its shard. Storybook's build is
  # a job of its own below.
  #
  # **The matrix is safe here because `ci-ok` reads `needs.frontend.result`**, which is
  # `failure` when any leg fails — the protected name is still `ci-ok`, never a leg's.
  # `fail-fast: false` so one red shard does not cancel the others and hide their failures.
  frontend:
    name: frontend (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: build + lint
          - part: vitest 1/4
            shard: 1/4
          - part: vitest 2/4
            shard: 2/4
          - part: vitest 3/4
            shard: 3/4
          - part: vitest 4/4
            shard: 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        if: ${{ !matrix.shard }}
        run: npm run build

      - name: Lint
        if: ${{ !matrix.shard }}
        run: npm run lint

      # No test reads `dist/` — `npm run build` feeds nothing here, which is what lets the shards
      # start at the same moment as the build leg rather than behind it.
      - name: Test (${{ matrix.shard }})
        if: ${{ matrix.shard }}
        run: npm run test:run -- --shard=${{ matrix.shard }}

  # The only gate the `.mdx` catalogue page has. Stories are `.tsx` under `src/`, so `tsc` and
  # ESLint already see them; `.storybook/DesignSystem.mdx` is seen by neither — `tsc` reads only
  # `.ts`/`.tsx`, and `eslint` reports "File ignored because no matching configuration was
  # supplied". It covers more than MDX: the Storybook build is also what compiles
  # `.storybook/preview.css` and the fake backend's entry points.
  #
  # **A job of its own since issue #559**, where it was the last step of `frontend` and a serial
  # minute or two on the critical path. It has its own `changes` output because it reads less
  # than `frontend` does: no `src-tauri/` or `crates/` file (the fake's parity with
  # `generate_handler!` is a vitest test, `.storybook/fake/parity.test.ts`, and runs in
  # `frontend`), and no `scripts/`. A job gated on a `changes` output belongs in every list of
  # jobs — `JOBS`, the classify check, `changes.outputs`, and `ci-ok`'s `needs` and loop.
  storybook:
    name: storybook
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build reads `frontendDist: "../dist"` and fails outright when the directory
      # is absent, so a Rust-only job cannot compile a fresh checkout. A stub keeps this
      # job parallel with `frontend` instead of serialized behind a full Vite build;
      # nothing under test reads it. It is also why this job is safe to run alone: the
      # frontend it "needs" is one file it writes itself.
      #
      # **Two bundles since the light app's Android host joined the workspace** (2026-10-03):
      # `mobile/src-tauri` reads `frontendDist: "../../dist-mobile"` the same way.
      - name: Stub the frontend bundle
        shell: bash
        run: |
          mkdir -p dist dist-mobile
          echo '<!doctype html><title>ci stub</title>' > dist/index.html
          echo '<!doctype html><title>ci stub</title>' > dist-mobile/index.html

      # `rust-toolchain.toml`'s pin, never `stable` — see that file.
      - uses: ./.github/actions/rust-toolchain

      # The cargo workspace is rooted at the repository since 2026-10-02 and still builds into
      # `src-tauri/target` — `.cargo/config.toml` pins it there — so the cache is told both
      # halves: where the lockfile is, and where the artifacts are.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"

      # Formatting has no platform split, so it runs once. Lints do: the source has
      # cfg-gated Windows paths that a Linux-only clippy pass never compiles.
      #
      # **All three run from the repository root, over both workspace members** (2026-10-02):
      # the app in `src-tauri` and the engine in `crates/grimoire-core`. This is the only job
      # that runs the core's tests, and the only one that compiles it for Windows — `core` below
      # builds it for the other two targets and runs nothing.
      #
      # **`fmt` names the two packages and never `--all`**, which follows path dependencies
      # into `crates/card-scanner` — not a member, and not rustfmt-clean (below). `--workspace`
      # has no such reach: clippy and the tests see the members and nothing else.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt -p mtg-grimoire -p grimoire-core -p grimoire-light --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # **The host as it ships, which nothing else in this job compiles** (2026-10-02). The
      # step above and the one below both build test targets, and `src-tauri` asks for
      # `grimoire-core`'s `testing` feature under `[dev-dependencies]` — so in both, the
      # core's test scaffolding is switched on for the app's ordinary library too, and a
      # non-test use of `schema::memory_pair` or `scratch::path` would pass them and first
      # fail in `tauri build`, on a release tag. This is the build with no dev-dependencies
      # in it.
      - name: cargo check (the shipped feature set)
        run: cargo check -p mtg-grimoire -p grimoire-light --locked

      # **And the resolver's own answer to "is `testing` on in that build"**, because one thing
      # behind the feature is not scaffolding: `image_uri::is_allowed_host` lets a loopback
      # host through under it, for the image fetcher's mock server. `platform::fence` reads
      # the workspace's manifests for the feature as text and several spellings pass a text
      # sweep — a `[workspace.dependencies]` entry, a renamed dependency, a default feature
      # that implies it. `cargo tree` sees them all.
      - name: The shipped build links the core without its test scaffolding
        shell: bash
        run: |
          set -euo pipefail
          # Every host by its package name — the desktop, and the light app's Android host.
          for host in mtg-grimoire grimoire-light; do
            tree=$(cargo tree -p "$host" -e features,normal,build -i grimoire-core --locked)
            echo "$tree"
            if echo "$tree" | grep -q 'feature "testing"'; then
              echo "grimoire-core's 'testing' feature is on in $host's build, which is not a test" >&2
              exit 1
            fi
          done

      - name: cargo test
        run: cargo test --workspace --locked

      # **The `card-scanner` crate's own suite, which ran in no CI job until 2026-09-08.** It is
      # a separate cargo package, excluded from the workspace on purpose, so the `cargo test`
      # above does not touch a line of it — and `session::tests` is where the `live.html` key
      # census, the panic guard and the reader cadence live. `npm run verify` was the only fence.
      # `--features cli` is what `verify` runs, so the debug server's tests are in it.
      #
      # **Test-only, on purpose.** The crate is not `cargo fmt`-clean and carries four
      # pre-existing clippy warnings — both measured and listed in
      # `docs/reference/card-scanner.md` §8 — so `fmt --check` and `clippy -D warnings` would go
      # red on day one for something this step is not about. Tidying it is its own commit.
      #
      # Linux only, like `cargo fmt` above: the crate has no `cfg`-gated platform paths, so a
      # second leg would compile `ocrs`/`rten` again to prove the same thing.
      #
      # **Two commands, because `cli` does not compile the `builder` binaries** (2026-09-15).
      # `build-hashes` and `eval` sit behind `builder` (`ureq` + `rayon`), so until the second line
      # a change that broke either — or a test inside them — went red only in
      # `scanner-bundle.yml`'s weekly run, which is the job that publishes what every release
      # embeds. `--bins` because the library's own tests already ran in the first command.
      #
      # **And a third, because one library module is `builder`-only** (2026-09-30, #703):
      # `synth` is `#[cfg(feature = "builder")]`, so neither line above compiled its tests —
      # including the one that proves the evaluation's frames are something the detector can
      # see. `--lib synth` runs that module alone rather than the whole library a second time.
      #
      # **`--target-dir` on every line, since the workspace** (2026-10-02). Cargo reads its config
      # from the working directory, never from `--manifest-path`, so run from the repository
      # root these would follow `.cargo/config.toml` into `src-tauri/target` — the app's tree,
      # and the one the cache above saves. The flag keeps this package building where it always
      # has; `crates/card-scanner/.cargo/config.toml` says the same to a run started inside it.
      - name: cargo test (card-scanner)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --locked --features cli --manifest-path crates/card-scanner/Cargo.toml --target-dir crates/card-scanner/target
          cargo test --locked --features builder --bins --manifest-path crates/card-scanner/Cargo.toml --target-dir crates/card-scanner/target
          cargo test --locked --features builder --lib synth --manifest-path crates/card-scanner/Cargo.toml --target-dir crates/card-scanner/target

  # **`grimoire-core` on the two targets a desktop build never touches** (2026-10-02). The engine
  # is moving out of `src-tauri` into a crate three hosts link — this desktop, an Android shell
  # and a WASM build — and a green `rust` job proves the host triple and nothing else: a `use`
  # that is desktop-only, a dependency that will not build for a triple and a `cfg` that leaves
  # a module unreachable are all invisible to it. The first attempt at these targets had the
  # same two gates and they were removed with it on 2026-09-27; this one starts the day the
  # crate exists, with whatever is in it, because a gate added after the extraction proves
  # nothing during it.
  #
  # **It is a compile gate, and it proves that much and no more**: the library builds for each
  # triple and lints clean there. Nothing in this job runs — no test (a cross-compiled harness
  # needs a device, an emulator or a browser to run on, hence `--lib` and never
  # `--all-targets`), no APK, no bundle. Whether the core *works* on a phone or in a browser is
  # still a hardware pass. **The Windows compile and the native test run are the `rust` job's**,
  # which reaches this crate through `--workspace`.
  #
  # Linux, and not as a preference: clang and the NDK are the same compilers on every host, MSVC
  # cannot emit WASM, and the Ubuntu images already ship an NDK. **No measured figure in this
  # repo comes off a Linux build**, and this job produces none.
  #
  # **24.04 for the clang version, and 22.04 genuinely does not work.** `sqlite-wasm-rs`'s
  # `shim/wasm-shim.h` declares `[[noreturn]] void rust_sqlite_wasm_abort();` — C23 attribute
  # syntax, which clang accepts in C mode by default only from **18**. Ubuntu 22.04's
  # `apt-get install clang` gives **14**, which rejects it with four `expected expression`
  # errors inside a `cargo:warning=` stream, so the real cause is buried in build-script output
  # and the visible failure is `cc-rs: command did not execute successfully`. Measured on the
  # first attempt's `wasm` job, not on this one — and the crate asks for that SQLite from its
  # first day (`rusqlite` in its wasm dependency table), so the floor is live from the first run.
  #
  # No `dist/` stub and no Node, unlike `rust`: the core has no `tauri-build`, so nothing here
  # asks for `frontendDist`.
  core:
    name: core (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, aarch64-linux-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `sqlite-wasm-rs` compiles SQLite's C amalgamation with `cc` targeting wasm32, and that
      # means clang. There is no way around it and no way to cache past it.
      - name: Install clang
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          # Printed, and checked, because the failure this guards is four errors deep in a
          # build script's warning stream — and `apt-get install clang` reads as correct and
          # pins nothing. 18 is the floor for C23 `[[noreturn]]`. A version that could not be
          # read fails too, rather than comparing as empty and passing.
          clang --version
          major=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          if ! [ "${major:-0}" -ge 18 ]; then
            echo "clang '${major}' is too old or unreadable: sqlite-wasm-rs's shim needs C23 attributes (clang 18+)" >&2
            exit 1
          fi

      # **`cargo` and `cc-rs` have never heard of `NDK_HOME`** — that variable is the Tauri
      # CLI's, and this job does not go through the CLI. Driving the target directly needs two
      # things set by hand, and each fails with an error naming something other than the cause:
      # clang on `PATH` (or `cc-rs` reports `failed to find tool "clang"` while compiling
      # `libsqlite3-sys`), and an explicit linker (or `rustc` reports ``linker `cc` not found``).
      #
      # **API 26 is the light host's `minSdkVersion`** (`mobile/src-tauri/tauri.conf.json`, held
      # by `mobile/host.test.ts`): the first attempt's level, carried over and settled with the
      # host in phase 4. This linker name moves with it.
      - name: Point cargo at the NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          set -euo pipefail
          # The runner image sets this; failing loudly beats compiling against a surprise.
          : "${ANDROID_NDK_LATEST_HOME:?the runner image did not set ANDROID_NDK_LATEST_HOME}"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$bin/aarch64-linux-android26-clang"
          # Named checks, because both of these fail later as something else entirely.
          [ -d "$bin" ] || { echo "no NDK toolchain bin at $bin" >&2; exit 1; }
          [ -x "$linker" ] || { echo "no API-26 linker at $linker" >&2; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
          "$linker" --version | head -1

      # `rust-toolchain.toml`'s pin, never `stable` — and the one target this leg builds for.
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"
          # A key per target: neither leg's artifacts are any use to the other or to the host
          # build, and one cache would thrash between them.
          key: core-${{ matrix.target }}

      - name: cargo build (${{ matrix.target }})
        run: cargo build --lib -p grimoire-core --locked --target ${{ matrix.target }}

      - name: cargo clippy (${{ matrix.target }})
        run: cargo clippy --lib -p grimoire-core --locked --target ${{ matrix.target }} -- -D warnings

  # **The light app's Android host, built into an APK** (phase 4, 2026-10-03). The `core` job
  # proves the engine *compiles* for `aarch64-linux-android`; this one links the host
  # (`mobile/src-tauri`) for it, packs the light bundle and the `.so` into an APK through the
  # committed `gen/android` Gradle project, and reports its size — the first APK this repository
  # has produced. **It is the Android toolchain Markus's machine does not have yet**: the
  # session that built the host could not reach `dl.google.com`, and the Ubuntu runner ships the
  # SDK, the NDK and JDK 21, so Markus chose CI as the place the APK is built (2026-10-03).
  #
  # **A release build, signed with the runner's debug key** (`gen/android/app/build.gradle.kts`,
  # by hand): installable and the size a shipped APK would be, but every runner mints its own
  # key, so one run's APK does not upgrade over another's. Signing and distribution are decided
  # after a real phone has run it. **arm64 only**, because that is every phone this app is for
  # and each further ABI is another release compile of the whole engine.
  #
  # **Nothing here runs the APK.** Installing it, the cold start and the first corpus ingest are
  # a device's or an emulator's to measure. The artifact is kept 14 days.
  #
  # **JDK 21, from the image**: `JAVA_HOME_21_X64` is the runner's own, and JDK 25 breaks the
  # Android Gradle and Kotlin plugins (the light-app spec §5). `npx tauri`, never `cargo tauri` —
  # the CLI is what points cargo at the NDK's clang and linker for each target, which the `core`
  # job above has to do by hand.
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Point the build at JDK 21, the SDK and the NDK
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?the runner image did not set JAVA_HOME_21_X64}"
          : "${ANDROID_HOME:?the runner image did not set ANDROID_HOME}"
          : "${ANDROID_NDK_LATEST_HOME:?the runner image did not set ANDROID_NDK_LATEST_HOME}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"
          key: android-aarch64

      # From `mobile/`, so the CLI finds `mobile/src-tauri/tauri.conf.json` — from the repository
      # root it finds the desktop's. `beforeBuildCommand` builds the light bundle into
      # `dist-mobile/` first.
      - name: Build the APK
        working-directory: mobile
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Report the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "the build produced no APK" >&2; exit 1; }
          bytes=$(stat -c %s "$apk")
          so=$(unzip -l "$apk" | awk '/lib\/arm64-v8a\/.*\.so$/ {print $1}' | head -1)
          echo "APK: $apk — $bytes bytes"
          {
            echo "### Light app APK (arm64, release, debug-signed)"
            echo
            echo "| | bytes | MiB |"
            echo "| --- | ---: | ---: |"
            echo "| APK | $bytes | $(awk "BEGIN {printf \"%.1f\", $bytes / 1048576}") |"
            echo "| \`libgrimoire_light_lib.so\`, uncompressed | ${so:-?} | $(awk "BEGIN {printf \"%.1f\", ${so:-0} / 1048576}") |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p apk-out && cp "$apk" apk-out/mtg-grimoire-light-arm64.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtg-grimoire-light-arm64
          path: apk-out/mtg-grimoire-light-arm64.apk
          retention-days: 14
          if-no-files-found: error

  # Branch protection pins required checks by name string, and a matrix job's name embeds
  # its matrix values — so protecting `rust (windows-latest)` would silently stop applying
  # the day the matrix changes. This fixed name is the protected check; the matrix
  # underneath stays free to change.
  powershell:
    name: powershell
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    # Windows, and not as a preference. `lock.ps1` is a Windows tool by construction: it
    # identifies a lock's holder by pid + process name + `StartTime`, and its whole reason
    # to exist is `tauri-plugin-single-instance` on WebView2. `Get-Process`'s `StartTime`
    # is not portable, so a Linux leg would not be a cheaper version of this job — it
    # would be a different and failing one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `npm ci`, no cargo, no toolchain setup: the test sets its own `MTG_LOCK_DIR`
      # (so it never touches the real lock directory or needs a git repo to find one) and
      # spawns short-lived `pwsh` sleepers as its fixtures. `pwsh` is preinstalled on
      # `windows-latest`.
      - name: Run the lock tool's tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/running-the-app/lock.test.ps1

      # The auto-PR guard: which pull requests a fan-out `-All` may touch. It needs no gh
      # and no network — the guards are pure functions of a PR object and the test builds
      # its own. Worth a gate because the failure it prevents is arming auto-merge on
      # release-please's PR, which would cut a release nobody asked for.
      - name: Run the auto-PR guard tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/auto-pr/pr-auto.test.ps1

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, frontend, rust, core, powershell, storybook, android]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail unless every dependency succeeded or was deliberately skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          CORE: ${{ needs.core.result }}
          POWERSHELL: ${{ needs.powershell.result }}
          STORYBOOK: ${{ needs.storybook.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "changes=$CHANGES frontend=$FRONTEND rust=$RUST core=$CORE powershell=$POWERSHELL storybook=$STORYBOOK android=$ANDROID"

          # `changes` is the one dependency that may never be skipped or fail. It decides
          # what the other two do, so if it dies they skip — and a rule that reads a skip
          # as a pass would take this check green having run nothing at all.
          [ "$CHANGES" = "success" ] || exit 1

          # A skip here is a deliberate answer from `changes`: that part of the repo did
          # not change, so it has nothing to prove. Every job gated on a `changes` output
          # belongs in this loop — one left out is a job whose failure the gate ignores.
          for result in "$FRONTEND" "$RUST" "$CORE" "$POWERSHELL" "$STORYBOOK" "$ANDROID"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
