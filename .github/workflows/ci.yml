name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which halves of the repo this change can possibly have broken. The two build jobs
  # share no inputs — `npm run build`/`lint`/`test:run` never read `src-tauri/`, and the
  # Rust job stubs the one frontend artefact it needs (see below) — so a change confined
  # to one side has nothing to prove on the other.
  #
  # Deliberately NOT a workflow-level `paths:` filter: that skips the whole workflow,
  # `ci-ok` included, and a required check that never reports leaves every PR merge-blocked
  # forever. Filtering per job keeps `ci-ok` reporting on every push and every PR.
  changes:
    name: changes
    runs-on: ubuntu-22.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      powershell: ${{ steps.classify.outputs.powershell }}
      wasm: ${{ steps.classify.outputs.wasm }}
      android: ${{ steps.classify.outputs.android }}
    steps:
      # The classification is a diff against the base, so this needs history, not a
      # depth-1 checkout. 188 commits of text — the full fetch costs a second or two.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          # On a PR this is the base branch tip and HEAD is the merge commit, so the diff
          # is exactly the PR's own changes. On a push it is the previous tip of `main`.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          frontend=false
          rust=false
          powershell=false
          wasm=false
          android=false

          # A first push to a branch reports an all-zero `before`, and a force-push can
          # report a commit that no longer exists. Neither can be diffed, so both run
          # everything rather than guessing.
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit ('$BASE_SHA') — running every job."
            files=""
            frontend=true
            rust=true
            powershell=true
            wasm=true
            android=true
          else
            # `--no-renames` is load-bearing: with rename detection on (the default since
            # git 2.9) a file moved out of `src/` into `src-tauri/` is reported as the
            # destination path *only*, so the frontend job would skip a change that just
            # deleted one of its own files — a dangling import `tsc` would have caught.
            # Measured against a fixture repo: the move reports one path with detection on
            # and both paths with it off.
            files=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
            echo "Changed files vs $BASE_SHA:"
            echo "$files" | sed 's/^/  /'
          fi

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # This file. A change to the gate re-runs the whole gate.
              .github/workflows/ci.yml)
                frontend=true
                rust=true
                powershell=true
                wasm=true
                android=true
                ;;

              # The wasm build's own inputs, and nothing else's. **Above `scripts/*` and
              # `src/*`**, both of which match more broadly and would route the wrong jobs
              # first — `case` is first-match-wins, the rule this whole block is ordered by.
              # `vite.web.config.ts` is not matched by the `vite.config.ts` arm below (that
              # one is a literal), but it is listed here so the pair reads as one decision.
              scripts/build-wasm.mjs|vite.web.config.ts)
                frontend=true
                wasm=true
                ;;

              # The frontend half of the web target. These three directories are what the
              # web bundle adds on top of the desktop one, and `npm run web:build` type-checks
              # and bundles all of it.
              src/workers/*|src/web/*|src/lib/core/*)
                frontend=true
                wasm=true
                ;;

              # Affects neither job. Nothing here is compiled, linted or tested: `eslint .`
              # never sees a `.md`, `vitest` only collects `src/**/*.test.{ts,tsx}`, and
              # release-please's own files are read by `release.yml` rather than by this
              # gate. Keep this list small — it is the only arm that can wrongly skip work.
              docs/*|*.md) ;;
              .vscode/*|.gitignore|.gitattributes) ;;
              .release-please-manifest.json|release-please-config.json) ;;
              .github/workflows/release.yml) ;;

              # PowerShell. The `powershell` job runs this repo's `.ps1` test files, and
              # nothing else here consumes a `.ps1`: `eslint` does not lint one, `vitest`
              # does not collect one, cargo does not read one. So a `.ps1` needs this job
              # and only this job.
              #
              # **This arm must stay above `src-tauri/*` and `scripts/*`.** `case` is
              # first-match-wins, and `scripts/` is on the frontend list solely because
              # `eslint .` lints it — which is untrue of a `.ps1`, so a `scripts/*.ps1`
              # matching the frontend arm first would run the wrong job and skip this one.
              #
              # It also narrows the `*)` fail-safe below, which previously sent every `.ps1`
              # to both build jobs: measured on PR #28, whose `lock.ps1` ran `frontend` and
              # the full `rust` matrix to prove nothing about either.
              #
              # `.psm1`/`.psd1` are here because a module or manifest `lock.ps1` imported
              # would otherwise fall through to `*)` — which runs the two build jobs and
              # skips the only job that would actually have tested it. That is the one
              # direction the fail-safe cannot cover, since it does not set `powershell`.
              *.ps1|*.psm1|*.psd1)
                powershell=true
                ;;

              # The two files under `gen/android/` that a Rust test actually reads, and they
              # must sit above the arm that silences the rest of that tree.
              # `the_generated_gradle_carries_the_floor_the_config_asked_for` and
              # `the_android_manifest_asks_for_the_internet_and_nothing_else` `include_str!`
              # exactly these — one pins `minSdk`/`targetSdk`/the debug suffix the APK is
              # really built with, the other pins the permission list to `INTERNET` alone. Both
              # are Kotlin-and-XML files that are also Rust test inputs, which is the case the
              # arm below explicitly assumed did not exist.
              src-tauri/gen/android/app/build.gradle.kts|src-tauri/gen/android/app/src/main/AndroidManifest.xml)
                rust=true
                ;;

              # The rest of the Android Gradle project. Nothing in either build job reads it:
              # `cargo` does not compile Kotlin, `eslint` does not lint a `.gradle.kts`, and the
              # Rust job builds for the host target only. Building an APK needs an SDK and an
              # NDK on the runner, which no job here installs. So this routes nowhere, exactly
              # like `docs/`.
              #
              # **It must sit above `src-tauri/*`** — `case` is first-match-wins, and the arm
              # below would otherwise run the whole clippy-and-test matrix on Windows *and*
              # Linux for a theme colour or a launcher icon.
              src-tauri/gen/android/*) ;;

              # Rust. The crate is self-contained: nothing under `src-tauri/` reads a file
              # outside it — every `include_str!` names its own `tauri.conf.json`, a
              # `capabilities/` file, one of the two `gen/android/` files routed above, or
              # `desktop.rs` itself — and the `dist/index.html` that `tauri-build` demands is
              # stubbed by the job itself.
              #
              # **Every change here can break the wasm build too.** It is one crate with two
              # targets, and a `use tauri::` added to a module on the wasm side of `lib.rs`'s
              # map compiles on desktop and fails there — with a fully green `npm run verify`.
              #
              # **And the Android one, which is a third target of the same crate.** It is the
              # closest of the three to the host build — `cfg(desktop)` is false but `tauri` is
              # still there — so it breaks in a narrower way and a rarer one, which is exactly
              # why nothing noticed the last time. It did break: #270 fixed a `main` that had
              # stopped cross-compiling, and an APK build was how anybody found out.
              src-tauri/*)
                rust=true
                wasm=true
                android=true
                ;;

              # Frontend. What `npm run build` (`tsc && vite build`), `eslint .` and
              # `vitest run` actually read. `scripts/` is in the list because `eslint .`
              # lints it — the ignore list is `dist/`, `src-tauri/`, `node_modules/` and
              # nothing else.
              src/*|public/*|index.html)
                frontend=true
                ;;
              package.json|package-lock.json|components.json|.prettierrc)
                frontend=true
                wasm=true
                ;;
              # `npm run web:build` is `tsc && vite build --config vite.web.config.ts`, and
              # that config merges `vite.config.ts` — so all four of these are wasm inputs too.
              tsconfig.json|tsconfig.node.json|vite.config.ts|eslint.config.js)
                frontend=true
                wasm=true
                ;;
              scripts/*)
                frontend=true
                ;;

              # Anything unrecognised runs everything. This is the fail-safe that makes the
              # lists above safe to be wrong in the cheap direction: a new root-level config
              # file, a new top-level directory, a path nobody thought about — all of it
              # gets full CI until someone deliberately narrows it here.
              *)
                frontend=true
                rust=true
                wasm=true
                android=true
                ;;
            esac
          done <<< "$files"

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "powershell=$powershell" >> "$GITHUB_OUTPUT"
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-path routing"
            echo
            echo "| job | runs |"
            echo "| --- | --- |"
            echo "| frontend | \`$frontend\` |"
            echo "| rust | \`$rust\` |"
            echo "| powershell | \`$powershell\` |"
            echo "| wasm | \`$wasm\` |"
            echo "| android | \`$android\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # The only gate the `.mdx` catalogue page has. Stories are `.tsx` under `src/`, so `tsc`
      # and ESLint already see them; `.storybook/DesignSystem.mdx` is seen by neither — `tsc`
      # reads only `.ts`/`.tsx`, and `eslint` reports "File ignored because no matching
      # configuration was supplied". It covers more than MDX: the Storybook build is also what
      # compiles `.storybook/preview.css` and the fake backend's entry points.
      #
      # In `frontend` rather than a job of its own because `frontend` already feeds `ci-ok`,
      # the one protected check; a new job would need adding to that aggregator's `needs:` to
      # have any teeth at all.
      - name: Build Storybook
        run: npm run build-storybook

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build reads `frontendDist: "../dist"` and fails outright when the directory
      # is absent, so a Rust-only job cannot compile a fresh checkout. A stub keeps this
      # job parallel with `frontend` instead of serialized behind a full Vite build;
      # nothing under test reads it. It is also why this job is safe to run alone: the
      # frontend it "needs" is one file it writes itself.
      - name: Stub the frontend bundle
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>ci stub</title>' > dist/index.html

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Formatting has no platform split, so it runs once. Lints do: the source has
      # cfg-gated Windows paths that a Linux-only clippy pass never compiles.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  wasm:
    name: wasm
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    # Linux only, and not as a preference: this compiles SQLite's C amalgamation to wasm32
    # with clang, which is the same compiler on every host. A Windows leg would prove the
    # same thing more slowly. **Note that no measured figure in this repo has ever come off
    # a Linux build** — this job is a compile gate, not a source of numbers.
    #
    # **24.04 for the clang version, and 22.04 genuinely does not work.** `sqlite-wasm-rs`'s
    # `shim/wasm-shim.h` declares `[[noreturn]] void rust_sqlite_wasm_abort();` — C23
    # attribute syntax, which clang accepts in C mode by default only from **18**. Ubuntu
    # 22.04's `apt-get install clang` gives **14**, which rejects it with four
    # `expected expression` errors inside a `cargo:warning=` stream, so the real cause is
    # buried in build-script output and the visible failure is `cc-rs: command did not
    # execute successfully`. 24.04 ships clang 18.
    #
    # The trap worth naming: `apt-get install clang` reads as correct and pins nothing. This
    # job was written and reviewed on a machine with clang 22, where it passes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # sqlite-wasm-rs compiles SQLite's C with `cc` targeting wasm32. There is no way
      # around this and no way to cache past it.
      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          # Printed, and checked, because the failure this guards is four errors deep in a
          # build script's warning stream. 18 is the floor for C23 `[[noreturn]]`.
          clang --version
          major=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          if [ "$major" -lt 18 ]; then
            echo "clang $major is too old: sqlite-wasm-rs's shim needs C23 attributes (clang 18+)" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Its own key: this target's artifacts share nothing with the host build's, and a
          # shared cache would thrash between the two jobs.
          key: wasm

      # Pinned, and `--locked`. The CLI must match the `wasm-bindgen` crate EXACTLY;
      # `scripts/build-wasm.mjs` re-checks that pair and refuses if they have drifted.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      # No `dist/` stub here, unlike the `rust` job: `build.rs` returns early for a wasm
      # TARGET, so `tauri_build` — which is what demands `frontendDist` — never runs.
      #
      # This step also checks something no compiler can: that every `#[wasm_bindgen]` entry
      # point the Worker imports is actually exported. Dropping that attribute compiles
      # clean with no warning at all, because the function stays `pub` in a `pub mod`.
      - name: Build the wasm core
        run: npm run build:wasm

      - name: cargo clippy (wasm)
        working-directory: src-tauri
        run: cargo clippy --lib --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Build the web bundle
        run: npm run web:build

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    # **This job exists because `main` can stop cross-compiling for Android and nothing goes
    # red.** It already did: #270 fixed a break that only surfaced when somebody built an APK
    # by hand, which is not a thing CI has ever done and not a thing anybody does on a
    # schedule. It is the same argument the `wasm` job was added on — one crate, more than one
    # target, and a fully green `npm run verify` proving only the host.
    #
    # **It is a compile gate and not an APK build.** Assembling one needs Gradle, a full SDK
    # and a signing story; `cargo build --lib` for the ARM64 target needs only the NDK, takes
    # a fraction of the time, and catches the whole class of failure this is for — a `use` that
    # is desktop-only, a dependency that will not build for the triple, a `cfg` that leaves a
    # module unreachable. Nothing here proves the app *runs* on a phone; that is still a
    # hardware pass.
    #
    # Linux for the same reason the `wasm` job is: the NDK is the compiler on every host, and
    # the Ubuntu runner images ship one already. **No measured figure in this repo comes off a
    # Linux build**, and this job produces none.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # `tauri-build` runs for this target — unlike wasm, where `build.rs` returns early — so
      # `frontendDist: "../dist"` has to exist or the build fails before it compiles anything.
      # The `rust` job's stub, for the `rust` job's reason: nothing under test reads it.
      - name: Stub the frontend bundle
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>ci stub</title>' > dist/index.html

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Its own key, for the `wasm` job's reason: this target shares no artifacts with the
          # host build, and one cache would thrash between the two.
          key: android

      # **`cargo` and `cc-rs` have never heard of `NDK_HOME`** — that variable is the Tauri
      # CLI's, and this job does not go through the CLI. Driving the target directly needs two
      # things set by hand, and each fails with an error naming something other than the cause:
      # clang on `PATH` (or `cc-rs` reports `failed to find tool "clang"` while compiling
      # `libsqlite3-sys` and `ring`), and an explicit linker (or `rustc` reports
      # ``linker `cc` not found``).
      #
      # **API 26 is not a choice made here** — it is `minSdk` in
      # `src-tauri/gen/android/app/build.gradle.kts`, which a Rust test already pins, so the
      # linker binary has to be the `26` one.
      - name: Point cargo at the NDK toolchain
        run: |
          set -euo pipefail
          # The runner image sets this; failing loudly beats compiling against a surprise.
          : "${ANDROID_NDK_LATEST_HOME:?the runner image did not set ANDROID_NDK_LATEST_HOME}"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$bin/aarch64-linux-android26-clang"
          # Named checks, because both of these fail later as something else entirely.
          [ -d "$bin" ] || { echo "no NDK toolchain bin at $bin" >&2; exit 1; }
          [ -x "$linker" ] || { echo "no API-26 linker at $linker" >&2; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
          "$linker" --version | head -1

      # `--lib` and not `--all-targets`: the test harness does not cross-compile usefully here
      # (it would need a device or an emulator to run on), and the question this job asks is
      # whether the library the APK links still builds for the triple.
      - name: cargo build (aarch64-linux-android)
        working-directory: src-tauri
        run: cargo build --lib --locked --target aarch64-linux-android

  # Branch protection pins required checks by name string, and a matrix job's name embeds
  # its matrix values — so protecting `rust (windows-latest)` would silently stop applying
  # the day the matrix changes. This fixed name is the protected check; the matrix
  # underneath stays free to change.
  powershell:
    name: powershell
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    # Windows, and not as a preference. `lock.ps1` is a Windows tool by construction: it
    # identifies a lock's holder by pid + process name + `StartTime`, and its whole reason
    # to exist is `tauri-plugin-single-instance` on WebView2. `Get-Process`'s `StartTime`
    # is not portable, so a Linux leg would not be a cheaper version of this job — it
    # would be a different and failing one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No `npm ci`, no cargo, no toolchain setup: the test sets its own `MTG_LOCK_DIR`
      # (so it never touches the real lock directory or needs a git repo to find one) and
      # spawns short-lived `pwsh` sleepers as its fixtures. `pwsh` is preinstalled on
      # `windows-latest`.
      - name: Run the lock tool's tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/running-the-app/lock.test.ps1

      # The auto-PR guard: which pull requests a fan-out `-All` may touch. It needs no gh
      # and no network — the guards are pure functions of a PR object and the test builds
      # its own. Worth a gate because the failure it prevents is arming auto-merge on
      # release-please's PR, which would cut a release nobody asked for.
      - name: Run the auto-PR guard tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/auto-pr/pr-auto.test.ps1

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, frontend, rust, powershell, wasm, android]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail unless every dependency succeeded or was deliberately skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          POWERSHELL: ${{ needs.powershell.result }}
          WASM: ${{ needs.wasm.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "changes=$CHANGES frontend=$FRONTEND rust=$RUST powershell=$POWERSHELL wasm=$WASM android=$ANDROID"

          # `changes` is the one dependency that may never be skipped or fail. It decides
          # what the other two do, so if it dies they skip — and a rule that reads a skip
          # as a pass would take this check green having run nothing at all.
          [ "$CHANGES" = "success" ] || exit 1

          # A skip here is a deliberate answer from `changes`: that part of the repo did
          # not change, so it has nothing to prove. Every job gated on a `changes` output
          # belongs in this loop — one left out is a job whose failure the gate ignores.
          for result in "$FRONTEND" "$RUST" "$POWERSHELL" "$WASM" "$ANDROID"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
