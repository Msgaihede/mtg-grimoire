name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A PR's runs share a group, so a new push cancels the stale run — the next one diffs the whole
# PR against its base and loses nothing. **A push to `main` gets a group of its own.** Its routing
# diffs from `github.event.before`, so a cancelled `main` run's changes are never routed again —
# and turning off `cancel-in-progress` alone would not save them, because GitHub still replaces a
# *pending* run in the same group with the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# **Every third-party action is pinned by commit SHA, the tag it was on in the comment**, and every
# checkout says `persist-credentials: false` — nothing here runs `git` against the remote after
# checking out (`changes` diffs history it already fetched), so the token has no reason to stay in
# `.git/config` for later steps to read. `release.yml` says why both matter; Dependabot keeps the
# SHAs current and `scripts/actions-pinned.test.mjs` fails on a floating tag or a kept token.
jobs:
  # Which jobs this change can possibly have broken. The decision is `scripts/ci-route.mjs`,
  # where every arm carries its reason; this job only finds the changed paths and hands them
  # over. **The two halves do read each other's files** — frontend tests read `src-tauri/` and
  # `crates/` sources as text, Rust tests read `src/lib/userTables.json`,
  # `src/lib/syncedTables.json` and the transfer golden — so a crossing routes to both, and
  # `scripts/ci-route.test.mjs` derives that census from the sources and fails when a crossing
  # routes to only one side.
  #
  # Deliberately NOT a workflow-level `paths:` filter: that skips the whole workflow,
  # `ci-ok` included, and a required check that never reports leaves every PR merge-blocked
  # forever. Filtering per job keeps `ci-ok` reporting on every push and every PR.
  changes:
    name: changes
    runs-on: ubuntu-22.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      powershell: ${{ steps.classify.outputs.powershell }}
      storybook: ${{ steps.classify.outputs.storybook }}
    steps:
      # The classification is a diff against the base, so this needs history, not a
      # depth-1 checkout. 188 commits of text — the full fetch costs a second or two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The router is a dependency-free Node script, so no `npm ci` — only a pinned Node, because
      # whatever the runner image ships is not a contract. `.nvmrc` is that pin for every job and
      # workflow here, and for a contributor's machine.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          # On a PR this is the base branch tip and HEAD is the merge commit, so the diff
          # is exactly the PR's own changes. On a push it is the previous tip of `main`.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A first push to a branch reports an all-zero `before`, and a force-push can
          # report a commit that no longer exists. Neither can be diffed, so both run
          # everything rather than guessing.
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit ('$BASE_SHA') — running every job."
            flags=$(node scripts/ci-route.mjs --all)
          else
            # `--no-renames` is load-bearing: with rename detection on (the default since
            # git 2.9) a file moved out of `src/` into `src-tauri/` is reported as the
            # destination path *only*, so the frontend job would skip a change that just
            # deleted one of its own files — a dangling import `tsc` would have caught.
            # Measured against a fixture repo: the move reports one path with detection on
            # and both paths with it off.
            files=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
            echo "Changed files vs $BASE_SHA:"
            echo "$files" | sed 's/^/  /'
            flags=$(printf '%s\n' "$files" | node scripts/ci-route.mjs)
          fi

          # Every output a job's `if:` reads must be printed, and printed as a boolean. A
          # missing one reads as `''`, every job gated on it skips, and `ci-ok` counts a skip
          # as a pass — so a router that printed nothing would take the gate green having run
          # nothing. Fail here instead.
          for job in frontend rust powershell storybook; do
            grep -Eqx "$job=(true|false)" <<< "$flags" \
              || { echo "ci-route.mjs printed no '$job=true|false' line:" >&2; echo "$flags" >&2; exit 1; }
          done

          echo "$flags" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed-path routing"
            echo
            echo "| job | runs |"
            echo "| --- | --- |"
            echo "$flags" | sed 's/^\([a-z]*\)=\(.*\)$/| \1 | `\2` |/'
          } >> "$GITHUB_STEP_SUMMARY"

  # **Five legs in parallel, where this was one serial job of 8–12 minutes.** Vitest alone was
  # 345–415 s for ~390 files on one runner, behind `npm run build` and `eslint .`, with
  # `build-storybook` after it — and branch protection is `strict`, so every merge into `main`
  # re-queues every open PR behind that whole critical path. One leg builds and lints; four split
  # the test files with vitest's `--shard`, which divides the collected files deterministically,
  # so a leg runs the same files on every run and a failure names its shard. Storybook's build is
  # a job of its own below.
  #
  # **The matrix is safe here because `ci-ok` reads `needs.frontend.result`**, which is
  # `failure` when any leg fails — the protected name is still `ci-ok`, never a leg's.
  # `fail-fast: false` so one red shard does not cancel the others and hide their failures.
  frontend:
    name: frontend (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: build + lint
          - part: vitest 1/4
            shard: 1/4
          - part: vitest 2/4
            shard: 2/4
          - part: vitest 3/4
            shard: 3/4
          - part: vitest 4/4
            shard: 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        if: ${{ !matrix.shard }}
        run: npm run build

      - name: Lint
        if: ${{ !matrix.shard }}
        run: npm run lint

      # No test reads `dist/` — `npm run build` feeds nothing here, which is what lets the shards
      # start at the same moment as the build leg rather than behind it.
      - name: Test (${{ matrix.shard }})
        if: ${{ matrix.shard }}
        run: npm run test:run -- --shard=${{ matrix.shard }}

  # The only gate the `.mdx` catalogue page has. Stories are `.tsx` under `src/`, so `tsc` and
  # ESLint already see them; `.storybook/DesignSystem.mdx` is seen by neither — `tsc` reads only
  # `.ts`/`.tsx`, and `eslint` reports "File ignored because no matching configuration was
  # supplied". It covers more than MDX: the Storybook build is also what compiles
  # `.storybook/preview.css` and the fake backend's entry points.
  #
  # **A job of its own since issue #559**, where it was the last step of `frontend` and a serial
  # minute or two on the critical path. It has its own `changes` output because it reads less
  # than `frontend` does: no `src-tauri/` or `crates/` file (the fake's parity with
  # `generate_handler!` is a vitest test, `.storybook/fake/parity.test.ts`, and runs in
  # `frontend`), and no `scripts/`. A job gated on a `changes` output belongs in every list of
  # jobs — `JOBS`, the classify check, `changes.outputs`, and `ci-ok`'s `needs` and loop.
  storybook:
    name: storybook
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # tauri-build reads `frontendDist: "../dist"` and fails outright when the directory
      # is absent, so a Rust-only job cannot compile a fresh checkout. A stub keeps this
      # job parallel with `frontend` instead of serialized behind a full Vite build;
      # nothing under test reads it. It is also why this job is safe to run alone: the
      # frontend it "needs" is one file it writes itself.
      - name: Stub the frontend bundle
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>ci stub</title>' > dist/index.html

      # `rust-toolchain.toml`'s pin, never `stable` — see that file.
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Formatting has no platform split, so it runs once. Lints do: the source has
      # cfg-gated Windows paths that a Linux-only clippy pass never compiles.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # **The `card-scanner` crate's own suite, which ran in no CI job until 2026-09-08.** It is
      # a separate cargo package rather than a workspace member, so the `cargo test` above does
      # not touch a line of it — and `session::tests` is where the `live.html` key census, the
      # panic guard and the reader cadence live. `npm run verify` was the only fence.
      # `--features cli` is what `verify` runs, so the debug server's tests are in it.
      #
      # **Test-only, on purpose.** The crate is not `cargo fmt`-clean and carries four
      # pre-existing clippy warnings — both measured and listed in
      # `docs/reference/card-scanner.md` §8 — so `fmt --check` and `clippy -D warnings` would go
      # red on day one for something this step is not about. Tidying it is its own commit.
      #
      # Linux only, like `cargo fmt` above: the crate has no `cfg`-gated platform paths, so a
      # second leg would compile `ocrs`/`rten` again to prove the same thing.
      #
      # **Two commands, because `cli` does not compile the `builder` binaries** (2026-09-15).
      # `build-hashes` and `eval` sit behind `builder` (`ureq` + `rayon`), so until the second line
      # a change that broke either — or a test inside them — went red only in
      # `scanner-bundle.yml`'s weekly run, which is the job that publishes what every release
      # embeds. `--bins` because the library's own tests already ran in the first command.
      - name: cargo test (card-scanner)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo test --locked --features cli --manifest-path crates/card-scanner/Cargo.toml
          cargo test --locked --features builder --bins --manifest-path crates/card-scanner/Cargo.toml

  # Branch protection pins required checks by name string, and a matrix job's name embeds
  # its matrix values — so protecting `rust (windows-latest)` would silently stop applying
  # the day the matrix changes. This fixed name is the protected check; the matrix
  # underneath stays free to change.
  powershell:
    name: powershell
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    # Windows, and not as a preference. `lock.ps1` is a Windows tool by construction: it
    # identifies a lock's holder by pid + process name + `StartTime`, and its whole reason
    # to exist is `tauri-plugin-single-instance` on WebView2. `Get-Process`'s `StartTime`
    # is not portable, so a Linux leg would not be a cheaper version of this job — it
    # would be a different and failing one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `npm ci`, no cargo, no toolchain setup: the test sets its own `MTG_LOCK_DIR`
      # (so it never touches the real lock directory or needs a git repo to find one) and
      # spawns short-lived `pwsh` sleepers as its fixtures. `pwsh` is preinstalled on
      # `windows-latest`.
      - name: Run the lock tool's tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/running-the-app/lock.test.ps1

      # The auto-PR guard: which pull requests a fan-out `-All` may touch. It needs no gh
      # and no network — the guards are pure functions of a PR object and the test builds
      # its own. Worth a gate because the failure it prevents is arming auto-merge on
      # release-please's PR, which would cut a release nobody asked for.
      - name: Run the auto-PR guard tests
        shell: pwsh
        run: pwsh -NoProfile -File .claude/skills/auto-pr/pr-auto.test.ps1

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, frontend, rust, powershell, storybook]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail unless every dependency succeeded or was deliberately skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          POWERSHELL: ${{ needs.powershell.result }}
          STORYBOOK: ${{ needs.storybook.result }}
        run: |
          echo "changes=$CHANGES frontend=$FRONTEND rust=$RUST powershell=$POWERSHELL storybook=$STORYBOOK"

          # `changes` is the one dependency that may never be skipped or fail. It decides
          # what the other two do, so if it dies they skip — and a rule that reads a skip
          # as a pass would take this check green having run nothing at all.
          [ "$CHANGES" = "success" ] || exit 1

          # A skip here is a deliberate answer from `changes`: that part of the repo did
          # not change, so it has nothing to prove. Every job gated on a `changes` output
          # belongs in this loop — one left out is a job whose failure the gate ignores.
          for result in "$FRONTEND" "$RUST" "$POWERSHELL" "$STORYBOOK"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
