name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# **Nothing at the workflow level; every job names what it needs.** This granted `contents`,
# `issues` and `pull-requests: write` to every job until 2026-09-28, so a build leg — which runs
# tauri-action, rust-cache, every npm install script and every cargo build script — could open
# pull requests and edit issues it never had any reason to touch.
permissions: {}

# **Every third-party action is pinned by commit SHA, with the tag it was on in the comment.** A
# tag is mutable: whoever can push to that action's repository can repoint `@v1` at new code, and
# the next release here would run it with a write token beside the release it is building.
# Dependabot (`.github/dependabot.yml`) moves the SHA and the comment together, and
# `scripts/actions-pinned.test.mjs` fails on any `uses:` that is neither local nor a 40-character
# SHA, and on any checkout that leaves its token behind (`persist-credentials: false`).
#
# **The three hosts ship from one tag** (light app phase 6, step 6.6, 2026-10-04). One core means
# one user schema per commit, and sync stamps every op with the sender's: a device on an older
# build holds an op stamped newer until it updates. So a host that ships ahead of the others
# strands them, and this file is where they are kept together:
#
#   release-please ─┬─ build (windows, linux) ──────────────┬─ web-deploy ── publish
#                   ├─ android ── android-sign ─────────────┤
#                   └─ web ──────────────────────────────────┘
#                                         (publish also needs build and android-sign)
#
# The two jobs that hold a secret — `android-sign`, `web-deploy` — build nothing, take what they
# hold from the `release` environment (one only `main` may use once the owner has restricted it —
# docs/reference/ci-and-releases.md, "What only the owner can do", step 0; until then any
# branch's workflow can), and each ends green and says so when its values are not set. **The
# Android host leaves this workflow as a signed bundle the owner uploads to Google Play**;
# nothing Android is attached to the release.
# docs/reference/ci-and-releases.md, "The release rule", has the reasons and what only the
# owner can do.
#
# **`on:` is a push to `main` and nothing else.** Not `workflow_dispatch`, not `pull_request`:
# either would let a branch's copy of this file ask for the release environment's values, and
# the environment's branch rule would be the only thing between them and a pull request.
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-22.04
    # Tags and releases, the release branch and its PR, and the labels it keeps on that PR.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    # Uploads to the draft: tauri-action's bundles, and the portable zip below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      # `id` is real but undocumented in the action's README. If it ever stops being
      # emitted, tauri-action would fall back to tag matching and could create a SECOND
      # release. Fail loudly instead.
      - name: Refuse to build without a release id
        shell: bash
        run: |
          if [ -z "${{ needs.release-please.outputs.release_id }}" ]; then
            echo "release-please emitted no release id; refusing to build."
            exit 1
          fi

      # `persist-credentials: false` everywhere: without it the token stays in `.git/config` for
      # every later step to read, and nothing after a checkout here runs `git` against the remote
      # — every upload is `gh` or tauri-action, each handed its token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # tauri-action does NOT install frontend dependencies. It DOES run
      # beforeBuildCommand (`npm run build`), so do not run that here as well.
      - run: npm ci

      # The scanner's hash bundle and OCR models are embedded into the binary (build.rs sets
      # cfg(scanner_assets)). A release without them cannot scan, so this fails the leg.
      - name: Scanner assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run scanner:assets

      # `rust-toolchain.toml`'s pin, never `stable` — see that file.
      - uses: ./.github/actions/rust-toolchain

      # The cargo workspace is rooted at the repository since 2026-10-02 and still builds into
      # `src-tauri/target` (`.cargo/config.toml`), which is where the portable step below looks.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} -- --locked

      # productName does not rename the binary in Tauri v2, so this really is the
      # lowercase hyphenated Cargo package name. The exe is self-contained: frontend
      # assets are embedded and SQLite is `bundled`. Run from any folder it writes
      # <exe dir>/data, which is the portable behaviour no Program Files install reaches.
      - name: Package the portable Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $zip = "mtg-grimoire-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path src-tauri/target/release/mtg-grimoire.exe -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach the portable zip to the draft release
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$PORTABLE_ZIP" --clobber --repo "${{ github.repository }}"

  # **The light app's Android build, at the tag** — `ci.yml`'s `android` job, step for step: the
  # same runner, JDK 21, NDK, toolchain action, cache key and `npx tauri android build`. It
  # holds no secret, so what Gradle signs with is the runner's debug key, exactly as in a pull
  # request. That signature never leaves this workflow: `android-sign` below replaces it on the
  # bundle, or nothing is handed on. The APK the same run makes stays in this job.
  #
  # **It runs whether or not there is a key to sign with.** A tag the Android app cannot be
  # built from is a release that would ship two hosts and not the third, and that is a red run,
  # not a skip.
  android:
    name: android (build)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    # A cold release compile of the engine for arm64, then Gradle. A job has six hours by
    # default, and `publish` waits on this one.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Point the build at JDK 21, the SDK and the NDK
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?the runner image did not set JAVA_HOME_21_X64}"
          : "${ANDROID_HOME:?the runner image did not set ANDROID_HOME}"
          : "${ANDROID_NDK_LATEST_HOME:?the runner image did not set ANDROID_NDK_LATEST_HOME}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"
          key: android-aarch64

      # From `mobile/`, so the CLI finds the light host's `tauri.conf.json`, as in `ci.yml` — and
      # the same line, so a release runs a command every pull request ran.
      - name: Build the APK and the bundle
        working-directory: mobile
        run: npx tauri android build --apk --aab --target aarch64 --ci

      # The `versionName` and `versionCode` come from `tauri.conf.json`'s `version`, which
      # release-please bumped in the commit this run is on. Held here, before anything is signed:
      # a bundle that says another version is one Play Console refuses after the release has run.
      - name: Find the bundle, and hold it to the release's version
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/android-release/check-version.sh "$VERSION"
          aab=$(find mobile/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "the build produced no bundle" >&2; exit 1; }
          mkdir -p aab-out && cp "$aab" aab-out/mtg-grimoire-light-arm64.aab
          ls -l aab-out

      # Handed to `android-sign`, and to no other job: this is the debug-signed build, and its
      # name says so. Fourteen days, so a sign job that failed can be run again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab-debug-signed
          path: aab-out/mtg-grimoire-light-arm64.aab
          retention-days: 14
          if-no-files-found: error

  # **The upload key, in a job of its own.** This is the one structural rule the removed `sign`
  # job left behind (docs/reference/ci-and-releases.md): a signing key never sits in a build
  # leg, because a build leg runs every npm lifecycle script, every cargo build script and every
  # Gradle plugin, and any of them can read a file or an environment. So this job runs none of
  # them — no `npm ci`, no cargo, no Gradle. It checks out the scripts, downloads the bundle the
  # job above built, and re-signs it with the JDK's own `jarsigner`
  # (`scripts/android-release/sign-bundle.sh`, which `ci.yml`'s `android` job proves on
  # throwaway keys in every pull request that can have changed the bundle).
  # `scripts/release-rule.test.mjs` holds the rule.
  #
  # **The signed bundle goes to Google Play, by the owner's hand, and nowhere else** (decided
  # 2026-10-07: Play is the only place the Android app is published). So this job attaches
  # nothing to the release and can write nothing to the repository: what it signed leaves as the
  # artifact `play-upload-bundle`, and the summary says where to upload it. **A release is
  # therefore not on phones when this run ends** — it is when the owner has uploaded the bundle
  # and Play has reviewed it.
  #
  # **It is an upload key.** Google holds the key Play signs installs with (Play App Signing)
  # and can reset this one if it is lost, so it is not the unrecoverable thing an APK's signing
  # key is. It is still held to a committed fingerprint
  # (`mobile/src-tauri/release-signer.sha256`): a keystore pasted into the settings by mistake
  # is refused here, by name, and not by Play Console after the release has run.
  #
  # **With no key it signs nothing and ends green**, saying so in the summary. **With some of
  # the three key values and not all, it fails**: that is a mistake in the settings, and a skip
  # would hide it for as long as nobody looked. **With a key and no committed fingerprint it
  # signs nothing either**, and says which.
  #
  # **`environment: release`**, and with it the key: a repository-level value is handed to any
  # workflow on any branch of this repository that asks for it, where an environment's is handed
  # only to a job that names the environment, from a branch the environment allows — `main`
  # alone once the owner has restricted it (docs/reference/ci-and-releases.md, "What only the
  # owner can do", step 0). Until then the environment has no branch rule, and a workflow on any
  # branch can name it.
  android-sign:
    name: android (sign for Play)
    needs: [release-please, android]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # Reads the checkout and the artifact. It uploads nothing to the release.
    permissions:
      contents: read
    steps:
      # The scripts, and the fingerprint the next step looks for. Nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job's `if:` cannot ask whether a value is set, so a step does and says what it found.
      # **It is told whether each is set, never what it is**: the expressions below are `true`
      # or `false`, so no key material is in this step's environment.
      - name: Is there a key to sign with, and a fingerprint to hold it to
        id: key
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          PIN: mobile/src-tauri/release-signer.sha256
        run: |
          set -euo pipefail
          missing=""
          found=0
          has() { if [ "$2" = true ]; then found=$((found + 1)); else missing="$missing $1"; fi; }
          has ANDROID_KEYSTORE_BASE64 "$HAS_KEYSTORE"
          has ANDROID_KEYSTORE_PASSWORD "$HAS_KEYSTORE_PASSWORD"
          has ANDROID_KEY_PASSWORD "$HAS_KEY_PASSWORD"
          if [ -n "$missing" ] && [ "$found" -gt 0 ]; then
            echo "Some of the upload key's values are set in the release environment and these are not:$missing" >&2
            echo "Set all three or none — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          if [ -z "$missing" ] && [ -f "$PIN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Android bundle — not signed"
            echo
            if [ -n "$missing" ]; then
              echo "This release has **no bundle to upload to Google Play**. The \`release\` environment"
              echo "holds no upload key (\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_PASSWORD\`), and Play takes no bundle signed with a runner's debug key."
            else
              echo "⚠️ This release has **no bundle to upload to Google Play, although the upload key is"
              echo "set**: this tag holds no \`$PIN\`. Without the certificate's fingerprint in the tree"
              echo "nothing says the key in the settings is the one Play Console knows. Commit the"
              echo "fingerprint; the next release signs a bundle."
            fi
            echo "The bundle was built at this tag, so the tag is known to build one."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.key.outputs.present == 'true'
        with:
          name: android-aab-debug-signed
          path: aab-in

      # The only step the key reaches. The keystore is decoded into the runner's temp folder,
      # outside the checkout, readable by this user alone (`umask 077`), and deleted when the
      # step ends, however it ends. **The alias is a plain word and not a secret**: GitHub would
      # mask every `mtg-grimoire` in this job's log — the bundle's own name among them — if it
      # were one.
      - name: Sign the bundle with the upload key
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: mtg-grimoire
          ANDROID_SIGNER_PIN: mobile/src-tauri/release-signer.sha256
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?the runner image did not set JAVA_HOME_21_X64}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          # The decoded keystore is the only copy the tools need; the base64 need not ride in their environment.
          unset ANDROID_KEYSTORE_BASE64
          aab="mtg-grimoire-$VERSION-android.aab"
          bash scripts/android-release/sign-bundle.sh aab-in/mtg-grimoire-light-arm64.aab "$aab"
          echo "SIGNED_AAB=$aab" >> "$GITHUB_ENV"
          IFS=. read -r major minor patch <<< "$VERSION"
          {
            echo
            echo "**Upload \`$aab\` to Play Console** — it is this run's artifact \`play-upload-bundle\`."
            echo "*Test and release* → the track → *Create new release*. Its versionCode is $((major * 1000000 + minor * 1000 + patch))."
            echo
            echo "Until it is uploaded and Play has reviewed it, phones stay on the previous version:"
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*."
          } >> "$GITHUB_STEP_SUMMARY"

      # Thirty days: long enough for the owner to upload it, and not an archive — Play Console
      # keeps every bundle it was given. Anyone signed in to GitHub can download a public
      # repository's artifact; this one is no secret, and only the Console's owner can upload it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          name: play-upload-bundle
          path: ${{ env.SIGNED_AAB }}
          retention-days: 30
          if-no-files-found: error

  # **The web app, built at the tag and opened in a browser** — `ci.yml`'s `web` job, step for
  # step, less the lint and the size report: clang 18, the wasm target, the `wasm-bindgen` CLI at
  # the lockfile's version, `web:wasm`, `web:build`, and the offline first run in the image's own
  # Chrome. It holds no secret and deploys nothing; what it leaves is `dist-web/`, as an artifact
  # for `web-deploy`.
  #
  # **It runs whether or not there is a token to deploy with**, for `android`'s reason: a tag the
  # web app cannot be built from, or whose first run fails in a browser, is not a release.
  web:
    name: web (build)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    # The `wasm-bindgen` CLI compiled from source on a cold cache, the module, the page and the
    # smoke run, which has ten minutes of its own.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          clang --version
          major=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          if ! [ "${major:-0}" -ge 18 ]; then
            echo "clang '${major}' is too old or unreadable: sqlite-wasm-rs's shim needs C23 attributes (clang 18+)" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> src-tauri/target"
          key: web-wasm32

      # Read from `Cargo.lock`, never typed here — `ci.yml` has the argument, and
      # `scripts/toolchain.test.mjs` holds every workflow to this line's shape.
      - name: Install the wasm-bindgen CLI the lockfile resolves
        shell: bash
        run: |
          set -euo pipefail
          versions=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; print }' Cargo.lock \
            | sed -n 's/^version = "\([^"]*\)"$/\1/p')
          count=$(grep -c . <<< "$versions" || true)
          if [ "$count" != 1 ]; then
            echo "Cargo.lock resolves the wasm-bindgen crate $count times; the CLI can match exactly one:" >&2
            echo "$versions" >&2
            exit 1
          fi
          bindgen=$versions
          echo "Cargo.lock resolves wasm-bindgen $bindgen"
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          installed=$(wasm-bindgen --version)
          echo "$installed"
          case "$installed" in
            "wasm-bindgen $bindgen" | "wasm-bindgen $bindgen "*) ;;
            *)
              echo "the wasm-bindgen on PATH is '$installed', not $bindgen" >&2
              exit 1
              ;;
          esac

      - name: Build the module
        run: npm run web:wasm

      - name: Build the page
        run: npm run web:build

      # What a deploy cannot do without: the document, the policy and caching rules
      # (`_headers`, parsed at deploy and never served), and the service worker, which
      # `web:build` writes last.
      - name: Check the bundle is whole
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html _headers sw.js; do
            [ -s "dist-web/$file" ] || { echo "dist-web/$file is missing or empty" >&2; exit 1; }
          done
          ls dist-web

      - name: Find Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$chrome" ] && [ -n "${CHROME_BIN:-}" ] && [ -x "$CHROME_BIN" ]; then
            chrome=$CHROME_BIN
          fi
          if [ -z "$chrome" ]; then
            echo "this runner has no google-chrome on PATH and no usable CHROME_BIN" >&2
            exit 1
          fi
          version=$("$chrome" --version)
          echo "$chrome: $version"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Open the built app in headless Chrome
        timeout-minutes: 10
        run: npm run web:smoke

      # The bundle `web-deploy` uploads, and the record of what a release deployed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bundle
          path: dist-web/
          retention-days: 14
          if-no-files-found: error

  # **The one job in this repository that deploys anything, and it deploys one Worker**: the web
  # app's hosting, `app-worker/`, to https://mtg-grimoire.app. The owner decided on 2026-10-04
  # that a release deploys it — one core means one user schema per commit, so the three hosts
  # ship from one tag (docs/reference/ci-and-releases.md, "The release rule"). **The relay is
  # deployed by no job**: it holds secrets and a D1 with real entitlements, and its deploys stay
  # by hand. `scripts/release-rule.test.mjs` fails a second `wrangler` line in any workflow.
  #
  # **The token, in a job of its own**, for `android-sign`'s reason and a wider blast radius: a
  # token that can deploy this Worker can, unless it was scoped down, deploy over the relay on the
  # same account. So this job runs no build: no root `npm ci`, no cargo. It checks out the
  # Worker's configuration and downloads the bundle `web` built and opened in a browser.
  #
  # **`wrangler` is pinned by a lockfile, and installed with no script run and no token in
  # reach.** `npx wrangler@4.146.0` pinned one package of ninety-one: the rest came through
  # floating ranges, resolved on the day, and two of them (`esbuild`, `workerd`) run a
  # `postinstall` — in the step that held the token. So `app-worker/package-lock.json` names
  # every one with its integrity hash, `npm ci --ignore-scripts` installs exactly those in a step
  # whose environment holds nothing, and the step that holds the token runs
  # `npx --no-install wrangler`, which installs nothing and fails if it is not there.
  # `scripts/release-rule.test.mjs` holds both lines to the letter.
  # The account id is kept out of the tree too: it is in no file of this repository.
  #
  # **It waits for the desktop builds and the bundle**, and is the last thing before `publish`. A
  # deploy is live the moment it returns, and a release is a draft until `publish` — so the
  # deploy goes as late as it can, when nothing but its own probe and the flip of the draft can
  # still fail.
  #
  # **With no token it deploys nothing and ends green**, saying so in the summary — and saying
  # what that leaves: the address serves the previous deploy until somebody deploys this tag by
  # hand. With one of the two values and not the other, it fails.
  #
  # **`environment: release`**, for `android-sign`'s reason: the token is handed only to a job
  # that names the environment, and from `main` alone once the owner has restricted the
  # environment to it (step 0 of "What only the owner can do"); until then, from any branch.
  web-deploy:
    name: web (deploy)
    needs: [release-please, build, android-sign, web]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      # `app-worker/` — `wrangler.jsonc`, the script, the lockfile — and the probe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Told whether each is set, never what it is — as in `android-sign`.
      - name: Is there a token to deploy with
        id: token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          missing=""
          found=0
          has() { if [ "$2" = true ]; then found=$((found + 1)); else missing="$missing $1"; fi; }
          has CLOUDFLARE_API_TOKEN "$HAS_TOKEN"
          has CLOUDFLARE_ACCOUNT_ID "$HAS_ACCOUNT"
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$found" -gt 0 ]; then
            echo "One of the deploy's two values is set in the release environment and this one is not:$missing" >&2
            echo "Set both or neither — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Web app — not deployed"
            echo
            echo "**https://mtg-grimoire.app still serves the previous deploy.** The \`release\`"
            echo "environment holds no \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`, so this"
            echo "release deployed nothing. The web app was built at $TAG and opened in a browser,"
            echo "so the tag is known to build one."
            echo
            echo "If this release moved the user schema, a browser paired with a desktop that"
            echo "updates to it holds that desktop's changes until the web app is deployed from"
            echo "$TAG by hand — \`app-worker/README.md\`, *The steps, in order*."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      # **A deploy is not a release's to make twice.** This job can be run again long after its
      # run — *Re-run jobs* — and it would upload this tag's bundle over whatever a later release
      # deployed: an older user schema in front of desktops that have moved on. So it asks which
      # release is the newest published one and refuses to deploy anything older. On a first run
      # that is the previous release (this one is still a draft), which is older, and it goes on.
      - name: Refuse to deploy an older release over a newer one
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -1)
          echo "this run's tag: $TAG; the newest published release: $latest"
          if [ "$newest" != "$TAG" ]; then
            echo "$latest is published and is newer than $TAG: deploying $TAG's bundle would put an older web app in front of it. Nothing was deployed." >&2
            exit 1
          fi

      # For `npm ci`, `npx` and the probe, which is a plain `.mjs`. No `cache:` — a cache is
      # one more thing that could hand this job bytes the lockfile did not name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc

      # Where `wrangler.jsonc`'s `assets.directory` (`../dist-web`) looks.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.token.outputs.present == 'true'
        with:
          name: web-bundle
          path: dist-web

      # `web` checked this before it uploaded; asked again here because after the next step is
      # too late. `wrangler deploy` uploads whatever the directory holds, and a bundle without
      # `_headers` deploys as an app with no policy and no caching rules.
      - name: Check the bundle arrived whole
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html _headers sw.js; do
            [ -s "dist-web/$file" ] || { echo "dist-web/$file is missing or empty" >&2; exit 1; }
          done

      # `wrangler` and everything under it, from `app-worker/package-lock.json` and nowhere else:
      # each tarball checked against the hash the lockfile holds, and **no lifecycle script run**
      # — `esbuild`'s and `workerd`'s `postinstall` only swap a JS launcher for the native binary
      # it would start anyway, and each finds its platform package without it. This step's
      # environment holds no token: what it installs is not run until the next one.
      - name: Install the lockfile's packages, running no script
        if: steps.token.outputs.present == 'true'
        working-directory: app-worker
        run: npm ci --ignore-scripts

      # The only step the token reaches, and the only `wrangler` in any workflow.
      # `--no-install`: what runs is what the step above installed, or nothing.
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        working-directory: app-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy

      # The runbook's cheapest probes, asked of the real address: the document answers 200, its
      # Content-Security-Policy is the built `_headers` line, and the document is this bundle's.
      # ⚠️ **A failure here leaves the web app deployed and the release a draft** — the summary
      # says which question failed, and docs/reference/ci-and-releases.md says what to do then.
      - name: Ask the host
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 5
        run: node scripts/web-deploy-probe.mjs dist-web

  # **Publishes only when all three hosts are through.** `build` is the desktop's; `android-sign`
  # ends green with the bundle signed or with no key to sign it; `web-deploy` ends green with the
  # address serving this tag or with no token to deploy it. A failure in any of them — or in
  # `android` or `web`, which those two need — leaves the release a draft: a release that
  # publishes two hosts and not the third is what the rule exists to prevent.
  publish:
    name: publish
    needs: [release-please, build, android-sign, web-deploy]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    # Flips the draft to published, and nothing else.
    permissions:
      contents: write
    steps:
      # The release goes public only once the desktop's assets are attached and the Android bundle
      # is signed, or knowingly not signed because no key is set (it is an artifact, not a release
      # asset). A `sign` job sat
      # between the two from 2026-09-28 to 2026-09-29 and was removed: there was no key to sign
      # with. docs/reference/in-app-updates.md records what the updater trusts without it.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --draft=false --repo "${{ github.repository }}"
