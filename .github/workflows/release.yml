name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# **Nothing at the workflow level; every job names what it needs.** This granted `contents`,
# `issues` and `pull-requests: write` to every job until 2026-09-28, so a build leg — which runs
# tauri-action, rust-cache, every npm install script and every cargo build script — could open
# pull requests and edit issues it never had any reason to touch.
permissions: {}

# **Every third-party action is pinned by commit SHA, with the tag it was on in the comment.** A
# tag is mutable: whoever can push to that action's repository can repoint `@v1` at new code, and
# the next release here would run it with a write token beside the release it is building.
# Dependabot (`.github/dependabot.yml`) moves the SHA and the comment together, and
# `scripts/actions-pinned.test.mjs` fails on any `uses:` that is neither local nor a 40-character
# SHA, and on any checkout that leaves its token behind (`persist-credentials: false`).
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-22.04
    # Tags and releases, the release branch and its PR, and the labels it keeps on that PR.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    # Uploads to the draft: tauri-action's bundles, and the portable zip below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      # `id` is real but undocumented in the action's README. If it ever stops being
      # emitted, tauri-action would fall back to tag matching and could create a SECOND
      # release. Fail loudly instead.
      - name: Refuse to build without a release id
        shell: bash
        run: |
          if [ -z "${{ needs.release-please.outputs.release_id }}" ]; then
            echo "release-please emitted no release id; refusing to build."
            exit 1
          fi

      # `persist-credentials: false` everywhere: without it the token stays in `.git/config` for
      # every later step to read, and nothing after a checkout here runs `git` against the remote
      # — every upload is `gh` or tauri-action, each handed its token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # tauri-action does NOT install frontend dependencies. It DOES run
      # beforeBuildCommand (`npm run build`), so do not run that here as well.
      - run: npm ci

      # The scanner's hash bundle and OCR models are embedded into the binary (build.rs sets
      # cfg(scanner_assets)). A release without them cannot scan, so this fails the leg.
      - name: Scanner assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run scanner:assets

      # `rust-toolchain.toml`'s pin, never `stable` — see that file.
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} -- --locked

      # productName does not rename the binary in Tauri v2, so this really is the
      # lowercase hyphenated Cargo package name. The exe is self-contained: frontend
      # assets are embedded and SQLite is `bundled`. Run from any folder it writes
      # <exe dir>/data, which is the portable behaviour no Program Files install reaches.
      - name: Package the portable Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $zip = "mtg-grimoire-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path src-tauri/target/release/mtg-grimoire.exe -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach the portable zip to the draft release
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$PORTABLE_ZIP" --clobber --repo "${{ github.repository }}"

  # **Signs the two files the in-app updater installs, and is a job of its own on purpose.** The
  # updater (`src-tauri/src/update.rs`) refuses a portable zip or an NSIS setup without a minisign
  # signature from the key compiled into it, so this job's secret is the whole of what makes an
  # update trustworthy.
  #
  # **Never in the build job.** A build leg runs a great deal of other people's code — tauri-action,
  # rust-cache, every npm install script and every cargo build script in the tree — and any of it
  # can read a secret in the same job and send it anywhere. A leaked signing key signs arbitrary
  # updates for ever, from anywhere, for every install that trusts it; that is the one outcome this
  # design exists to prevent, and no later fix unleaks it. So the secret lives here, beside
  # nothing but a pinned checkout, a pinned Node and `scripts/update-signing.mjs`, which is
  # `node:crypto` and `node:fs` and nothing else: **no `npm ci`, no third-party action, and the
  # secret on one step only.**
  #
  # **What it signs is what the draft holds**, downloaded by its uploaded name — GitHub's dotted
  # spelling of the NSIS setup — so `<asset>.minisig` is exactly the name the updater looks for.
  # The trusted comment is `mtg-grimoire <version> <kind>`, and the updater requires it to name
  # the release it is installing and its own install kind, which is what stops an older release's
  # signed build being replayed onto a newer one. The version comes from release-please's output,
  # which is `tag_name` without its `v` — the updater's `ReleaseInfo::version` exactly.
  #
  # **Fail-safe**: an unset `UPDATE_SIGNING_KEY` makes the script exit 1, this job fails, and
  # `publish` — which needs it — never runs, so the draft stays a draft. A release without
  # signatures never goes public. The repository secret is a one-time setup, recorded in
  # docs/reference/in-app-updates.md with the key rotation.
  sign:
    name: sign
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The script, and nothing else from the repository is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download the two update assets from the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh release download "$TAG" --repo "$REPO" --dir signing \
            --pattern '*-windows-x64-portable.zip' --pattern '*_x64-setup.exe'
          shopt -s nullglob
          portable=(signing/*-windows-x64-portable.zip)
          nsis=(signing/*_x64-setup.exe)
          # Exactly one of each, or the updater would be offered a file nobody signed.
          if [ "${#portable[@]}" -ne 1 ] || [ "${#nsis[@]}" -ne 1 ]; then
            echo "Expected one portable zip and one NSIS setup on the draft; found ${#portable[@]} and ${#nsis[@]}." >&2
            exit 1
          fi
          ls -l signing

      - name: Sign them
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-signing.mjs sign signing/*-windows-x64-portable.zip \
            --trusted-comment "mtg-grimoire $VERSION portable"
          node scripts/update-signing.mjs sign signing/*_x64-setup.exe \
            --trusted-comment "mtg-grimoire $VERSION nsis"

      - name: Attach the signatures to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" signing/*.minisig --clobber --repo "$REPO"

  publish:
    name: publish
    needs: [release-please, build, sign]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    # Flips the draft to published, and nothing else.
    permissions:
      contents: write
    steps:
      # The release goes public only once every platform's assets are attached **and the two the
      # updater installs are signed** — `needs: sign` is what makes an unsigned release impossible.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --draft=false --repo "${{ github.repository }}"
