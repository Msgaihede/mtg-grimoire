name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# **Nothing at the workflow level; every job names what it needs.** This granted `contents`,
# `issues` and `pull-requests: write` to every job until 2026-09-28, so a build leg — which runs
# tauri-action, rust-cache, every npm install script and every cargo build script — could open
# pull requests and edit issues it never had any reason to touch.
permissions: {}

# **Every third-party action is pinned by commit SHA, with the tag it was on in the comment.** A
# tag is mutable: whoever can push to that action's repository can repoint `@v1` at new code, and
# the next release here would run it with a write token beside the release it is building.
# Dependabot (`.github/dependabot.yml`) moves the SHA and the comment together, and
# `scripts/actions-pinned.test.ts` fails on any `uses:` that is neither local nor a 40-character
# SHA, and on any checkout that leaves its token behind (`persist-credentials: false`).
#
# **The three hosts ship from one tag** (light app phase 6, step 6.6, 2026-10-04). One core means
# one user schema per commit, and sync stamps every op with the sender's: a device on an older
# build holds an op stamped newer until it updates. So a host that ships ahead of the others
# strands them, and this file is where they are kept together:
#
#   release-please ─┬─ build (windows, linux) ─────────────┐
#                   ├─ android ── android-sign ────────────┤
#                   ├─ web ────────────────────────────────┤
#                   └─ share ──────────────────────────────┤
#                                                          ▼
#   relay-deploy ── share-deploy ── scan-deploy ── web-deploy ── play-upload ── publish ── announce
#                              (publish also needs build and android-sign)
#
# **Once it is published, the release is announced** (2026-10-11): `announce` posts its version,
# address and notes to a Discord webhook, from an environment of its own (`discord`). Nothing
# waits for it.
#
# **And between releases, the notes** (2026-10-11): on a push that cut no release,
# `changelog-write` and `changelog-commit` write the coming release's notes from its pull requests
# and put them on the release PR as `changelog/<version>.md`; `publish` makes that file the
# release's body. Nothing above waits for either job. `changelog-write` holds one more secret, the
# model's key, from an environment of its own (`changelog`), and installs nothing either.
# docs/superpowers/specs/2026-10-11-generated-release-notes-design.md has the design.
#
# The six jobs that hold a secret on a release — `android-sign`, `relay-deploy`, `share-deploy`, `scan-deploy`, `web-deploy`, `play-upload` — build nothing, take what they
# hold from the `release` environment (one only `main` may use once the owner has restricted it —
# docs/reference/ci-and-releases.md, "What only the owner can do", step 0; until then any
# branch's workflow can), and each ends green and says so when its values are not set. **The
# Android host leaves this workflow as a signed bundle that `play-upload` puts on Google Play's
# internal track; the owner promotes it from there**; nothing Android is attached to the release.
# docs/reference/ci-and-releases.md, "The release rule", has the reasons and what only the
# owner can do.
#
# **`on:` is a push to `main` and nothing else.** Not `workflow_dispatch`, not `pull_request`:
# either would let a branch's copy of this file ask for the release environment's values, and
# the environment's branch rule would be the only thing between them and a pull request.
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-22.04
    # Warm: under a minute. Every later push's changelog run waits in `release` behind it.
    timeout-minutes: 15
    # Tags and releases, the release branch and its PR, and the labels it keeps on that PR.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    # Warm: ~25 min on Linux. A hung leg would hold the `release` concurrency group for six
    # hours, replacing every later push's changelog run while pending.
    timeout-minutes: 90
    # Uploads to the draft: tauri-action's bundles, and the portable zip below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      # `id` is real but undocumented in the action's README. If it ever stops being
      # emitted, tauri-action would fall back to tag matching and could create a SECOND
      # release. Fail loudly instead.
      - name: Refuse to build without a release id
        shell: bash
        run: |
          if [ -z "${{ needs.release-please.outputs.release_id }}" ]; then
            echo "release-please emitted no release id; refusing to build."
            exit 1
          fi

      # `persist-credentials: false` everywhere: without it the token stays in `.git/config` for
      # every later step to read, and nothing after a checkout here runs `git` against the remote
      # — every upload is `gh` or tauri-action, each handed its token explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm runs no dependency's install script unless `pnpm-workspace.yaml` names it (`allowBuilds`).
      # tauri-action does NOT install frontend dependencies. It DOES run
      # beforeBuildCommand (`pnpm -w run build`), so do not run that here as well.
      - run: pnpm install --frozen-lockfile

      # The scanner's hash bundle and OCR models are embedded into the binary (build.rs sets
      # cfg(scanner_assets)). A release without them cannot scan, so this fails the leg.
      - name: Scanner assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm scanner:assets

      # `rust-toolchain.toml`'s pin, never `stable` — see that file.
      - uses: ./.github/actions/rust-toolchain

      # The cargo workspace is rooted at the repository since 2026-10-02 and still builds into
      # `target` (`.cargo/config.toml`), which is where the portable step below looks.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      # The action runs `pnpm tauri build` from the repository root — it finds `pnpm-lock.yaml`,
      # and `@tauri-apps/cli` in the root manifest — which `package.json` sends to `apps/desktop`
      # (`scripts/release-rule.test.ts` holds that script's text and that dependency). It
      # finds the config itself: the first `**/tauri.conf.json` it meets. The two Tauri hosts are
      # siblings now (`apps/desktop` and `apps/light`), so the desktop is chosen by name order,
      # not by anything written here. Harmless while both carry the same `productName` and
      # `version`; worth knowing before either is renamed.
      # The `--` in `args` below is not pnpm's to drop: it is the Tauri CLI's own separator, and
      # what follows it (`--locked`) goes to cargo. pnpm passes it through untouched (measured
      # 2026-10-09: `pnpm tauri build --help --bundles nsis,msi -- --locked` ran the root script
      # with those arguments in that order).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} -- --locked

      # productName does not rename the binary in Tauri v2, so this really is the
      # lowercase hyphenated Cargo package name. The exe is self-contained: frontend
      # assets are embedded and SQLite is `bundled`. Run from any folder it writes
      # <exe dir>/data, which is the portable behaviour no Program Files install reaches.
      - name: Package the portable Windows build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $zip = "mtg-grimoire-$env:VERSION-windows-x64-portable.zip"
          Compress-Archive -Path target/release/mtg-grimoire.exe -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach the portable zip to the draft release
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$PORTABLE_ZIP" --clobber --repo "${{ github.repository }}"

  # **The light app's Android build, at the tag** — `ci.yml`'s `android` job, step for step: the
  # same runner, JDK 21, NDK, toolchain action, cache key and `pnpm exec tauri android build`. It
  # holds no secret, so what Gradle signs with is the runner's debug key, exactly as in a pull
  # request. That signature never leaves this workflow: `android-sign` below replaces it on the
  # bundle, or nothing is handed on. The APK the same run makes stays in this job.
  #
  # **It runs whether or not there is a key to sign with.** A tag the Android app cannot be
  # built from is a release that would ship two hosts and not the third, and that is a red run,
  # not a skip.
  android:
    name: android (build)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    # A cold release compile of the engine for arm64, then Gradle. A job has six hours by
    # default, and `publish` waits on this one.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Point the build at JDK 21, the SDK and the NDK
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?the runner image did not set JAVA_HOME_21_X64}"
          : "${ANDROID_HOME:?the runner image did not set ANDROID_HOME}"
          : "${ANDROID_NDK_LATEST_HOME:?the runner image did not set ANDROID_NDK_LATEST_HOME}"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          key: android-aarch64

      # From `apps/light/`, so the CLI finds the light host's `tauri.conf.json`, as in `ci.yml` — and
      # the same line, so a release runs a command every pull request ran.
      - name: Build the APK and the bundle
        working-directory: apps/light
        run: pnpm exec tauri android build --apk --aab --target aarch64 --ci

      # The `versionName` and `versionCode` come from `tauri.conf.json`'s `version`, which
      # release-please bumped in the commit this run is on. Held here, before anything is signed:
      # a bundle that says another version is one Play Console refuses after the release has run.
      - name: Find the bundle, and hold it to the release's version
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/android-release/check-version.sh "$VERSION"
          aab=$(find apps/light/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "the build produced no bundle" >&2; exit 1; }
          mkdir -p aab-out && cp "$aab" aab-out/mtg-grimoire-light-arm64.aab
          ls -l aab-out

      # Handed to `android-sign`, and to no other job: this is the debug-signed build, and its
      # name says so. Fourteen days, so a sign job that failed can be run again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab-debug-signed
          path: aab-out/mtg-grimoire-light-arm64.aab
          retention-days: 14
          if-no-files-found: error

  # **The upload key, in a job of its own.** This is the one structural rule the removed `sign`
  # job left behind (docs/reference/ci-and-releases.md): a signing key never sits in a build
  # leg, because a build leg runs every build tool and its plugins, every cargo build script,
  # every Gradle plugin and any install script `pnpm-workspace.yaml` is ever told to allow, and
  # any of them can read a file or an environment. So this job runs none of them — no
  # `pnpm install`, no cargo, no Gradle. It checks out the scripts, downloads the bundle the
  # job above built, and re-signs it with the JDK's own `jarsigner`
  # (`scripts/android-release/sign-bundle.sh`, which `ci.yml`'s `android` job proves on
  # throwaway keys in every pull request that can have changed the bundle).
  # `scripts/release-rule.test.ts` holds the rule.
  #
  # **The signed bundle goes to Google Play and nowhere else** (decided 2026-10-07: Play is the
  # only place the Android app is published). So this job attaches nothing to the release and
  # can write nothing to the repository: what it signed leaves as the artifact
  # `play-upload-bundle`, which `play-upload` below puts on Play's internal track (since
  # 2026-10-11; by the owner's hand before that, and still when that job has no account to
  # upload with). **A release is therefore not on phones when this run ends** — it is when the
  # owner has promoted the build and Play has reviewed it.
  #
  # **It is an upload key.** Google holds the key Play signs installs with (Play App Signing)
  # and can reset this one if it is lost, so it is not the unrecoverable thing an APK's signing
  # key is. It is still held to a committed fingerprint
  # (`apps/light/src-tauri/release-signer.sha256`): a keystore pasted into the settings by mistake
  # is refused here, by name, and not by Play Console after the release has run.
  #
  # **With no key it signs nothing and ends green**, saying so in the summary. **With some of
  # the three key values and not all, it fails**: that is a mistake in the settings, and a skip
  # would hide it for as long as nobody looked. **With a key and no committed fingerprint it
  # signs nothing either**, and says which.
  #
  # **`environment: release`**, and with it the key: a repository-level value is handed to any
  # workflow on any branch of this repository that asks for it, where an environment's is handed
  # only to a job that names the environment, from a branch the environment allows — `main`
  # alone once the owner has restricted it (docs/reference/ci-and-releases.md, "What only the
  # owner can do", step 0). Until then the environment has no branch rule, and a workflow on any
  # branch can name it.
  android-sign:
    name: android (sign for Play)
    needs: [release-please, android]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # What `play-upload` asks before anything else: was a bundle signed.
    outputs:
      signed: ${{ steps.key.outputs.present }}
    # Reads the checkout and the artifact. It uploads nothing to the release.
    permissions:
      contents: read
    steps:
      # The scripts, and the fingerprint the next step looks for. Nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job's `if:` cannot ask whether a value is set, so a step does and says what it found.
      # **It is told whether each is set, never what it is**: the expressions below are `true`
      # or `false`, so no key material is in this step's environment.
      - name: Is there a key to sign with, and a fingerprint to hold it to
        id: key
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          PIN: apps/light/src-tauri/release-signer.sha256
        run: |
          set -euo pipefail
          missing=""
          found=0
          has() { if [ "$2" = true ]; then found=$((found + 1)); else missing="$missing $1"; fi; }
          has ANDROID_KEYSTORE_BASE64 "$HAS_KEYSTORE"
          has ANDROID_KEYSTORE_PASSWORD "$HAS_KEYSTORE_PASSWORD"
          has ANDROID_KEY_PASSWORD "$HAS_KEY_PASSWORD"
          if [ -n "$missing" ] && [ "$found" -gt 0 ]; then
            echo "Some of the upload key's values are set in the release environment and these are not:$missing" >&2
            echo "Set all three or none — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          if [ -z "$missing" ] && [ -f "$PIN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Android bundle — not signed"
            echo
            if [ -n "$missing" ]; then
              echo "This release has **no bundle to upload to Google Play**. The \`release\` environment"
              echo "holds no upload key (\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_PASSWORD\`), and Play takes no bundle signed with a runner's debug key."
            else
              echo "⚠️ This release has **no bundle to upload to Google Play, although the upload key is"
              echo "set**: this tag holds no \`$PIN\`. Without the certificate's fingerprint in the tree"
              echo "nothing says the key in the settings is the one Play Console knows. Commit the"
              echo "fingerprint; the next release signs a bundle."
            fi
            echo "The bundle was built at this tag, so the tag is known to build one."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: android-aab-debug-signed
          path: aab-in

      # The only step the key reaches. The keystore is decoded into the runner's temp folder,
      # outside the checkout, readable by this user alone (`umask 077`), and deleted when the
      # step ends, however it ends. **The alias is a plain word and not a secret**: GitHub would
      # mask every `mtg-grimoire` in this job's log — the bundle's own name among them — if it
      # were one.
      - name: Sign the bundle with the upload key
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: mtg-grimoire
          ANDROID_SIGNER_PIN: apps/light/src-tauri/release-signer.sha256
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          : "${JAVA_HOME_21_X64:?the runner image did not set JAVA_HOME_21_X64}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          # The decoded keystore is the only copy the tools need; the base64 need not ride in their environment.
          unset ANDROID_KEYSTORE_BASE64
          aab="mtg-grimoire-$VERSION-android.aab"
          bash scripts/android-release/sign-bundle.sh aab-in/mtg-grimoire-light-arm64.aab "$aab"
          echo "SIGNED_AAB=$aab" >> "$GITHUB_ENV"
          IFS=. read -r major minor patch <<< "$VERSION"
          {
            echo
            echo "**Signed \`$aab\`** — this run's artifact \`play-upload-bundle\`, versionCode $((major * 1000000 + minor * 1000 + patch))."
            echo "The job *android (upload to Play)* puts it on Play's internal track once the deploys are through."
            echo "If that job did not run, or says it uploaded nothing, upload it by hand:"
            echo "Play Console → *Test and release* → the track → *Create new release*."
            echo
            echo "Until it is on a track and Play has reviewed it, phones stay on the previous version:"
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*."
          } >> "$GITHUB_STEP_SUMMARY"

      # Thirty days: long enough for `play-upload` to take it and for the owner to upload it by
      # hand if that job did not — and not an archive: Play Console keeps every bundle it was
      # given. Anyone signed in to GitHub can download a public repository's artifact; this one
      # is no secret, and only the Console's owner, or a service account the owner invited with
      # permission for testing tracks, can upload it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true'
        with:
          name: play-upload-bundle
          path: ${{ env.SIGNED_AAB }}
          retention-days: 30
          if-no-files-found: error

  # **The web app, built at the tag and opened in a browser** — `ci.yml`'s `web` job, step for
  # step, less the lint and the size report: clang 18, the wasm target, the `wasm-bindgen` CLI at
  # the lockfile's version, `web:wasm`, `web:build`, and the offline first run in the image's own
  # Chrome. It holds no secret and deploys nothing; what it leaves is `apps/light/dist-web/`, as an artifact
  # for `web-deploy`.
  #
  # **It runs whether or not there is a token to deploy with**, for `android`'s reason: a tag the
  # web app cannot be built from, or whose first run fails in a browser, is not a release.
  web:
    name: web (build)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    # The `wasm-bindgen` CLI compiled from source on a cold cache, the module, the page and the
    # smoke run, which has ten minutes of its own.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          clang --version
          major=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          if ! [ "${major:-0}" -ge 18 ]; then
            echo "clang '${major}' is too old or unreadable: sqlite-wasm-rs's shim needs C23 attributes (clang 18+)" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          key: web-wasm32

      # Read from `Cargo.lock`, never typed here — `ci.yml` has the argument, and
      # `scripts/toolchain.test.ts` holds every workflow to this line's shape.
      - name: Install the wasm-bindgen CLI the lockfile resolves
        shell: bash
        run: |
          set -euo pipefail
          versions=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; print }' Cargo.lock \
            | sed -n 's/^version = "\([^"]*\)"$/\1/p')
          count=$(grep -c . <<< "$versions" || true)
          if [ "$count" != 1 ]; then
            echo "Cargo.lock resolves the wasm-bindgen crate $count times; the CLI can match exactly one:" >&2
            echo "$versions" >&2
            exit 1
          fi
          bindgen=$versions
          echo "Cargo.lock resolves wasm-bindgen $bindgen"
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          installed=$(wasm-bindgen --version)
          echo "$installed"
          case "$installed" in
            "wasm-bindgen $bindgen" | "wasm-bindgen $bindgen "*) ;;
            *)
              echo "the wasm-bindgen on PATH is '$installed', not $bindgen" >&2
              exit 1
              ;;
          esac

      - name: Build the module
        run: pnpm web:wasm

      # The card scanner's three files, from this repository's own public release — what the
      # desktop's build fetches to embed, fetched here for the web app to serve from its origin
      # (`scripts/scanner-assets.ts --web`; `ci.yml`'s `web` job has the long form). The
      # build is told they are required: a release whose web app cannot scan fails here, not in
      # a reader's browser.
      - name: Fetch the scanner's files
        run: pnpm scanner:assets --web

      - name: Build the page
        env:
          GRIMOIRE_SCANNER_ASSETS: required
        run: pnpm web:build

      # What a deploy cannot do without: the document, the policy and caching rules
      # (`_headers`, parsed at deploy and never served), and the service worker, which
      # `web:build` writes last.
      - name: Check the bundle is whole
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html _headers sw.js; do
            [ -s "apps/light/dist-web/$file" ] || { echo "apps/light/dist-web/$file is missing or empty" >&2; exit 1; }
          done
          ls apps/light/dist-web

      - name: Find Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$chrome" ] && [ -n "${CHROME_BIN:-}" ] && [ -x "$CHROME_BIN" ]; then
            chrome=$CHROME_BIN
          fi
          if [ -z "$chrome" ]; then
            echo "this runner has no google-chrome on PATH and no usable CHROME_BIN" >&2
            exit 1
          fi
          version=$("$chrome" --version)
          echo "$chrome: $version"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Open the built app in headless Chrome
        timeout-minutes: 10
        run: pnpm web:smoke

      # The bundle `web-deploy` uploads, and the record of what a release deployed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-bundle
          path: apps/light/dist-web/
          retention-days: 14
          if-no-files-found: error

  # **The share Worker's viewer, built at the tag** — the bundle `infrastructure/share-worker`
  # serves beside its script (`apps/share/dist-share`, `assets/share.js` by a fixed name). It
  # holds no secret and deploys nothing; what it leaves is the artifact `share-bundle`, for
  # `share-deploy`. `ci.yml`'s `frontend` runs the same `pnpm share:build` on every pull request.
  share:
    name: share (build)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the viewer
        run: pnpm share:build

      # The one file every shared page names. A build that wrote it under another name, or not
      # at all, is a deploy whose every link opens a blank page.
      - name: Check the bundle is whole
        shell: bash
        run: |
          set -euo pipefail
          [ -s apps/share/dist-share/assets/share.js ] || { echo "apps/share/dist-share/assets/share.js is missing or empty" >&2; exit 1; }
          ls apps/share/dist-share apps/share/dist-share/assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: share-bundle
          path: apps/share/dist-share/
          retention-days: 14
          if-no-files-found: error

  # **The relay, deployed by a release** (the owner's decision, 2026-10-11: a release deploys
  # everything; it reverses 2026-10-04's "the relay is deployed by no job"). First of the four
  # deploys, once every host has built at the tag: a page that asks a relay without its half
  # fails every request (docs/agent/EXTERNAL_SERVICES.md), and the share Worker verifies the
  # tokens this one mints.
  #
  # **A token of its own**, `CLOUDFLARE_INFRA_API_TOKEN`, which this job, `share-deploy` and
  # `scan-deploy` read and no other: it can write the D1 that holds every entitlement, where the web app's token
  # can touch one Worker. **The token alone decides whether this job does anything** — the
  # account id is in the environment already, for `web-deploy` — so with no token it applies
  # nothing, deploys nothing, says so in the summary and ends green; with a token and no account
  # id it fails. The Worker's own three secrets are Cloudflare's to hold: a deploy neither reads
  # nor changes them, and this workflow never sees them.
  #
  # **The database first, then the code.** `wrangler d1 migrations apply` runs every `.sql` file
  # in `infrastructure/relay/migrations/` the table `d1_migrations` does not name yet, once, in
  # name order — so a migration is additive, because for a moment the previous release's code
  # runs on it (that folder's README). ⚠️ **A migration is not undone by a re-run**, and a
  # failure after it leaves the schema ahead of the code: D1's Time Travel is the way back, by
  # hand.
  #
  # It builds nothing, for `web-deploy`'s reasons: the pinned `wrangler`, installed with no
  # script run and no token in reach, run by path. `scripts/release-rule.test.ts` holds every
  # line it runs.
  relay-deploy:
    name: relay (deploy)
    needs: [release-please, build, android-sign, web, share]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      # `infrastructure/relay/` — `wrangler.jsonc`, the script, the migrations —
      # `infrastructure/wrangler/`, the tool's lockfile, and the probe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Told whether each is set, never what it is — as in `android-sign`.
      - name: Is there a token to deploy with
        id: token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Relay — not deployed"
              echo
              echo "**The relay still runs the previous deploy.** The \`release\` environment holds no"
              echo "\`CLOUDFLARE_INFRA_API_TOKEN\`, so this release applied no migration and deployed nothing to it."
              echo "Deploy $TAG by hand — \`docs/reference/hosted-relay-deploy.md\`."
              echo
              echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_ACCOUNT" != true ]; then
            echo "CLOUDFLARE_INFRA_API_TOKEN is set in the release environment and CLOUDFLARE_ACCOUNT_ID is not." >&2
            echo "Set both — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # A re-run long after its run would put this tag's relay over a later release's.
      - name: Refuse to deploy an older release over a newer one
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -1)
          echo "this run's tag: $TAG; the newest published release: $latest"
          if [ "$newest" != "$TAG" ]; then
            echo "$latest is published and is newer than $TAG: deploying $TAG's relay would put older code behind it. Nothing was deployed." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # No lifecycle script run, and nothing in this step's environment — `web-deploy` has why.
      - name: Install the lockfile's packages, running no script
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/wrangler
        run: npm ci --ignore-scripts

      # The first of the two steps the token reaches. Nothing to apply is the usual answer —
      # though the first run with a token creates the bookkeeping table, `d1_migrations`
      # (`d1_migrations_share` for the share Worker's job), in the production database: a write
      # to the live D1, harmless, by design.
      - name: Apply the database's pending migrations
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js d1 migrations apply mtg-grimoire-relay --remote

      # The second, and the deploy: live the moment it returns. The version id it prints is the
      # record of what is running — no probe without a credential can tell one from the next.
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js deploy

      # The runbook's step 0, asked of the real address: the relay answers, its tables are
      # there, and a page at the web app's origin is let in.
      # ⚠️ **A failure here leaves the relay deployed and the release a draft.**
      - name: Ask the host
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 5
        run: node scripts/relay-deploy-probe.ts

  # **The share Worker, deployed by a release**, behind the relay and with the relay's token:
  # the two share one database and one signing key, so they share the token that can write
  # both. Everything `relay-deploy` says of itself holds here — the token alone decides, the
  # database before the code (this Worker's own list, in its own table `d1_migrations_share`),
  # nothing built, every line held by the fence. What it uploads beside the script is the
  # viewer `share` built at the tag.
  share-deploy:
    name: share (deploy)
    needs: [release-please, share, relay-deploy]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a token to deploy with
        id: token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Share Worker — not deployed"
              echo
              echo "**The share Worker still runs the previous deploy.** The \`release\` environment holds no"
              echo "\`CLOUDFLARE_INFRA_API_TOKEN\`, so this release applied no migration and deployed nothing to it."
              echo "Deploy $TAG by hand — \`infrastructure/share-worker/README.md\`."
              echo
              echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_ACCOUNT" != true ]; then
            echo "CLOUDFLARE_INFRA_API_TOKEN is set in the release environment and CLOUDFLARE_ACCOUNT_ID is not." >&2
            echo "Set both — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Refuse to deploy an older release over a newer one
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -1)
          echo "this run's tag: $TAG; the newest published release: $latest"
          if [ "$newest" != "$TAG" ]; then
            echo "$latest is published and is newer than $TAG: deploying $TAG's share Worker would put older code behind it. Nothing was deployed." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Where `wrangler.jsonc`'s `assets.directory` (`../../apps/share/dist-share`) looks.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: share-bundle
          path: apps/share/dist-share

      # `share` checked this before it uploaded; asked again here because after the deploy is
      # too late. `wrangler deploy` uploads whatever the directory holds.
      - name: Check the bundle arrived whole
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -s apps/share/dist-share/assets/share.js ] || { echo "apps/share/dist-share/assets/share.js is missing or empty" >&2; exit 1; }

      - name: Install the lockfile's packages, running no script
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/wrangler
        run: npm ci --ignore-scripts

      - name: Apply the database's pending migrations
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/share-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js d1 migrations apply mtg-grimoire-relay --remote

      # From the Worker's folder; its `alias` is what lets the script's one import of the
      # relay's token module bundle in a job with no workspace links (`scripts/share-worker-alias.test.ts`).
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/share-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js deploy

      # The README's five: the Worker's four doors, and the viewer's script byte for byte
      # against the bundle — the one that says this build is what the address serves.
      # ⚠️ **A failure here leaves the share Worker deployed and the release a draft.**
      - name: Ask the host
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 5
        run: node scripts/share-deploy-probe.ts apps/share/dist-share

  # **The scan inbox, deployed by a release** (the owner's decision, 2026-10-11, with the card
  # scanner's Send — issue #776): the fourth Worker, `infrastructure/scan-worker/`, behind the
  # share Worker and **ahead of the web app**. The page's policy names this Worker's host and
  # its engine posts to it, and a page that asks a host with no CORS answer fails every
  # request — so this one is live first, and `web-deploy` waits for it.
  #
  # **With the relay's token**, `CLOUDFLARE_INFRA_API_TOKEN`: it is the one that has deployed a
  # Worker with a bucket bound (the share Worker's), and the web app's is scoped to what the
  # web app needs. The token alone decides, as in `relay-deploy`, and it reaches one step — the
  # deploy. No database, so no migration; no bundle, so nothing downloaded: the Worker is its
  # own script and `wrangler.jsonc`, which binds one R2 bucket (`mtg-grimoire-scans`, the
  # owner's to have created: the deploy fails naming the binding until it exists) and one
  # rate limiter, and states one Custom Domain (`scans.mtg-grimoire.app` — the token's zone
  # permission, as for the relay). **It holds one secret, `RELAY_HMAC_KEY`, which is
  # Cloudflare's to keep and the owner's to have set**: sending a scan is a supporter's, and
  # the Worker checks the relay's token. A deploy neither reads nor changes it and this
  # workflow never sees it; unset, the probe's requests at the door answer 500 and say so.
  #
  # **The probe stores nothing.** No request of it reaches the bucket — a probe that did would
  # put a scan nobody sent in the inbox on every release — so what shows the binding takes a
  # write is the first scan a supporter sends. Everything else `relay-deploy` says of itself holds
  # here: nothing built, the pinned `wrangler` run by path, every line held by the fence.
  scan-deploy:
    name: scan (deploy)
    needs: [release-please, share-deploy]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      # `infrastructure/scan-worker/` — `wrangler.jsonc` and the script — `infrastructure/wrangler/`,
      # the tool's lockfile, and the probe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is there a token to deploy with
        id: token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != true ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Scan inbox — not deployed"
              echo
              echo "**The scan inbox still runs the previous deploy, if it has had one.** The \`release\` environment holds no"
              echo "\`CLOUDFLARE_INFRA_API_TOKEN\`, so this release deployed nothing to it."
              echo "Deploy $TAG by hand — \`infrastructure/scan-worker/README.md\`."
              echo
              echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_ACCOUNT" != true ]; then
            echo "CLOUDFLARE_INFRA_API_TOKEN is set in the release environment and CLOUDFLARE_ACCOUNT_ID is not." >&2
            echo "Set both — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Refuse to deploy an older release over a newer one
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -1)
          echo "this run's tag: $TAG; the newest published release: $latest"
          if [ "$newest" != "$TAG" ]; then
            echo "$latest is published and is newer than $TAG: deploying $TAG's scan inbox would put older code behind it. Nothing was deployed." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the lockfile's packages, running no script
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/wrangler
        run: npm ci --ignore-scripts

      # The one step the token reaches, and the deploy: live the moment it returns. From the
      # Worker's folder; its `alias` is what lets the script's one import of the relay's token
      # module bundle in a job with no workspace links (`scripts/scan-worker-alias.test.ts`).
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/scan-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js deploy

      # The README's seven, asked of the real address: the route, the door shut to no token and
      # to a nonsense one — a 500 there is a signing key the owner has not set — the web app's
      # origin let in and another's not, and nothing served back.
      # ⚠️ **A failure here leaves the scan inbox deployed and the release a draft.**
      - name: Ask the host
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 5
        run: node scripts/scan-deploy-probe.ts

  # **The web app's hosting, `infrastructure/app-worker/`, to https://mtg-grimoire.app** — the
  # last of a release's four deploys, behind the relay, the share Worker and the scan inbox
  # (`relay-deploy` has why the relay is first, `scan-deploy` why the inbox is ahead of this). The owner decided on 2026-10-04 that a release deploys it — one
  # core means one user schema per commit, so the three hosts ship from one tag
  # (docs/reference/ci-and-releases.md, "The release rule") — and on 2026-10-11 that a release
  # deploys the other three Workers as well. `scripts/release-rule.test.ts` lists every workflow
  # line that names `wrangler`, and fails one more.
  #
  # **The token, in a job of its own**, for `android-sign`'s reason and a wider blast radius: a
  # token that can deploy this Worker can, unless it was scoped down, deploy over the relay on the
  # same account. So this job runs no build: no root install, no cargo. It checks out the
  # Worker's configuration and downloads the bundle `web` built and opened in a browser.
  #
  # **`wrangler` is pinned by a lockfile, and installed with no script run and no token in
  # reach.** `npx wrangler@4.146.0` pinned one package of ninety-one: the rest came through
  # floating ranges, resolved on the day, and two of them (`esbuild`, `workerd`) run a
  # `postinstall` — in the step that held the token. So `infrastructure/wrangler/package-lock.json`
  # names every one with its integrity hash, `npm ci --ignore-scripts` installs exactly those in a
  # step whose environment holds nothing, and the step that holds the token runs the file that
  # step installed, by path, which installs nothing and fails if it is not there.
  # `scripts/release-rule.test.ts` holds both lines to the letter.
  # The account id is kept out of the tree too: it is in no file of this repository.
  #
  # **It waits for the desktop builds and the bundle**, and is the last of the four deploys. A
  # deploy is live the moment it returns, and a release is a draft until `publish` — so the
  # deploy goes as late as it can, when nothing but its own probe, `play-upload` (which runs
  # after it, since 2026-10-11) and the flip of the draft can still fail.
  #
  # **With no token it deploys nothing and ends green**, saying so in the summary — and saying
  # what that leaves: the address serves the previous deploy until somebody deploys this tag by
  # hand. With one of the two values and not the other, it fails.
  #
  # **`environment: release`**, for `android-sign`'s reason: the token is handed only to a job
  # that names the environment, and from `main` alone once the owner has restricted the
  # environment to it (step 0 of "What only the owner can do"); until then, from any branch.
  web-deploy:
    name: web (deploy)
    needs: [release-please, build, android-sign, web, share-deploy, scan-deploy]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      # `infrastructure/app-worker/` — `wrangler.jsonc`, the script — `infrastructure/wrangler/`,
      # the tool's lockfile, and the probe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Told whether each is set, never what it is — as in `android-sign`.
      - name: Is there a token to deploy with
        id: token
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          missing=""
          found=0
          has() { if [ "$2" = true ]; then found=$((found + 1)); else missing="$missing $1"; fi; }
          has CLOUDFLARE_API_TOKEN "$HAS_TOKEN"
          has CLOUDFLARE_ACCOUNT_ID "$HAS_ACCOUNT"
          if [ -z "$missing" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$found" -gt 0 ]; then
            echo "One of the deploy's two values is set in the release environment and this one is not:$missing" >&2
            echo "Set both or neither — docs/reference/ci-and-releases.md, 'What only the owner can do'." >&2
            exit 1
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Web app — not deployed"
            echo
            echo "**https://mtg-grimoire.app still serves the previous deploy.** The \`release\`"
            echo "environment holds no \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`, so this"
            echo "release deployed nothing. The web app was built at $TAG and opened in a browser,"
            echo "so the tag is known to build one."
            echo
            echo "If this release moved the user schema, a browser paired with a desktop that"
            echo "updates to it holds that desktop's changes until the web app is deployed from"
            echo "$TAG by hand — \`infrastructure/app-worker/README.md\`, *The steps, in order*."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      # **A deploy is not a release's to make twice.** This job can be run again long after its
      # run — *Re-run jobs* — and it would upload this tag's bundle over whatever a later release
      # deployed: an older user schema in front of desktops that have moved on. So it asks which
      # release is the newest published one and refuses to deploy anything older. On a first run
      # that is the previous release (this one is still a draft), which is older, and it goes on.
      - name: Refuse to deploy an older release over a newer one
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -1)
          echo "this run's tag: $TAG; the newest published release: $latest"
          if [ "$newest" != "$TAG" ]; then
            echo "$latest is published and is newer than $TAG: deploying $TAG's bundle would put an older web app in front of it. Nothing was deployed." >&2
            exit 1
          fi

      # For `npm ci` and for the two files Node runs here: the tool it installs, and the probe,
      # which is TypeScript run by Node directly. No `cache:` — a cache is one more thing that could hand this job
      # bytes the lockfile did not name — and `package-manager-cache: false`, because this action
      # turns a cache on by itself when `package.json`'s `packageManager` names npm. It names
      # pnpm, so nothing is cached with or without the key; the key is what keeps that true if
      # the field or the action's default moves. No pnpm: this job is not part of the workspace.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Where `wrangler.jsonc`'s `assets.directory` (`../../apps/light/dist-web`) looks.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: web-bundle
          path: apps/light/dist-web

      # `web` checked this before it uploaded; asked again here because after the next step is
      # too late. `wrangler deploy` uploads whatever the directory holds, and a bundle without
      # `_headers` deploys as an app with no policy and no caching rules.
      - name: Check the bundle arrived whole
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html _headers sw.js; do
            [ -s "apps/light/dist-web/$file" ] || { echo "apps/light/dist-web/$file is missing or empty" >&2; exit 1; }
          done

      # `wrangler` and everything under it, from `infrastructure/wrangler/package-lock.json` and
      # nowhere else: each tarball checked against the hash the lockfile holds, and **no lifecycle
      # script run** — `esbuild`'s and `workerd`'s `postinstall` only swap a JS launcher for the
      # native binary it would start anyway, and each finds its platform package without it. This
      # step's environment holds no token; what it installs is not run until the next one.
      - name: Install the lockfile's packages, running no script
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/wrangler
        run: npm ci --ignore-scripts

      # The only step this job's token reaches (three jobs start `wrangler` now). **By path**:
      # what runs is the file the step above installed, or nothing — no runner resolves a name,
      # so nothing can be fetched in its place. From the Worker's folder, where `wrangler.jsonc`
      # is; that file's `alias` is what lets the script's one import of the shared UI bundle in a
      # job that has no workspace links (`infrastructure/app-worker/src/hosting.test.ts`).
      - name: Deploy the Worker
        if: steps.token.outputs.present == 'true'
        working-directory: infrastructure/app-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node ../wrangler/node_modules/wrangler/bin/wrangler.js deploy

      # The runbook's cheapest probes, asked of the real address: the document answers 200, its
      # Content-Security-Policy is the built `_headers` line, and the document is this bundle's.
      # ⚠️ **A failure here leaves the web app deployed and the release a draft** — the summary
      # says which question failed, and docs/reference/ci-and-releases.md says what to do then.
      - name: Ask the host
        if: steps.token.outputs.present == 'true'
        timeout-minutes: 5
        run: node scripts/web-deploy-probe.ts apps/light/dist-web

  # **The bundle, onto Google Play's internal track** (the owner's decision, 2026-10-11; "by
  # hand first, automated later" was 2026-10-07's, and the first bundle went up by hand). The
  # one step of a release that cannot be taken back — Play takes a `versionCode` once — so it
  # is the last thing before `publish`, behind all four deploys.
  #
  # **The internal track, and no further.** Internal testers get the build at once; closed
  # testing and production are the owner's click in Play Console, and the service account is
  # granted *Release apps to testing tracks* and nothing above it.
  #
  # **The service account's key, in a job of its own**, for `android-sign`'s reason: this job
  # runs no build and installs nothing. The one program the key reaches is
  # `scripts/android-release/play-upload.ts` — Node's own `crypto` and `fetch`, no dependency,
  # which is why this is a script and not an upload action with a tree of its own.
  # `scripts/release-rule.test.ts` holds every line.
  #
  # **With no account, or no signed bundle, it uploads nothing and ends green**, saying which
  # in the summary. **A re-run is safe**: when Play already holds this `versionCode` the script
  # says so and changes nothing. And the script refuses, red, a release older than what Play
  # holds — a higher `versionCode` as a bundle or on any track — so a re-run of an old run
  # cannot put an older build on the track.
  play-upload:
    name: android (upload to Play)
    needs: [release-please, android-sign, web-deploy]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    # Reads the checkout and the artifact. It can write nothing here: what it changes is Play.
    permissions:
      contents: read
    steps:
      # The script. Nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Told whether the key is set, never what it is — and what `android-sign` said it did.
      - name: Is there an account to upload with, and a bundle to upload
        id: account
        shell: bash
        env:
          HAS_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          SIGNED: ${{ needs.android-sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$HAS_ACCOUNT" = true ] && [ "$SIGNED" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Google Play — nothing uploaded"
            echo
            if [ "$SIGNED" != true ]; then
              echo "This release signed no bundle (the summary of \`android (sign for Play)\` says why), so there is nothing to upload."
            else
              echo "The \`release\` environment holds no \`PLAY_SERVICE_ACCOUNT_JSON\`, so the signed bundle was not uploaded."
              echo "It is this run's artifact \`play-upload-bundle\`: upload it by hand in Play Console."
            fi
            echo
            echo "Phones stay on the previous version until a bundle is on a track."
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the steps."
          } >> "$GITHUB_STEP_SUMMARY"

      # For the one file Node runs here. No cache, as in the deploy jobs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.account.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.account.outputs.present == 'true'
        with:
          name: play-upload-bundle
          path: aab-in

      # The only step the key reaches. The versionCode is Tauri's arithmetic on the release's
      # version, as `android-sign` printed it; the script refuses to go on if Play reads another
      # out of the bundle.
      # ⚠️ **A failure here leaves all four Workers deployed and the release a draft.**
      - name: Upload the bundle to the internal track
        if: steps.account.outputs.present == 'true'
        shell: bash
        timeout-minutes: 20
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "$VERSION"
          node scripts/android-release/play-upload.ts "aab-in/mtg-grimoire-$VERSION-android.aab" "$((major * 1000000 + minor * 1000 + patch))"

  # **Publishes only when every host and every Worker is through.** `build` is the desktop's;
  # `android-sign` ends green with the bundle signed or with no key to sign it; `relay-deploy`,
  # `share-deploy`, `scan-deploy` and `web-deploy` each end green with their address serving
  # this tag or with no token to deploy it. `play-upload` ends green with the bundle on the internal track,
  # already there, or with nothing to upload it with. A failure in any of them — or in
  # `android`, `web` or `share`, which those need — leaves the release a draft: a release that
  # publishes some hosts and not the rest is what the rule exists to prevent. ⚠️ **A draft left
  # by a failed deploy may have live Workers ahead of it** — whichever deploys ran before the
  # one that failed.
  publish:
    name: publish
    needs: [release-please, build, android-sign, relay-deploy, share-deploy, scan-deploy, web-deploy, play-upload]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Flips the draft to published, and nothing else.
    permissions:
      contents: write
    steps:
      # The release goes public only once the desktop's assets are attached and the Android bundle
      # is signed, or knowingly not signed because no key is set (it is an artifact, not a release
      # asset), and then uploaded to Play's internal track, or knowingly not uploaded because no
      # service account is set. A `sign` job sat
      # between the two from 2026-09-28 to 2026-09-29 and was removed: there was no key to sign
      # with. docs/reference/in-app-updates.md records what the updater trusts without it.
      # **The release's body is `changelog/<version>.md`, as it was merged.** `changelog-write`
      # wrote that file from this release's pull requests while the release PR was open, and the
      # owner read it there; no model is asked anything here. Read through the API at the commit
      # this run is on, so this job needs no checkout.
      #
      # **Notes never hold a release up.** No file, an empty one, or a failed call leaves the body
      # release-please wrote, says so in the summary, and goes on to publish. Written here, after
      # the builds, so nothing a build leg does to the draft can undo it.
      - name: Use the generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          file="changelog/$VERSION.md"
          if gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$file?ref=$SHA" > notes.md \
            && [ -s notes.md ] \
            && gh release edit "$TAG" --notes-file notes.md --repo "$REPO"; then
            echo "The release's body is \`$file\`." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Release notes — release-please's"
              echo
              echo "\`$file\` could not be read at $SHA or set on the release, so $TAG keeps the notes"
              echo "release-please wrote. To replace them afterwards: \`node scripts/changelog/cli.ts push $VERSION\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --draft=false --repo "${{ github.repository }}"

  # **The release, announced on Discord, once it is published**: its version, its address and
  # its notes, as the release's body has them — the generated `changelog/<version>.md`, or
  # release-please's when `publish` kept those. `scripts/changelog/discord.ts` cuts the text to
  # Discord's 2000 characters a message and posts the pieces in order; nothing in them can ping
  # anyone or unfold a link.
  #
  # **After `publish`, and nothing needs it**: an announcement never holds a release up, and a
  # failure here turns a run red whose release is already out. A re-run posts it again.
  #
  # **The webhook, in an environment of its own** (`discord`), for `changelog-write`'s reason:
  # the address is a credential to post in the channel, and the signing key and the deploy
  # tokens are not within this job's reach, nor it within theirs. It reaches one step, which
  # runs one file with no dependency; the step before it reads the body with the run's token and
  # never sees the webhook. **With no webhook it posts nothing and ends green**, saying so.
  #
  # **One webhook or several** (2026-10-14): `DISCORD_WEBHOOK_URL` may hold more than one
  # address, separated by `;`, and each is posted to in turn. One secret, so another channel is
  # a secret edit and not a workflow change.
  announce:
    name: announce (Discord)
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: discord
    # Reads the checkout and the published release. What it changes is the Discord channel.
    permissions:
      contents: read
    steps:
      # The script. Nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Told whether it is set, never what it is — as in `android-sign`.
      - name: Is there a webhook to post to
        id: hook
        shell: bash
        env:
          HAS_HOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_HOOK" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Discord — not announced"
            echo
            echo "The \`discord\` environment holds no \`DISCORD_WEBHOOK_URL\`, so this release was not announced."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      # For the one file Node runs here. No cache, as in the deploy jobs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.hook.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The body as published, which `publish` has just set. The run's token, not the webhook.
      - name: Read the published notes
        if: steps.hook.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > notes.md

      # The only step the webhook reaches.
      - name: Post the release to Discord
        if: steps.hook.outputs.present == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: node scripts/changelog/discord.ts notes.md

  # **The coming release's notes, written from its pull requests** (2026-10-11,
  # docs/superpowers/specs/2026-10-11-generated-release-notes-design.md). release-please builds
  # its notes from commit subjects, and a merge is read twice; this reads every pull request since
  # the last tag — title and description — asks Claude Haiku 5.5 through OpenRouter for the notes
  # as JSON, checks that answer in code, and renders `release-notes/<version>.md`.
  #
  # **It runs on a push that cut no release**, which is every push but the merge of a release PR:
  # that is when the release PR is open and can carry the file. Nothing `needs` this job or the
  # next, so a failure here turns this run red and holds nothing up.
  #
  # **The key, in a job that installs nothing** — the rule `android-sign` and `web-deploy` keep.
  # The generator is TypeScript with no runtime dependency, so there is no install step to hold a key
  # beside. And this job cannot write to the repository: `changelog-commit` does that, and holds
  # no key.
  #
  # **`environment: changelog`**, not `release`: this job runs on every push to `main` and sends
  # pull request text to another service, and the signing key and the deploy token have no
  # business within its reach. The owner restricts the environment to `main`
  # (docs/reference/ci-and-releases.md, "What only the owner can do").
  #
  # **With no key it writes nothing and ends green**, saying so in the summary. With no release
  # branch, or the released version still on it, the script says so and does the same.
  changelog-write:
    name: changelog (write)
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: changelog
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.write.outputs.version }}
    steps:
      # All of history and every tag: the range is the last release's tag to this commit, and the
      # coming version is read from the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Told whether it is set, never what it is — as in `android-sign`.
      - name: Is there a key to write with
        id: key
        shell: bash
        env:
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Release notes — not written"
            echo
            echo "The \`changelog\` environment holds no \`OPENROUTER_API_KEY\`, so no notes were written for the"
            echo "coming release. A release merged without its \`changelog/<version>.md\` is published with"
            echo "the notes release-please wrote."
            echo
            echo "\`docs/reference/ci-and-releases.md\`, *What only the owner can do*, has the commands."
          } >> "$GITHUB_STEP_SUMMARY"

      # For the one file Node runs here. Nothing is installed, and nothing is kept between runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The only step the key reaches. The token reads pull requests and nothing else.
      - name: Write the notes for the coming release
        id: write
        if: steps.key.outputs.present == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/changelog/cli.ts next

      # Handed to `changelog-commit`, and to no other job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.present == 'true' && steps.write.outputs.version != ''
        with:
          name: release-notes
          path: release-notes/
          retention-days: 14
          if-no-files-found: error

  # **The file, onto the release PR.** One call to the contents API puts
  # `changelog/<version>.md` on release-please's branch, so the release PR's diff is the notes
  # and merging it brings them to `main`. No checkout, no key, no install.
  #
  # **The file is written again whenever `main` moves**: release-please rebuilds its branch from
  # `main`, and this job puts the newly written notes back. The commit's message names the commit
  # the notes were written from, so an old file can be told from a current one.
  changelog-commit:
    name: changelog (commit to the release PR)
    needs: [release-please, changelog-write]
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changelog-write.outputs.version != ''
        with:
          name: release-notes
          path: release-notes

      - name: Put the notes on the release branch
        if: needs.changelog-write.outputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.changelog-write.outputs.version }}
          BRANCH: release-please--branches--main--components--mtg-grimoire
          FROM: ${{ github.sha }}
        run: |
          set -euo pipefail
          file="changelog/$VERSION.md"
          [ -s "release-notes/$VERSION.md" ] || { echo "the artifact holds no release-notes/$VERSION.md" >&2; exit 1; }
          # The file's blob, when it is there already: release-please did not rebuild the branch
          # this time. **Only a successful answer is a blob.** For a file that is not there
          # `gh api` prints the 404's JSON to stdout and exits 1 (measured 2026-10-11), and that
          # text must never be sent as a `sha`.
          sha=""
          if found=$(gh api "repos/$REPO/contents/$file?ref=$BRANCH" --jq .sha 2>/dev/null); then sha=$found; fi
          args=(-X PUT "repos/$REPO/contents/$file" -f "branch=$BRANCH")
          args+=(-f "message=docs(changelog): notes for $VERSION from ${FROM:0:7}")
          args+=(-f "content=$(base64 -w0 "release-notes/$VERSION.md")")
          if [ -n "$sha" ]; then args+=(-f "sha=$sha"); fi
          gh api "${args[@]}" --jq .commit.sha
