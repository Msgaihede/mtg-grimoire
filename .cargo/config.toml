# Where cargo builds: `<repository root>/target`, which is also cargo's default for a workspace.
# The line is here because the default is not what a nested checkout gets.
#
# **Cargo finds its config by walking up from the working directory, and the agent worktrees
# are nested under the main checkout** (`.claude/worktrees/<name>/`). With no file here, a
# worktree reads the main checkout's. Measured 2026-10-08, the day the build tree moved out of
# `src-tauri/target`: this file had been deleted as redundant, the main checkout still carried
# the old pin, and `cargo metadata` in the worktree answered `D:\Code\mtg-grimoire\src-tauri/target`
# — the main checkout's tree. A debug build keeps `data/` beside its own executable, so that
# worktree's app would have opened the main checkout's dev database. A file here is nearer than
# one above it, and wins.
#
# Relative paths in this file resolve against the directory that holds `.cargo/`, so this is
# `<repository root>/target` from wherever cargo is run.
#
# **It reaches every cargo run under the repository, which includes the standalone
# `crates/card-scanner`** — cargo finds config files from the working directory, not from
# `--manifest-path`. That package keeps its own tree: `crates/card-scanner/.cargo/config.toml`
# answers a run started inside it, and every scripted run from the root (`pnpm verify`,
# `ci.yml`) passes `--target-dir crates/card-scanner/target`.
#
# **The agent worktrees read one more file, and it is that same walk put to use** (2026-10-11):
# `.claude/worktrees/.cargo/config.toml`, the folder above them, which no other checkout is
# under. It is a copy of `.claude/hooks/worktree-cargo.toml` — no incremental cache, trimmed
# debug info, and `build-dir = "{workspace-root}/target/cache"`, so that what cargo can rebuild
# sits apart from the executables and `data/`. Settings for the worktrees alone go there; a
# line added to *this* file reaches the main checkout and CI as well.
[build]
target-dir = "target"
