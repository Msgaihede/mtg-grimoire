# Where cargo builds. One line, and it is here so that converting the repository to a cargo
# workspace (2026-10-02, see the root `Cargo.toml`) moved nothing.
#
# A workspace builds into `<workspace root>/target`. Left at that default, the app's dev
# database would have moved with it — a debug build keeps `data/` beside its own executable, so
# `src-tauri/target/debug/data` would have become `target/debug/data` in every checkout, each
# one starting on an empty collection with gigabytes of stale artifacts left behind — along
# with the portable-zip path `release.yml` reads, the coverage script's report, and every
# reference doc and skill that names the folder.
#
# Relative paths in this file resolve against the directory that holds `.cargo/`, so this is
# `<repository root>/src-tauri/target` from wherever cargo is run.
#
# **It reaches every cargo run under the repository, which includes the standalone
# `crates/card-scanner`** — cargo finds config files from the working directory, not from
# `--manifest-path`. That package keeps its own tree: `crates/card-scanner/.cargo/config.toml`
# answers a run started inside it, and every scripted run from the root (`npm run verify`,
# `ci.yml`, `scanner-bundle.yml`) passes `--target-dir crates/card-scanner/target`.
#
# Moving the tree to the root later is deleting this file — and the sweep of everything that
# names `src-tauri/target`, on an announced day, since every open branch's checkout rebuilds.
[build]
target-dir = "src-tauri/target"
