"""
Everything MTG Grimoire knows about this reader's collection, wishlist, decks and home page, read-only.
"""
type Query {
  """
  Recent changes to the collection, the wishlist and every deck, newest first — the home page's activity feed.
  """
  activity(
    """At most this many lines (1–500)."""
    limit: Int = 50
  ): [ActivityEntry!]

  """
  How fresh the Art Tags dataset (what an illustration shows) is on this machine. Never fails — a dataset never downloaded answers nulls with `stale: true`.
  """
  artTagsStatus: TagStatus

  """
  One printing of a card in full — text, faces, legalities and prices per finish. Null when no printing has that id.
  """
  card(
    """The printing's Scryfall id."""
    id: String!
    marketplace: Marketplace
  ): CardDetail

  """
  How many copies of a card the reader owns, wants, and how many decks play it — every printing of the card together.
  """
  cardHoldings(
    """The oracle card — `oracleId` on `CardSummary` or `CardDetail`."""
    oracleId: String!
  ): CardHoldings

  """
  The cards a meld printing is part of. Empty for every card that is not a meld card.
  """
  cardMeldParts(
    """The printing's Scryfall id."""
    id: String!
  ): [MeldRelation!]

  """Every deck note, in any deck, that names a card."""
  cardNotes(
    """The card across all its printings (Scryfall's oracle id)."""
    oracleId: String!
  ): [CardNote!]

  """
  Every paper printing of one card (by its oracle id), newest first, each priced per finish.
  """
  cardPrintings(
    """At most this many printings (default 400, at most 1000)."""
    limit: Int
    marketplace: Marketplace

    """The oracle card — `oracleId` on `CardSummary` or `CardDetail`."""
    oracleId: String!
  ): PrintingsPage

  """
  TCGplayer's product ids for one printing, for a link to its product page. Both null when TCGplayer does not sell it.
  """
  cardTcgplayerIds(
    """The printing's Scryfall id."""
    id: String!
  ): TcgplayerIds

  """
  The whole collection sliced along one dimension — copies and value per bucket. Takes no filters.
  """
  collectionBreakdown(
    dimension: BreakdownDimension!

    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace
  ): [BreakdownRow!]

  """
  The collection's entries, one page at a time — every entry, or the ones the arguments narrow to. Name order unless `sort` says otherwise.
  """
  collectionEntries(
    """Reverse `sort`."""
    descending: Boolean

    """
    Leave out the copies in locked (set-aside) folders and the folders inside them. Ignored when `folderId` is given.
    """
    excludeLocked: Boolean

    """
    Only the copies filed directly in this folder — not in the folders inside it. Absent: every folder.
    """
    folderId: Int

    """Entries per page, 100 by default and at most 500."""
    limit: Int

    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace

    """`true`: only entries needing review; `false`: only the others."""
    needsReview: Boolean

    """Entries to skip. Default 0."""
    offset: Int

    """
    A card search in Scryfall's syntax, as the app's search box takes it — e.g. `t:creature c:g otag:ramp`.
    """
    query: String

    """Only the copies filed in no folder. Ignored when `folderId` is given."""
    rootOnly: Boolean

    """`true`: only entries that break a folder rule of their folder."""
    ruleBreaks: Boolean
    sort: CollectionSortKey
  ): CollectionEntryPage

  """
  What each collection folder holds directly (not counting its sub-folders), for every folder that holds something.
  """
  collectionFolderSummaries(
    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace
  ): [CollectionFolderSummary!]

  """
  Every folder of the collection, flat — including the app's own (each deck's folder, Recently removed). Build the tree from `parentId`.
  """
  collectionFolders: [CollectionFolder!]

  """
  Which collection entries break a folder rule of the folder they are filed in, and how many per folder. A price rule is checked at the marketplace.
  """
  collectionRuleConflicts(
    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace
  ): RuleConflicts

  """
  Per-folder counts of the collection's entries — one row per folder holding something the arguments match.
  """
  collectionShelfCounts(
    """
    Leave out the copies in locked (set-aside) folders and the folders inside them. Ignored when `folderId` is given.
    """
    excludeLocked: Boolean

    """
    Only the copies filed directly in this folder — not in the folders inside it. Absent: every folder.
    """
    folderId: Int

    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace

    """`true`: only entries needing review; `false`: only the others."""
    needsReview: Boolean

    """
    A card search in Scryfall's syntax, as the app's search box takes it — e.g. `t:creature c:g otag:ramp`.
    """
    query: String

    """Only the copies filed in no folder. Ignored when `folderId` is given."""
    rootOnly: Boolean

    """`true`: only entries that break a folder rule of their folder."""
