"""
One line of the home page's activity feed: a recent change to the collection, the wishlist or a deck, as facts rather than a sentence. `id` is unique only within a `scope`.
"""
type ActivityEntry {
  """Unix seconds."""
  at: Float!

  """
  The printing the change was about; absent when it was about no one card.
  """
  cardId: String
  cardName: String

  """The deck changed, when `scope` is `deck` and the deck still exists."""
  deck: Deck

  """The deck changed; present only when `scope` is `deck`."""
  deckId: Int

  """
  Signed change in copies (+n added, −n removed); 0 when no count changed.
  """
  delta: Int!

  """Unique within its scope only; key by scope and id."""
  id: Int!

  """
  What was done; the words depend on `scope`. Collection and wishlist: `add`, `remove`, `quantity`, `move`, `edit`, `folder`, `import`, `clear`. Deck: the `DeckHistoryKind` words.
  """
  kind: String!

  """
  The change's details; the shape depends on `scope` and `kind`, and every key may be missing. Deck lines carry `DeckHistoryEntry.payload`'s shapes.
  """
  payload: JSON!

  """
  Where the change was made: `collection`, `wishlist` or `deck` (a newer app may write another word).
  """
  scope: String!
}

"""
One way to slice the collection or the wishlist: by `rarity`, by `color` (a colour bucket — `multi` for two or more colours, `c` for colourless), by `set`, or by `finish`.
"""
enum BreakdownDimension {
  color
  finish
  rarity
  set
}

"""
One bucket of the whole collection or the whole wishlist, sliced along one `BreakdownDimension`. The buckets partition the list: summed, they are its total.
"""
type BreakdownRow {
  """Copies in the bucket, not entries."""
  cards: Int!

  """
  The bucket: a rarity, a colour bucket (`multi` and `c` included), a lowercase set code, or a finish — and on the wishlist's finish slice, `any` for wishes that name no finish.
  """
  key: String!

  """
  A readable name where the key is a code — the set's name beside its set code. Null for the other dimensions.
  """
  name: String

  """
  What the bucket's copies are worth at the marketplace, in its currency, as a decimal — summed over the copies it prices. Null when it prices none of them, which is not zero.
  """
  value: Float
}

"""
Everything about one printing of a card, as the card detail pane shows it.
"""
type CardDetail {
  """
  The illustrator. Scryfall's image policy asks for this credit wherever the art is shown.
  """
  artist: String

  """Mana value. A Float because a few joke cards have half-mana costs."""
  cmc: Float
  collectorNumber: String!

  """Each physical side, front first. Empty for a single-faced card."""
  faces: [CardFace!]!

  """
  This printing's price per finish, at the marketplace `card` was asked at.
  """
  finishPrices: FinishPrices!

  """
  The finishes this printing is published in. Empty when the corpus does not say.
  """
  finishes: [Finish!]!

  """
  The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage` component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
  """
  id: String!

  """
  Scryfall's id for the artwork. Two printings differ in art exactly when this does.
  """
  illustrationId: String

  """
  Scryfall's image quality word: `highres_scan`, `lowres`, `placeholder` or `missing`.
  """
  imageStatus: String

  """Scryfall's language code, e.g. `en`."""
  lang: String!

  """Scryfall's layout word."""
  layout: String!

  """The card's standing in every format Scryfall tracks."""
  legalities: [CardLegality!]!

  """In Scryfall's symbol notation, e.g. `{2}{R}{R}`."""
  manaCost: String
  name: String!

  """
  The oracle card this printing is of — shared by every printing of the same card. Pass it to `cardPrintings` or `cardHoldings`.
  """
  oracleId: String

  """
  The card's Scryfall Oracle tags — what the card does (`removal`, `ramp`, `card-advantage`) — as slugs, sorted, with every ancestor tag included. Empty for an untagged card and on a database that has never downloaded the Oracle tags (see `Query.oracleTagsStatus`). Not deck labels, deck tags or keyword abilities.
  """
  oracleTags: [String!]!
  oracleText: String
  rarity: String

  """The printing's release date, `YYYY-MM-DD`."""
  releasedAt: String

  """Lowercase set code, e.g. `m21`."""
  setCode: String!
  setName: String

  """
  Named special treatments of this printing (`Surge Foil`, `Showcase`, `Serialized`), read from Scryfall's promo types. Empty for an ordinary printing.
  """
  treatments: [String!]!
  typeLine: String
}

"""
One physical side of a multi-faced card (transform, modal double-faced, split…).
"""
type CardFace {
  artist: String

  """In Scryfall's symbol notation. Null or empty means no cost."""
  manaCost: String

  """Empty when the face carries no name."""
  name: String!
  oracleText: String
  typeLine: String
}

"""
What the reader holds of one card, counted across every printing of it (the oracle card, not one piece of cardboard).
"""
type CardHoldings {
  """How many decks play the card (decks, not copies; built lists only)."""
  decks: Int!

  """Copies in the collection — every printing, finish and folder together."""
  owned: Int!

  """
  Copies the wishlist asks for, every wishlist entry for the card together.
  """
  wished: Int!
}

"""Whether a card may be played in one format."""
type CardLegality {
  """Scryfall's format key: `standard`, `modern`, `commander`, `vintage`, …"""
  format: String!

  """`legal`, `not_legal`, `restricted` or `banned`."""
  status: String!
}

"""
A deck note seen from one card it names: the same note as `DeckNote`, carrying the deck it was written in instead of its cards.
"""
type CardNote {
  """The note, as Markdown (CommonMark) source."""
  body: String!

  """The deck the note is in."""
  deck: Deck
  deckId: Int!
  deckName: String!

  """The deck note's id."""
  id: Int!

  """The heading as typed; may be empty."""
  title: String!
}

"""One card's Oracle Tags, keyed by its oracle id."""
type CardOracleTags {
  oracleId: String!

  """
  Oracle tag slugs (`removal`, `ramp`), sorted, with every ancestor tag included. Empty for an untagged card, an unknown id, and a database that has never downloaded the Oracle tags — check `oracleTagsStatus` to tell them apart.
  """
  slugs: [String!]!
}

"""One page of a card search, and how many cards matched in all."""
type CardSearchResult {
  items: [CardSummary!]!

  """
  How many matched, counted no further than 5000 — read with `totalIsCapped`. With `onePerCard`, counts cards; otherwise printings.
  """
  total: Int!

  """The count stopped at its ceiling: there are `total` matches or more."""
  totalIsCapped: Boolean!
}

"""One ordering column of a card search."""
input CardSearchSort {
  """Largest, latest or last-in-the-alphabet first."""
  descending: Boolean = false

  """The column."""
  key: CardSearchSortKey!
}

"""
What a card search can be ordered by. `price` is at the marketplace the search was asked at; `released` is the printing's release date; `imageUpdated` when Scryfall last replaced its images.
"""
enum CardSearchSortKey {
  imageUpdated
  manaValue
  name
  price
  rarity
  released
  set
  type
}

"""One Magic set in the card corpus."""
type CardSet {
  """
  Paper printings of this set in the local corpus. 0 for a digital-only set.
  """
  cardCount: Int!

  """Lowercase set code, e.g. `m21` — what `s:` takes in a search query."""
  code: String!
  name: String!

  """The set's release date, `YYYY-MM-DD`."""
  releasedAt: String

  """Scryfall's set type: `expansion`, `core`, `masters`, `commander`, …"""
  setType: String
}

"""
One card search result: a printing (or, with `onePerCard`, a card represented by its newest matching printing) with the columns a card grid needs.
"""
type CardSummary {
  collectorNumber: String!

  """
  The finishes this printing is published in. Empty when the corpus does not say.
  """
  finishes: [Finish!]!

  """
  One of the cards the Commander bracket system counts as a game changer.
  """
  gameChanger: Boolean!

  """
  The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage` component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
  """
  id: String!

  """
  When Scryfall last replaced this printing's images, as an ISO 8601 timestamp.
  """
  imageUpdatedAt: String

  """
  Scryfall's layout word: `normal`, `transform`, `modal_dfc`, `split`, `meld`, …
  """
  layout: String!

  """In Scryfall's symbol notation, e.g. `{2}{R}{R}`."""
  manaCost: String
  name: String!

  """
  The oracle card this printing is of — shared by every printing of the same card.
  """
  oracleId: String

  """
  The card's Scryfall Oracle tags — what the card does (`removal`, `ramp`, `card-advantage`) — as slugs, sorted, with every ancestor tag included. Empty for an untagged card and on a database that has never downloaded the Oracle tags (see `Query.oracleTagsStatus`). Not deck labels, deck tags or keyword abilities.
  """
  oracleTags: [String!]!

  """
  Copies of this printing in the reader's collection, every finish and condition together. 0 when none.
  """
  ownedQuantity: Int!

  """
  This printing's price — nonfoil, falling back to foil, then etched. In the marketplace's own currency, in whole units (2.18 is $2.18 or €2.18) — see `Query.marketplace` for which currency. Null when that marketplace quotes no price; never filled in from another marketplace.
  """
  price: Float

  """
  With `onePerCard`, the dearest `price` among the printings this row stands for; otherwise equal to `price`. In the marketplace's own currency, in whole units (2.18 is $2.18 or €2.18) — see `Query.marketplace` for which currency. Null when that marketplace quotes no price; never filled in from another marketplace.
  """
  priceHigh: Float

  """
  With `onePerCard`, the cheapest `price` among the printings this row stands for; otherwise equal to `price`. In the marketplace's own currency, in whole units (2.18 is $2.18 or €2.18) — see `Query.marketplace` for which currency. Null when that marketplace quotes no price; never filled in from another marketplace.
  """
  priceLow: Float

  """
  How many matching printings this row stands for: 1 unless the search was asked with `onePerCard`.
  """
  printings: Int!

  """`common`, `uncommon`, `rare`, `mythic`, `special` or `bonus`."""
  rarity: String

  """
  The printing's release date, `YYYY-MM-DD`. A date after today is a card not out yet.
  """
  releasedAt: String

  """Lowercase set code, e.g. `m21`."""
  setCode: String!
  setName: String

  """
  Named special treatments of this printing (`Surge Foil`, `Showcase`, `Serialized`), read from Scryfall's promo types. Empty for an ordinary printing.
  """
  treatments: [String!]!
  typeLine: String

  """
  Whether a wishlist entry covers this printing — pinned to it, or wishing for any printing of the card.
  """
  wishlisted: Boolean!
}

"""
What a deck category is for, which is what the rules read (its name is the reader's and can be anything). `main` is every pile the reader makes; `side` is the Sideboard, `commander` the Commander zone, `companion` the Companion zone, `maybe` the Maybeboard. A deck's size counts active `main`, `commander` and `maybe` piles; `side` and `companion` are played beside the deck.
"""
enum CategoryKind {
  commander
  companion
  main
  maybe
  side
}

"""
Who made a deck category: `user` (the reader, including the four predefined piles), or `auto` (the app, while filing a card — such a pile is drawn only while it holds a card).
"""
enum CategoryOrigin {
  auto
  user
}

"""
One entry of the collection: a stack of identical copies — one printing, finish, condition and folder — and what the card database still knows about that printing. Card fields are null when the printing has left the card database; the copies are still the reader's.
"""
type CollectionEntry {
  """
  When the reader got these copies, as recorded — usually an ISO 8601 date.
  """
  acquiredAt: String

  """Where the reader got them, in their own words."""
  acquisitionSource: String
  altered: Boolean!

  """The printing's Scryfall id."""
  cardId: String!
  collectorNumber: String!
  condition: Condition!

  """The reader's entry note on this stack — free text."""
  entryNote: String

  """
  The reader's entry tags on this stack — free text, shared by every copy in it. Not Scryfall tags, deck labels or deck tags.
  """
  entryTags: [String!]!
  finish: Finish!

  """The folder these copies are filed in, or null at the root."""
  folder: CollectionFolder

  """
  The folder these copies are filed in, or null at the root of the collection.
  """
  folderId: Int
  folderName: String

  """
  A graded slab's details as stored — `{ company, grade, cert }` — or null.
  """
  grading: JSON
  id: Int!

  """The printing's language code, e.g. `en`."""
  lang: String!

  """Scryfall's layout word."""
  layout: String

  """In Scryfall's notation, e.g. `{2}{G}{G}`."""
  manaCost: String
  misprint: Boolean!
  name: String

  """
  A sentence saying why this entry needs the reader's attention (its printing vanished from Scryfall, or a merge landed it), or null.
  """
  needsReview: String

  """
  The card's Scryfall oracle id. Null only when the printing has left the card database.
  """
  oracleId: String
  proxy: Boolean!
  purchaseCurrency: String

  """What the reader paid per copy, as recorded, in `purchaseCurrency`."""
  purchasePrice: Float

  """Copies in this stack."""
  quantity: Int!
  rarity: String

  """A serialised printing's number, e.g. `042/500`."""
  serialNumber: String

  """As recorded on the entry, lowercase."""
  setCode: String!
  setName: String
  signed: Boolean!

  """How many of those copies the reader has marked for trade."""
  tradelistQuantity: Int!
  typeLine: String

  """
  One copy's price at this finish, at the marketplace, in its currency, as a decimal. Null when that marketplace has no price for it — never another marketplace's figure.
  """
  unitPrice: Float

  """When the entry was last written, in Unix seconds."""
  updatedAt: Float!
}

"""One page of collection entries."""
type CollectionEntryPage {
  items: [CollectionEntry!]!

  """Entries matching, across every page."""
  total: Int!
}

"""
One folder of the collection's filing tree. Flat: build the tree from `parentId`. A card filed in no folder is at the root, which is not a folder.
"""
type CollectionFolder {
  """The deck a `deck` folder stands for. Null for every other kind."""
  deckId: Int
  id: Int!

  """
  Whose folder it is: `user` (one the reader made), `deck` (the app's folder holding the copies a deck uses — see `deckId`) or `removed` (Recently removed: copies that left the collection but not the database).
  """
  kind: String!

  """
  Whether the reader set this folder aside (cards held for a trade, a display case), so the app stops offering its cards to decks. The folder's own flag: a folder inside a locked folder is locked too, which this does not repeat.
  """
  locked: Boolean!
  name: String!

  """The folder this one sits inside, or null at the root."""
  parentId: Int

  """
  The folder's own folder rules (inherited ones are not repeated) — criteria a card filed here is expected to meet, as stored: a list of `{ kind, … }` objects (`price`/`manaValue` with `min`/`max`, `colors`/`types`/`sets`/`rarities`/`finishes`/`conditions`/`borders` with `values`, `released` with `from`/`to`, and `group` with `op` (`and`/`or`) and nested `rules`). `[]` for none.
  """
  rules: JSON!

  """Its position among its siblings, ascending."""
  sortOrder: Int!

  """
  What this folder holds directly, not counting its sub-folders. Null when it holds nothing directly.
  """
  summary(
    """The marketplace prices are quoted at. Defaults to the reader's."""
    marketplace: Marketplace
  ): CollectionFolderSummary
}

"""
What one collection folder holds **directly** — not counting the folders inside it. A folder holding nothing directly has none.
"""
type CollectionFolderSummary {
  """Copies filed directly in this folder."""
  cards: Int!
  folderId: Int!

  """
  What those copies are worth at the marketplace, in its currency, as a decimal. Null when it prices none of them.
  """
  value: Float
}

"""
What to order collection entries by. `price` is one copy's price, `value` is price × copies held, `added` is when the entry was last written.
"""
enum CollectionSortKey {
  added
  finish
  name
  price
  quantity
  set
  value
}

"""
The collection's totals, over the same filters as the entries they caption.
"""
type CollectionSummary {
  """Entries (stacks)."""
  entries: Int!

  """Entries that need the reader's attention."""
  needsReview: Int!

  """Copies, not entries."""
  totalCards: Int!

  """Copies marked for trade."""
  tradelistCards: Int!

  """Distinct printings recorded."""
  uniqueCards: Int!

  """Copies the marketplace has no price for, and so left out of `value`."""
  unpriced: Int!

  """
  What the copies are worth at the marketplace, in its currency, as a decimal — over the copies it prices. Read beside `unpriced`.
  """
  value: Float!
}

"""
Which rule a format judges its commander by. A rule name, not a format name: two formats may share one (`predh` uses `edh`).
"""
enum CommanderRule {
  brawl
  duel
  edh
  oathbreaker
  pdh
  tlr
}

"""A copy's condition. `NONE` is a copy nobody graded."""
enum Condition {
  DMG
  HP
  LP
  MP
  NM
  NONE
}

"""
One deck, as the deck gallery lists it. Every deck has a live list (the cards as built); a deck with `theoryEnabled` also has a theory list (the version being planned).
"""
type Deck {
  archived: Boolean!

  """
  The Commander bracket (1–5) the reader declared for the deck, or 0 when they have not (the app then estimates one).
  """
  bracket: Int!

  """
  Copies in the live list's active `main`, `commander` and `maybe` categories — what “a 60-card deck” means.
  """
  cardCount: Int!

  """
  The categories of one of the deck's lists, in order, empty ones included.
  """
  categories(
    """The marketplace to price at. Defaults to the reader's."""
    marketplace: Marketplace
    variant: DeckVariant = live
  ): [DeckCategory!]!

  """
  The cover's illustrator. Credit them wherever the cover is shown; when absent, do not draw the cover.
  """
  coverArtist: String

  """The printing whose art crop is the deck's cover."""
  coverCardId: String
  description: String

  """The deck folder it is filed in; absent at the root."""
  folder: DeckFolder

  """The deck folder it is filed in; absent at the root."""
  folderId: Int

  """
  The deck's format and its rules; absent for a format this app no longer knows.
  """
  format: Format

  """The format's id (`commander`, `modern`, `casual`, …)."""
  formatKey: String!

  """
  The format's display name; absent for a format this app no longer knows.
  """
  formatName: String
  gameKey: DeckGame!

  """The deck's history, newest first."""
  history(
    """At most this many lines (1–500)."""
    limit: Int = 50
  ): [DeckHistoryEntry!]!
  id: Int!

  """The deck labels this deck's cards wear in one list, most-used first."""
  labels(variant: DeckVariant = live): [DeckLabelUsage!]!

  """The list the deck editor was last showing."""
  lastVariant: DeckVariant!
  managedWishlist: ManagedWishlistMode!
  name: String!

  """The deck's notes, in the reader's order."""
  notes: [DeckNote!]!

  """Whether the deck editor's Notes band is expanded."""
  notesOpen: Boolean!

  """
  The live list's printed mana costs, for a colour bar. Empty for a deck of lands or no cards.
  """
  pipCosts: [PipCost!]!

  """
  Deck tags: the reader's free-text words for the whole deck (`Budget`, `Meme`), in the order added. Not deck labels and not Scryfall tags.
  """
  tags: [String!]!

  """Whether the deck keeps a theory list (a plan) beside its live one."""
  theoryEnabled: Boolean!

  """The deck's to-do lists, in the reader's order — empty ones included."""
  todoLists: [DeckTodoList!]!

  """Whether the deck editor's To-do band is expanded."""
  todosOpen: Boolean!
  tokenMode: TokenMode!

  """Unix seconds of the last change to the deck or its cards."""
  updatedAt: Float!

  """What the deck's live cards are worth at a marketplace."""
  value(
    """The marketplace to price at. Defaults to the reader's."""
    marketplace: Marketplace
  ): DeckValue

  """
  Whether the deck is tracked without owning the cards (an Arena or MTGO list, a proxy pile). Such a deck reads nothing from the collection.
  """
  virtualOnly: Boolean!
}

"""
One card row in one category of one deck list: the printing, how many copies, the deck label it wears, the card's facts, its price, and how many of it the reader owns for this deck. Card facts are absent when the printing has left the card database.
"""
type DeckCard {
  """The Scryfall id of the printing."""
  cardId: String!

  """
  False when the row's category is switched off, so it counts toward nothing.
  """
  categoryActive: Boolean!
  categoryId: Int!
  categoryKind: CategoryKind!
  categoryName: String!

  """Mana value."""
  cmc: Float
  collectorNumber: String!

  """Colour identity letters run together (`"WU"`)."""
  colorIdentity: String

  """Colour letters run together (`"WU"`), not a list. `""` is colourless."""
  colors: String

  """
  Printed at uncommon on any printing — what makes a Pauper Commander commander.
  """
  everUncommon: Boolean!

  """
  Scryfall's `card_faces` array for a card with more than one face, verbatim; absent for a one-faced card.
  """
  faces: JSON

  """
  The finish the deck plays: `foil` or `etched`, or absent for the regular (nonfoil) copy.
  """
  finish: Finish

  """On the Commander Game Changers list."""
  gameChanger: Boolean
  id: Int!
  labelColor: String

  """
  The deck label this card wears, if any. The three label fields go together.
  """
  labelId: Int
  labelName: String
  lang: String!
  layout: String

  """
  This printing's legality per format, as Scryfall gives it: an object of format key → `legal` | `not_legal` | `restricted` | `banned`.
  """
  legalities: JSON

  """In Scryfall's symbol form, e.g. `"{2}{G}{G}"`."""
  manaCost: String
  name: String!

  """A sentence when a sync could not keep this row's printing."""
  needsReview: String

  """The card across all its printings (Scryfall's oracle id)."""
  oracleId: String
  oracleText: String

  """
  Copies of this printing and finish the reader owns for this row: on the live list, the copies filed in the deck's own collection group; on the theory list, every copy the deck could use. Always 0 in a switched-off category.
  """
  ownedQuantity: Int!

  """As printed — may be `"*"`."""
  power: String

  """
  Every finish this printing exists in (`nonfoil`, `foil`, `etched`) — not the finish the deck plays, which is `finish`.
  """
  printingFinishes: [String!]

  """
  The colours of mana the card can make, letters run together (`"C"` for colourless); `""` when it makes none, absent when unknown.
  """
  producedMana: String

  """
  Scryfall's `promo_types` (`surgefoil`, `halofoil`, …), which name a foil's kind.
  """
  promoTypes: [String!]

  """Copies in this row."""
  quantity: Int!
  rarity: String

  """Lowercase, as Scryfall stores it."""
  setCode: String!
  setName: String
  toughness: String
  typeLine: String

  """
  One copy's price at the marketplace asked for, at the row's finish, as a decimal amount in that marketplace's currency; absent when it has none.
  """
  unitPrice: Float
  variant: DeckVariant!
}

"""
One category of one list (live or theory) of a deck: a named pile of cards, drawn as a column in the deck editor.
"""
type DeckCategory {
  """Copies in the pile, not rows."""
  cardCount: Int!
  deckId: Int!
  id: Int!

  """
  Whether the pile counts. A switched-off pile counts toward no deck size, copy limit or legality check; the Maybeboard starts switched off.
  """
  isActive: Boolean!
  kind: CategoryKind!

  """As the reader named it."""
  name: String!
  origin: CategoryOrigin!
  sortOrder: Int!

  """
  Unit price × copies over the pile, as a decimal amount in the marketplace's currency; a partial sum over the copies that have a price, absent when none do.
  """
  totalPrice: Float
  variant: DeckVariant!
}

"""
How far one deck is along, counted exactly as the deck editor counts: every active pile (sideboard and companion included), a copy matching on exact printing and finish.
"""
type DeckCompletion {
  deckId: Int!

  """
  Which list the figures are a fraction of: `live` under `collection`, `theory` under `theory`.
  """
  list: DeckVariant!

  """`wanted - owned`; never negative."""
  missing: Int!

  """
  What the missing copies cost. Null when nothing in the list is priced at this marketplace (draw a dash, not 0).
  """
  missingCost: Float

  """Of those, copies already covered. Never more than `wanted`."""
  owned: Int!

  """
  Missing copies this marketplace has no price for, left out of `missingCost`.
  """
  unpricedMissing: Int!

  """Copies the measured list asks for."""
  wanted: Int!
}

"""
What deck completion measures. `collection`: every non-virtual deck's live list against the copies the collection files in that deck's own folder group. `theory`: every deck that keeps a theory list (virtual ones included), its live list against that plan.
"""
enum DeckCompletionCompare {
  collection
  theory
}

"""
