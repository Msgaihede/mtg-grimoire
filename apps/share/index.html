<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared collection — MTG Grimoire</title>
    <!--
      **A development shell, and the production one is a Worker.**

      `GET /s/{id}` is rendered by `infrastructure/share-worker/src/page.ts`, not served as a
      file: the HTML has to carry OpenGraph tags built from the D1 row (*"Giradeli's Trade binder ·
      412 cards · updated 2 days ago"*), which is the whole payoff of storing a snapshot in the
      clear. This file exists so `vite --config apps/share/vite.config.ts` has an entry and a page
      to open; the built `apps/share/dist-share/index.html` is served by nothing.

      Two things it mirrors from the Worker's shell, and both are load-bearing:

      * `<div id="root">` and no `class="dark"` on `<html>` — `main.tsx` adds the class, so this
        page exercises the same path production does.
      * `<link id="snapshot">` is how the bundle learns where the blob is. Here it points at the
        committed golden — the same document
        `apps/desktop/src-tauri/src/share/__golden__/snapshot.json` that both suites assert
        against — so the dev server draws a real binder rather than the "not ready yet" state.

      **Its `href` is a placeholder.** The golden is outside this app's root, and a dev server
      answers for a file out there only under `/@fs/` and by its absolute path, which is a
      different string on every machine. `vite.config.ts`'s `share:golden-snapshot` writes it in
      as the page is served.

      `vite-ignore` is kept from when the `href` was the golden's own path: Vite 8 treats a
      `rel="preload" as="fetch"` link as an asset, and with that path `share:build` copied the
      golden into `apps/share/dist-share/assets/`, the folder the share Worker's `assets` binding
      serves, and published a test fixture. It no longer does anything the build shows. Measured
      2026-10-08, `share:build` with the attribute and without it emits the same twenty-one files,
      the golden in neither, because what the plugin writes in is a `/@fs/` address the dev
      server answers and not a file Vite can copy. The attribute stays as the guard if the
      `href` is ever a path to a real file again.
    -->
    <link
      vite-ignore
      id="snapshot"
      rel="preload"
      as="fetch"
      crossorigin
      href="%GOLDEN_SNAPSHOT%"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
