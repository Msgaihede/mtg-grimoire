[package]
name = "grimoire-core"
# **The app's version, not this crate's own**: `scryfall::USER_AGENT` is built from it, and
# Scryfall asks for an accurate one. release-please bumps it with `src-tauri`'s
# (`release-please-config.json`), and `src-tauri`'s `the_core_wears_the_apps_version` goes red
# on a release that moved one and not the other.
version = "0.39.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "MTG Grimoire's engine, with no window: what every host links."
publish = false

# **Three hosts link this crate and it knows about none of them**: the desktop app in
# `src-tauri`, an Android shell and a WASM build in a Worker
# (`docs/superpowers/specs/2026-10-01-light-app-android-and-web-design.md` §2). So it compiles
# for `x86_64-pc-windows-msvc`, `aarch64-linux-android` and `wasm32-unknown-unknown`, and CI's
# `core` job is what says so on every pull request that can have broken it.
#
# **There is no `tauri` here and there never may be** — `platform::fence` reads this file and
# fails on a dependency by that name, because a window is a host's and a crate that can name
# one has stopped being portable without anything going red on a desktop build.
#
# A dependency this crate shares with `src-tauri` is declared in both manifests with the same
# version and the same features. Cargo unifies them into one build either way; spelling them
# alike is what keeps `cargo test -p grimoire-core` from compiling a second SQLite.

[lib]
name = "grimoire_core"

[features]
# **Test scaffolding other crates' tests may reach, and nothing a build ships.** It turns on
# `schema::memory_pair`, `scratch`, `CardRow::from_json` and every module's `fixtures` —
# `schema`'s, `sync_engine::capture`'s, and those of `card`, `collection`, `deck`, `deck_tokens`,
# `maintenance` and `reset` — which this crate's own tests get from `cfg(test)`, for
# `src-tauri`'s tests, which ask for it under `[dev-dependencies]` only.
#
# ⚠️ **Two things behind it are not scaffolding, and are why a host's ordinary dependency line
# must never name it.** `image_uri::is_allowed_host` lets a loopback host through under it, so
# the image fetcher's tests can use a mock server: on in a shipped build, that is an image
# fetcher that accepts `http://127.0.0.1:…`. And `bulk_undo::with_store` keeps its tickets per
# thread under it, so tests cannot evict each other's: on in a shipped build, an undo runs on a
# different thread from the write it undoes and finds nothing. `platform::fence` reads the
# workspace's manifests for it and CI's `rust` job asks `cargo tree`. Never make it a default
# feature, and never have another feature imply it.
testing = []

[dependencies]
# The card scanner, for `scanner`'s session glue (the extraction's seventh step). Declared as
# `src-tauri` declares it — a plain path dependency on a standalone package the workspace
# excludes on purpose (the root `Cargo.toml` says why), with the app's two features: `corpus` for
# the labels out of `corpus.db`, `ocr` for the two readers. **It compiles for all three targets**
# and was measured on wasm32 before it came here: libsqlite3-sys is not in that tree at all, so
# the crate's `bundled` asks nothing of a browser build. **It does not yet run in a browser** —
# the crate's own threads and `Instant` panic there — and nothing calls it there before the light
# app's phase 7 gives them a seam.
card-scanner = { path = "../card-scanner", features = ["corpus", "ocr"] }
# What makes two label names the same name. `deck_labels` is one global list since schema v21
# and its uniqueness grain is a **key** rather than the word itself: NFC, then Unicode
# lowercase, then NFC again - so "Cafe" spelled with a precomposed e-acute, with a combining
# accent, and in capitals is one label rather than three rows a reader cannot tell apart.
# SQLite cannot answer this on its own: `COLLATE NOCASE` is ASCII-only and the bundled build
# carries no normalisation at all, which is why the key is computed here and stored. Two small
# tables and no dependencies of its own. `schema::label_name_key` is its one caller, and it
# moved here from `src-tauri/Cargo.toml` with it.
unicode-normalization = "0.1"
flate2 = "1"
# `platform::http`, on every target: natively the client this app has always used, and in a
# browser `reqwest`'s own `fetch` backend — which is why it is one line and not two. rustls,
# never native-tls (no OpenSSL or schannel in a portable build; the feature names nothing on
# wasm, where the TLS is the browser's), and deliberately NO `gzip` feature: Scryfall's bulk
# data is a real .gz *file*, not a `Content-Encoding`, so transparent decompression would
# corrupt the download. `stream` is what makes `bytes_stream()` available. The same line as
# `src-tauri`'s, which still builds the feeds', the relay's and the updater's clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# A body's chunks (`platform::http::Body`), the browser arm's deadline (`platform::timer`) and
# `scryfall`'s pacing gate — an async mutex that is not the runtime's, because the browser has
# no runtime to borrow one from.
futures-util = "0.3"
# What a chunk of a response body is. `reqwest` hands these out; naming the crate is what lets
# `platform::http::Body::chunk` say so in its signature.
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# HKDF-SHA256's hash. `src-tauri` names it too, for the user schema's derived uids and the
# updater's digest check.
sha2 = "0.10"
# Pairing (spec §7.5) and the sync envelope (§7.7). The version choices are one decision rather
# than several, and they moved here from `src-tauri/Cargo.toml` with `sync_pair::crypto`, which
# is the only code that names any of them.
#
# `x25519-dalek` gets `getrandom` so `StaticSecret::random()` exists and this crate never has to
# hold an RNG of its own, and `static_secrets` because a device's key is reused for every pairing
# it ever does — an `EphemeralSecret` is consumed by its one `diffie_hellman`.
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
# **0.10 and deliberately not 0.11.** 0.11 moves RustCrypto's array types to `hybrid-array`,
# which would stand a second array stack beside the `sha2 0.10 -> digest 0.10 -> crypto-common
# 0.1 -> generic-array 0.14` this tree already carries. 0.10 and `hkdf 0.12` sit on that one.
# XChaCha20-Poly1305 rather than the 96-bit-nonce variant: a 192-bit nonce can be drawn at
# random for every message with no counter to keep, and a counter kept across three devices and
# a restore-from-backup is exactly the thing that gets reused.
#
# **`default-features = false` drops `getrandom`.** The default feature set enables
# `aead/getrandom`, which pulls `rand_core 0.6` and with it **`getrandom 0.2`** - a third major
# of that crate in the tree, and the one that refuses `wasm32-unknown-unknown` outright. Nothing
# here uses what it buys: `AeadCore::generate_nonce` is unreachable, because `crypto::seal`
# draws its own 24 bytes through `crypto::random_bytes`. So the line is a subtraction.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
# The sealed envelope as a JSON string. **base64url and not hex**: the relay stores ciphertext
# as TEXT in a Durable Object, and hex would be twice the bytes over the wire and against the
# 2 MB per-row cap where base64 is four thirds; URL-safe so the blob can be a path segment
# later without anything having to escape it. `default-features = false` drops `std`; `alloc`
# is the whole API `Engine::encode`/`decode` needs.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Random bytes for the group key, the group id, the device id, the pairing token and every
# nonce. `fill` is the whole API this uses, and it is spelled the same in 0.3 and 0.4 — so the
# pin follows whichever major `x25519-dalek` resolved, and moving it is a one-word edit with no
# code change. `cargo tree -d` is the check: `x25519-dalek 3.0.0` resolves **0.4.3**, and
# declaring 0.3 would stand two majors of the same crate in the tree.
getrandom = "0.4"
# The invite as a picture. The page renders the matrix itself — see
# `sync_pair::invite::qr_matrix` — so the crate's own `image` and `svg` renderers are dead
# weight and `default-features = false` drops them. Building the matrix is the fact; drawing it
# is the page's, which is this repo's boundary applied to a QR code.
qrcode = { version = "0.14", default-features = false }

# ── Desktop and Android ──────────────────────────────────────────────────────────────────────
# `bundled` is libsqlite3-sys compiling sqlite3.c with the host's C compiler — right on Windows,
# on Linux and through the NDK, and impossible for a browser. `hooks` is the update, commit and
# rollback hook `src/hooks.rs` installs on the write connection — the cross-file fence rides it,
# and so does every observer a host registers.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
# `platform::timer` and `platform::files::aio`, natively. **Every host's async code runs on
# tokio** — Tauri's runtime is one — so the sleep is the runtime's and the file writes go through
# its blocking pool. `rt` is not optional: `tokio::fs` runs every operation through
# `spawn_blocking`, which needs a runtime handle. The features are the ones this crate's own
# source names; `src-tauri` asks for more (`macros`) for code that is still its own.
# `sync` is `platform::sync`'s — the image cache's permits and its lock per key — and is the
# one feature the web table asks for too. The rest are not on wasm: `tokio::fs` does not
# compile there, and a Worker has no tokio runtime to drive a timer.
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }

# ── Web ──────────────────────────────────────────────────────────────────────────────────────
# ⚠️ NEVER add `default-features = false` to this rusqlite line. `ffi-sqlite-wasm-rs` — the FFI
# backend that makes wasm work at all — is in rusqlite's DEFAULT feature set, and switching it
# off fails the build with `unresolved import libsqlite3_sys`, which reads exactly like "wasm is
# unsupported" and is the opposite of the truth. The first web build paid for that once
# (`docs/superpowers/research/2026-08-27-wasm-core-spike.md`, in history at `cd54f1a6`).
#
# `hooks` and not `bundled`: `bundled` is a host C compile. What compiles SQLite here is
# `sqlite-wasm-rs`, with `cc` targeting wasm32 — which needs clang 18 or newer and is why CI's
# `core` job runs on Ubuntu 24.04.
[target.'cfg(target_family = "wasm")'.dependencies]
rusqlite = { version = "0.40", features = ["hooks"] }
# The browser's `crypto.getRandomValues`. Features across target tables are additive, so this
# and the line above are one dependency. With getrandom 0.3 the feature had to be paired with
# `--cfg getrandom_backend="wasm_js"`; 0.4 needs no build flag.
getrandom = { version = "0.4", features = ["wasm_js"] }
# `Date.now()`, for `platform::clock` — `SystemTime::now()` panics on this target.
js-sys = "0.3"
# `platform::sync` and nothing else: a semaphore and a mutex need no runtime, so this is the
# one part of tokio a browser build carries. **Never widen it here** — `fs`, `rt` and `time`
# each either fail to compile for this target or need a runtime a Worker does not have.
tokio = { version = "1", features = ["sync"] }
# `platform::timer`'s browser arm: a `Promise` around the Worker's `setTimeout`, awaited.
# Both are in the tree already, under `reqwest`'s `fetch` backend.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Native tests only: a scratch directory for the tests that open a real pair of files. Nothing
# builds dev-dependencies for a target that cannot run them, which is why this needs no target
# table.
[dev-dependencies]
tempfile = "3"
# `scryfall`'s tests answer from a local mock server, and never from Scryfall.
httpmock = "0.8"
# `#[tokio::test]`, for the tests of what is async here.
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util"] }
