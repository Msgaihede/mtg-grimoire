"""
One way to slice the collection or the wishlist: by `rarity`, by `color` (a colour bucket —
`multi` for two or more colours, `c` for colourless), by `set`, or by `finish`.
"""
enum BreakdownDimension {
	color
	finish
	rarity
	set
}

type BreakdownRow {
	"""
	Copies in the bucket, not entries.
	"""
	cards: Int!
	"""
	The bucket: a rarity, a colour bucket (`multi` and `c` included), a lowercase set code, or
	a finish — and on the wishlist's finish slice, `any` for wishes that name no finish.
	"""
	key: String!
	"""
	A readable name where the key is a code — the set's name beside its set code. Null for the
	other dimensions.
	"""
	name: String
	"""
	What the bucket's copies are worth at the marketplace, in its currency, as a decimal —
	summed over the copies it prices. Null when it prices none of them, which is not zero.
	"""
	value: Float
}

"""
Everything about one printing of a card, as the card detail pane shows it.
"""
type CardDetail {
	"""
	The illustrator. Scryfall's image policy asks for this credit wherever the art is shown.
	"""
	artist: String
	"""
	Mana value. A Float because a few joke cards have half-mana costs.
	"""
	cmc: Float
	collectorNumber: String!
	"""
	Each physical side, front first. Empty for a single-faced card.
	"""
	faces: [CardFace!]!
	"""
	This printing's price per finish, at the marketplace `card` was asked at.
	"""
	finishPrices: FinishPrices!
	"""
	The finishes this printing is published in. Empty when the corpus does not say.
	"""
	finishes: [Finish!]!
	"""
	The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage`
	component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
	"""
	id: String!
	"""
	Scryfall's id for the artwork. Two printings differ in art exactly when this does.
	"""
	illustrationId: String
	"""
	Scryfall's image quality word: `highres_scan`, `lowres`, `placeholder` or `missing`.
	"""
	imageStatus: String
	"""
	Scryfall's language code, e.g. `en`.
	"""
	lang: String!
	"""
	Scryfall's layout word.
	"""
	layout: String!
	"""
	The card's standing in every format Scryfall tracks.
	"""
	legalities: [CardLegality!]!
	"""
	In Scryfall's symbol notation, e.g. `{2}{R}{R}`.
	"""
	manaCost: String
	name: String!
	"""
	The oracle card this printing is of — shared by every printing of the same card. Pass it
	to `cardPrintings` or `cardHoldings`.
	"""
	oracleId: String
	"""
	The card's Scryfall Oracle tags — what the card does (`removal`, `ramp`,
	`card-advantage`) — as slugs, sorted, with every ancestor tag included. Empty for an
	untagged card and on a database that has never downloaded the Oracle tags (see
	`Query.oracleTagsStatus`). Not deck labels, deck tags or keyword abilities.
	"""
	oracleTags: [String!]!
	oracleText: String
	rarity: String
	"""
	The printing's release date, `YYYY-MM-DD`.
	"""
	releasedAt: String
	"""
	Lowercase set code, e.g. `m21`.
	"""
	setCode: String!
	setName: String
	typeLine: String
}

"""
One physical side of a multi-faced card (transform, modal double-faced, split…).
"""
type CardFace {
	artist: String
	"""
	In Scryfall's symbol notation. Null or empty means no cost.
	"""
	manaCost: String
	"""
	Empty when the face carries no name.
	"""
	name: String!
	oracleText: String
	typeLine: String
}

"""
Which cards to list. Every field narrows; absent fields do not. Tag slugs come from the
`tagSearch` and `tagChildren` fields.
"""
input CardFilterInput {
	"""
	Art Tags (what the illustration shows), by slug.
	"""
	artTags: TagTermsInput
	"""
	With `artTags`: `strong` keeps only art the tag is central to.
	"""
	artWeightFloor: String
	"""
	Any of `regular`, `borderless`, `fullart`.
	"""
	borders: [String!]
	"""
	Colour identity letters from `WUBRGC`, e.g. `UR`: cards that fit in a deck of those
	colours. `C` alone is the colourless cards.
	"""
	colors: String
	"""
	With `colors`: exactly that identity — `UR` answers the Izzet cards alone, not mono-blue,
	mono-red or colourless.
	"""
	colorsStrict: Boolean
	"""
	Only cards legal in this format (its key, e.g. `commander`, `modern`).
	"""
	format: String
	"""
	Any of these mana values (0–255). X counts as 0, as Scryfall counts it.
	"""
	manaValues: [Int!]
	"""
	Also cards with `{X}` in their printed cost (joins the mana values as one more choice).
	"""
	manaX: Boolean
	"""
	One card, every printing (its oracle id).
	"""
	oracleId: String
	"""
	Oracle Tags (what the card does), by slug.
	"""
	oracleTags: TagTermsInput
	"""
	Only printings made on paper. Absent: true in a card search, false in the collection.
	"""
	paperOnly: Boolean
	"""
	Only printings legal in at least one format.
	"""
	playableOnly: Boolean
	"""
	Field-level conditions, every one of which must hold — the Search box's keywords.
	"""
	predicates: [PredicateInput!]
	"""
	Printings made in any of these finishes.
	"""
	printedFinishes: [Finish!]
	"""
	Any of these rarities.
	"""
	rarities: [String!]
	"""
	One rarity: `common`, `uncommon`, `rare`, `mythic`, `special`, `bonus`.
	"""
	rarity: String
	"""
	One set's code, e.g. `mh3`.
	"""
	setCode: String
	"""
	Any of these set codes.
	"""
	sets: [String!]
	"""
	Free text, prefix-matched against the card's name and rules text.
	"""
	text: String
	"""
	Any of these card types, capitalised: `Artifact`, `Battle`, `Creature`, `Enchantment`,
	`Instant`, `Land`, `Planeswalker`, `Sorcery`.
	"""
	types: [String!]
	"""
	`beyond` (Universes Beyond) or `within` (Universes Within); absent, both.
	"""
	universe: String
}

"""
What the reader holds of one card, counted across every printing of it (the oracle card, not
one piece of cardboard).
"""
type CardHoldings {
	"""
	How many decks play the card (decks, not copies; built lists only).
	"""
	decks: Int!
	"""
	Copies in the collection — every printing, finish and folder together.
	"""
	owned: Int!
	"""
	Copies the wishlist asks for, every wishlist entry for the card together.
	"""
	wished: Int!
}

"""
Whether a card may be played in one format.
"""
type CardLegality {
	"""
	Scryfall's format key: `standard`, `modern`, `commander`, `vintage`, …
	"""
	format: String!
	"""
	`legal`, `not_legal`, `restricted` or `banned`.
	"""
	status: String!
}

"""
One card's Oracle Tags, keyed by its oracle id.
"""
type CardOracleTags {
	oracleId: String!
	"""
	Oracle tag slugs (`removal`, `ramp`), sorted, with every ancestor tag included. Empty for
	an untagged card, an unknown id, and a database that has never downloaded the Oracle
	tags — check `oracleTagsStatus` to tell them apart.
	"""
	slugs: [String!]!
}

"""
One page of a card search, and how many cards matched in all.
"""
type CardSearchResult {
	items: [CardSummary!]!
	"""
	How many matched, counted no further than 5000 — read with `totalIsCapped`. With
	`onePerCard`, counts cards; otherwise printings.
	"""
	total: Int!
	"""
	The count stopped at its ceiling: there are `total` matches or more.
	"""
	totalIsCapped: Boolean!
}

"""
One ordering column of a card search.
"""
input CardSearchSort {
	"""
	Largest, latest or last-in-the-alphabet first.
	"""
	descending: Boolean = false
	"""
	The column.
	"""
	key: CardSearchSortKey!
}

"""
What a card search can be ordered by. `price` is at the marketplace the search was asked at;
`released` is the printing's release date; `imageUpdated` when Scryfall last replaced its
images.
"""
enum CardSearchSortKey {
	imageUpdated
	manaValue
	name
	price
	rarity
	released
	set
	type
}

"""
One Magic set in the card corpus.
"""
type CardSet {
	"""
	Paper printings of this set in the local corpus. 0 for a digital-only set.
	"""
	cardCount: Int!
	"""
	Lowercase set code, e.g. `m21` — what `s:` takes in a search query.
	"""
	code: String!
	name: String!
	"""
	The set's release date, `YYYY-MM-DD`.
	"""
	releasedAt: String
	"""
	Scryfall's set type: `expansion`, `core`, `masters`, `commander`, …
	"""
	setType: String
}

"""
One card search result: a printing (or, with `onePerCard`, a card represented by its newest
matching printing) with the columns a card grid needs.
"""
type CardSummary {
	collectorNumber: String!
	"""
	The finishes this printing is published in. Empty when the corpus does not say.
	"""
	finishes: [Finish!]!
	"""
	One of the cards the Commander bracket system counts as a game changer.
	"""
	gameChanger: Boolean!
	"""
	The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage`
	component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
	"""
	id: String!
	"""
	When Scryfall last replaced this printing's images, as an ISO 8601 timestamp.
	"""
	imageUpdatedAt: String
	"""
	Scryfall's layout word: `normal`, `transform`, `modal_dfc`, `split`, `meld`, …
	"""
	layout: String!
	"""
	In Scryfall's symbol notation, e.g. `{2}{R}{R}`.
	"""
	manaCost: String
	name: String!
	"""
	The oracle card this printing is of — shared by every printing of the same card.
	"""
	oracleId: String
	"""
	The card's Scryfall Oracle tags — what the card does (`removal`, `ramp`,
	`card-advantage`) — as slugs, sorted, with every ancestor tag included. Empty for an
	untagged card and on a database that has never downloaded the Oracle tags (see
	`Query.oracleTagsStatus`). Not deck labels, deck tags or keyword abilities.
	"""
	oracleTags: [String!]!
	"""
	Copies of this printing in the reader's collection, every finish and condition
	together. 0 when none.
	"""
	ownedQuantity: Int!
	"""
	This printing's price — nonfoil, falling back to foil, then etched. In the marketplace's
	own currency, in whole units (2.18 is $2.18 or €2.18) — see `Query.marketplace` for which
	currency. Null when that marketplace quotes no price; never filled in from another
	marketplace.
	"""
	price: Float
	"""
	With `onePerCard`, the dearest `price` among the printings this row stands for;
	otherwise equal to `price`. In the marketplace's own currency, in whole units. Null when
	that marketplace quotes no price; never filled in from another marketplace.
	"""
	priceHigh: Float
	"""
	With `onePerCard`, the cheapest `price` among the printings this row stands for;
	otherwise equal to `price`. In the marketplace's own currency, in whole units. Null when
	that marketplace quotes no price; never filled in from another marketplace.
	"""
	priceLow: Float
	"""
	How many matching printings this row stands for: 1 unless the search was asked with
	`onePerCard`.
	"""
	printings: Int!
	"""
	`common`, `uncommon`, `rare`, `mythic`, `special` or `bonus`.
	"""
	rarity: String
	"""
	The printing's release date, `YYYY-MM-DD`. A date after today is a card not out yet.
	"""
	releasedAt: String
	"""
	Lowercase set code, e.g. `m21`.
	"""
	setCode: String!
	setName: String
	typeLine: String
	"""
	Whether a wishlist entry covers this printing — pinned to it, or wishing for any
	printing of the card.
	"""
	wishlisted: Boolean!
}

type CollectionEntry {
	"""
	When the reader got these copies, as recorded — usually an ISO 8601 date.
	"""
	acquiredAt: String
	"""
	Where the reader got them, in their own words.
	"""
	acquisitionSource: String
	altered: Boolean!
	"""
	The printing's Scryfall id.
	"""
	cardId: String!
	collectorNumber: String!
	condition: Condition!
	"""
	The reader's entry note on this stack — free text.
	"""
	entryNote: String
	"""
	The reader's entry tags on this stack — free text, shared by every copy in it. Not
	Scryfall tags, deck labels or deck tags.
	"""
	entryTags: [String!]!
	finish: Finish!
	"""
	The folder these copies are filed in, or null at the root. Batched: one read of the folder
	list however many entries ask.
	"""
	folder: CollectionFolder
	"""
	The folder these copies are filed in, or null at the root of the collection.
	"""
	folderId: Int
	folderName: String
	"""
	A graded slab's details as stored — `{ company, grade, cert }` — or null.
	"""
	grading: JSON
	id: Int!
	"""
	The printing's language code, e.g. `en`.
	"""
	lang: String!
	"""
	Scryfall's layout word.
	"""
	layout: String
	"""
	In Scryfall's notation, e.g. `{2}{G}{G}`.
	"""
	manaCost: String
	misprint: Boolean!
	name: String
	"""
	A sentence saying why this entry needs the reader's attention (its printing vanished from
	Scryfall, or a merge landed it), or null.
	"""
	needsReview: String
	"""
	The card's Scryfall oracle id. Null only when the printing has left the card database.
	"""
	oracleId: String
	proxy: Boolean!
	purchaseCurrency: String
	"""
	What the reader paid per copy, as recorded, in `purchaseCurrency`.
	"""
	purchasePrice: Float
	"""
	Copies in this stack.
	"""
	quantity: Int!
	rarity: String
	"""
	A serialised printing's number, e.g. `042/500`.
	"""
	serialNumber: String
	"""
	As recorded on the entry, lowercase.
	"""
	setCode: String!
	setName: String
	signed: Boolean!
	"""
	How many of those copies the reader has marked for trade.
	"""
	tradelistQuantity: Int!
	typeLine: String
	"""
	One copy's price at this finish, at the marketplace, in its currency, as a decimal. Null
	when that marketplace has no price for it — never another marketplace's figure.
	"""
	unitPrice: Float
	"""
	When the entry was last written, in Unix seconds.
	"""
	updatedAt: Float!
}

type CollectionEntryPage {
	items: [CollectionEntry!]!
	"""
	Entries matching, across every page.
	"""
	total: Int!
}

type CollectionFolder {
	"""
	The deck a `deck` folder stands for. Null for every other kind.
	"""
	deckId: Int
	id: Int!
	"""
	Whose folder it is: `user` (one the reader made), `deck` (the app's folder holding the
	copies a deck uses — see `deckId`) or `removed` (Recently removed: copies that left the
	collection but not the database).
	"""
	kind: String!
	"""
	Whether the reader set this folder aside (cards held for a trade, a display case), so the
	app stops offering its cards to decks. The folder's own flag: a folder inside a locked
	folder is locked too, which this does not repeat.
	"""
	locked: Boolean!
	name: String!
	"""
	The folder this one sits inside, or null at the root.
	"""
	parentId: Int
	"""
	The folder's own folder rules (inherited ones are not repeated) — criteria a card filed
	here is expected to meet, as stored: a list of `{ kind, … }` objects (`price`/`manaValue`
	with `min`/`max`, `colors`/`types`/`sets`/`rarities`/`finishes`/`conditions`/`borders`
	with `values`, `released` with `from`/`to`, and `group` with `op` (`and`/`or`) and nested
	`rules`). `[]` for none.
	"""
	rules: JSON!
	"""
	Its position among its siblings, ascending.
	"""
	sortOrder: Int!
	"""
	What this folder holds directly, not counting its sub-folders. Null when it holds nothing
	directly. Batched: one read per marketplace, whatever the number of folders.
	"""
	summary(
		"""
		The marketplace prices are quoted at. Defaults to the reader's.
		"""
		marketplace: Marketplace
	): CollectionFolderSummary
}

type CollectionFolderSummary {
	"""
	Copies filed directly in this folder.
	"""
	cards: Int!
	folderId: Int!
	"""
	What those copies are worth at the marketplace, in its currency, as a decimal. Null when it
	prices none of them.
	"""
	value: Float
}

"""
What to order collection entries by. `price` is one copy's price, `value` is price × copies
held, `added` is when the entry was last written.
"""
enum CollectionSortKey {
	added
	finish
	name
	price
	quantity
	set
	value
}

type CollectionSummary {
	"""
	Entries (stacks).
	"""
	entries: Int!
	"""
	Entries that need the reader's attention.
	"""
	needsReview: Int!
	"""
	Copies, not entries.
	"""
	totalCards: Int!
	"""
	Copies marked for trade.
	"""
	tradelistCards: Int!
	"""
	Distinct printings recorded.
	"""
	uniqueCards: Int!
	"""
	Copies the marketplace has no price for, and so left out of `value`.
	"""
	unpriced: Int!
	"""
	What the copies are worth at the marketplace, in its currency, as a decimal — over the
	copies it prices. Read beside `unpriced`.
	"""
	value: Float!
}

"""
A copy's condition. `NONE` is a copy nobody graded.
"""
enum Condition {
	DMG
	HP
	LP
	MP
	NM
	NONE
}

"""
A deck — a named list of cards for a format, with its own folder, deck tags and settings.
"""
type Deck {
	archived: Boolean!
	"""
	The reader's Commander bracket for the deck, 0 when none was set.
	"""
	bracket: Int!
	"""
	How many cards the deck's live list holds, counting copies.
	"""
	cardCount: Int!
	coverArtist: String
	"""
	The printing whose art is the deck's cover; pass it to the CardImage component.
	"""
	coverCardId: String
	description: String
	folderId: Int
	"""
	The format's key, e.g. `commander`, `modern`, `casual`.
	"""
	formatKey: String!
	"""
	The format's display name, absent for a format this build does not know.
	"""
	formatName: String
	id: Int!
	name: String!
	"""
	The deck's deck notes, in the reader's order — batched across every deck in the answer.
	"""
	notes: [DeckNote!]!
	notesOpen: Boolean!
	"""
	The deck's deck tags — the reader's own words about the whole deck (`Budget`, `Meme`).
	"""
	tags: [String!]!
	theoryEnabled: Boolean!
	todosOpen: Boolean!
	"""
	When the deck last changed, in Unix seconds.
	"""
	updatedAt: Float!
	"""
	What the deck's live list is worth — batched: one read per marketplace, whatever the
	number of decks.
	"""
	value(marketplace: Marketplace): DeckValue
	virtualOnly: Boolean!
}

type DeckCompletion {
	deckId: Int!
	"""
	Which list the figures are a fraction of: `live` under `collection`, `theory` under
	`theory`.
	"""
	list: DeckVariant!
	"""
	`wanted - owned`; never negative.
	"""
	missing: Int!
	"""
	What the missing copies cost. Null when nothing in the list is priced at this marketplace
	(draw a dash, not 0).
	"""
	missingCost: Float
	"""
	Of those, copies already covered. Never more than `wanted`.
	"""
	owned: Int!
	"""
	Missing copies this marketplace has no price for, left out of `missingCost`.
	"""
	unpricedMissing: Int!
	"""
	Copies the measured list asks for.
	"""
	wanted: Int!
}

"""
What deck completion measures. `collection`: every non-virtual deck's live list against the
copies the collection files in that deck's own folder group. `theory`: every deck that keeps a
theory list (virtual ones included), its live list against that plan.
"""
enum DeckCompletionCompare {
	collection
	theory
}

"""
How a planned copy is matched under `theory` (ignored under `collection`). `exact`: only the
exact printing and finish counts. `missing`: any printing of the same card in the live list
counts, so what is missing is what no printing in the deck covers.
"""
enum DeckCompletionMatch {
	exact
	missing
}

type DeckNote {
	"""
	The note's text, as Markdown.
	"""
	body: String!
	"""
	The cards the note is attached to.
	"""
	cards: [DeckNoteCard!]!
	"""
	In Unix seconds.
	"""
	createdAt: Float!
	deckId: Int!
	id: Int!
	sortOrder: Int!
	title: String!
	"""
	In Unix seconds.
	"""
	updatedAt: Float!
}

type DeckNoteCard {
	"""
	A printing of the card to draw — one in the deck when there is one.
	"""
	cardId: String
	name: String!
	oracleId: String!
}

type DeckValue {
	deckId: Int!
	"""
	How many copies have no price at the marketplace and are left out of `value`.
	"""
	unpriced: Int!
	"""
	Copies × unit price over the priced copies of the live list, in the marketplace's
	currency as a decimal; absent when no copy is priced.
	"""
	value: Float
}

"""
Which list of a deck: `live` is the deck as built, `theory` the version being planned.
"""
enum DeckVariant {
	live
	theory
}

type EntryTagUse {
	"""
	Collection entries and wishes, summed.
	"""
	count: Int!
	tag: String!
}

"""
A printing's finish.
"""
enum Finish {
	etched
	foil
	nonfoil
}

"""
What one printing costs per finish (Near Mint), at one marketplace. In the marketplace's own
currency, in whole units (2.18 is $2.18 or €2.18) — see `Query.marketplace` for which
currency. Null when that marketplace quotes no price; never filled in from another
marketplace.
"""
type FinishPrices {
	etched: Float
	foil: Float
	nonfoil: Float
}

type FolderConflicts {
	"""
	Copies, summed over those entries.
	"""
	copies: Int!
	"""
	Rule-breaking entries filed directly in this folder.
	"""
	entries: Int!
	folderId: Int!
}

type HomeLayout {
	"""
	The layout document's version: `2` for every layout this build writes, `1` for one an
	older build wrote (whose tiles have no place yet).
	"""
	version: Int!
	"""
	Every tile, in stored order. Empty when the reader removed them all.
	"""
	widgets: [HomeWidget!]!
}

type HomeWidget {
	"""
	The tile's own settings, as the widget stored them (keys depend on `kind`). `null` means
	every setting is at its default.
	"""
	config: JSON
	"""
	Height, in cells. `0` on a version-1 document's tile.
	"""
	h: Int!
	"""
	Stable across moves; unique within the layout.
	"""
	id: String!
	"""
	Which widget this is, e.g. `summary`, `priceMovers`, `stickyNotes`. An open set: a layout
	written by a newer build may carry kinds this one does not know.
	"""
	kind: String!
	"""
	The legacy width (1 = one column, 2 = the whole row) kept for older builds. Use `w`
	instead.
	"""
	span: Int
	"""
	Width, in cells. `0` on a version-1 document's tile — the page places it from `span`.
	"""
	w: Int!
	"""
	Column of the tile's left edge, in cells. `0` on a version-1 document's tile, which has
	never been placed.
	"""
	x: Int!
	"""
	Row of the tile's top edge, in cells. `0` on a version-1 document's tile.
	"""
	y: Int!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

"""
A marketplace prices are quoted at. Spelt as `MARKETPLACE_IDS` in `packages/ui/lib/
marketplace.ts`, lower-case, because that is how the page's graph spells them.
"""
enum Marketplace {
	cardkingdom
	cardmarket
	cardtrader
	manapool
	tcgplayer
}

type MarketplaceInfo {
	"""
	`usd` or `eur`.
	"""
	currency: String!
	id: Marketplace!
	"""
	The marketplace's name as the app writes it, e.g. `TCGplayer`, `Card Kingdom`.
	"""
	label: String!
}

"""
Another card a meld card is part of: the card two halves meld into, or one of the halves a
melded card is made from.
"""
type MeldRelation {
	artist: String
	"""
	`meld_part` (a half) or `meld_result` (the melded card).
	"""
	component: String!
	"""
	The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage`
	component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
	"""
	id: String!
	name: String!
}

"""
A Scryfall tag the reader has hidden from the tag search and the tag tree. Muting hides the
tag, never a card.
"""
type MutedTag {
	"""
	When it was muted, in Unix seconds.
	"""
	mutedAt: Float!
	namespace: TagNamespace!
	"""
	The slug as it read when the tag was muted. May be out of date.
	"""
	slug: String!
	"""
	Scryfall's stable id for the tag.
	"""
	tagId: String!
}

type NewPrinting {
	collectorNumber: String!
	"""
	The decks holding the card.
	"""
	decks: [NewPrintingDeck!]!
	"""
	The finishes the printing exists in: `nonfoil`, `foil`, `etched`.
	"""
	finishes: [String!]
	"""
	The printing's language code, e.g. `en`.
	"""
	lang: String!
	name: String!
	oracleId: String!
	"""
	The printing's Scryfall id.
	"""
	printingId: String!
	"""
	Scryfall's `promo_types` for the printing, e.g. `showcase`, `borderless`.
	"""
	promoTypes: [String!]
	rarity: String
	"""
	Release date, `YYYY-MM-DD`.
	"""
	releasedAt: String!
	setCode: String!
	setName: String
}

type NewPrintingDeck {
	deckId: Int!
	name: String!
	"""
	Copies across the deck's categories, live and theory summed.
	"""
	quantity: Int!
	"""
	`live` if the live list holds it at all, else `theory`.
	"""
	variant: DeckVariant!
	"""
	Whether the deck is virtual (not built from owned copies).
	"""
	virtualOnly: Boolean!
}

type NewPrintings {
	"""
	How many decks the scope resolved to; 0 is a real answer.
	"""
	decksWatched: Int!
	"""
	The oldest release date in the answer, `YYYY-MM-DD`; null when empty.
	"""
	oldest: String
	printings: [NewPrinting!]!
	"""
	When this device last saw a non-empty feed, in Unix seconds; null for never. A printing
	released after it is unseen.
	"""
	seenAt: Float
	"""
	The window's far edge, `YYYY-MM-DD`.
	"""
	since: String!
}

type OptimizePrinting {
	"""
	The printing's Scryfall id.
	"""
	cardId: String!
	collectorNumber: String!
	lang: String!
	"""
	One copy at the wish's finish, at the marketplace, in its currency, as a decimal. Null when
	unpriced — only ever on the printing a wish is moving from.
	"""
	price: Float
	setCode: String!
}

"""
The field a condition is about.
"""
enum PredicateField {
	allOf
	anyOf
	artTag
	artist
	cmc
	colorIdentity
	colors
	flavor
	format
	keyword
	manaCost
	name
	oracleTag
	oracleText
	power
	rarity
	setCode
	text
	toughness
	typeLine
	watermark
}

"""
One condition on one field — `type contains goblin`, `mana value ≥ 3` — or a group of them.
"""
input PredicateInput {
	field: PredicateField!
	"""
	Rules the condition out instead of requiring it.
	"""
	negated: Boolean! = false
	op: PredicateOp!
	"""
	With `field: anyOf` or `allOf`: the conditions grouped.
	"""
	terms: [PredicateInput!]! = []
	"""
	What the field is compared with, as text: `goblin`, `3`, `ur`.
	"""
	value: String! = ""
}

"""
How a condition compares: `colon` is the field's own sense (contains, includes, legal in).
"""
enum PredicateOp {
	colon
	eq
	gt
	gte
	lt
	lte
	ne
}

type PriceHistory {
	"""
	Today's live price; null when this marketplace has no price for it today.
	"""
	now: Float
	"""
	One per day, oldest first, stopping before today.
	"""
	points: [PricePoint!]!
	"""
	Today's UTC midnight according to the database, in Unix seconds.
	"""
	today: Float!
}

type PriceMover {
	"""
	The printing's Scryfall id.
	"""
	cardId: String!
	"""
	`now - then`, signed; never 0 (a printing that did not move is not a mover).
	"""
	delta: Float!
	finish: Finish!
	name: String!
	"""
	Today's price.
	"""
	now: Float!
	setCode: String!
	"""
	Null for a printing whose set has left the card data.
	"""
	setName: String
	"""
	The price in the baseline snapshot.
	"""
	then: Float!
}

"""
Which way a mover went: `up` gainers, `down` losers, `both` the two together ranked by the
size of the move.
"""
enum PriceMoverDirection {
	both
	down
	up
}

"""
Narrows price movers to the printings named here instead of every owned printing. Folder ids
are direct — a folder's subfolders are not included unless listed. A scope naming nothing
answers no movers.
"""
input PriceMoverScopeInput {
	"""
	Printing ids (Scryfall), owned or not, each measured in every finish it is priced in. A
	card only has history once it is owned, wished for or watched.
	"""
	cards: [String!]
	"""
	Collection folder ids; `0` is copies filed in no folder.
	"""
	collectionFolders: [Int!]
	"""
	Wishlist folder ids; `0` is wishes filed in no folder.
	"""
	wishlistFolders: [Int!]
}

"""
Which baseline price movers are measured against.
"""
enum PriceMoverWindow {
	"""
	The oldest snapshot kept.
	"""
	ALL
	"""
	The snapshot from thirty days ago.
	"""
	DAYS_30
	"""
	The snapshot from seven days ago.
	"""
	DAYS_7
}

type PriceMovers {
	"""
	How many distinct days of price snapshots this marketplace holds.
	"""
	days: Int!
	"""
	Largest move first.
	"""
	movers: [PriceMover!]!
	"""
	The baseline snapshot actually used, in Unix seconds; null when no snapshot is old enough
	to compare against.
	"""
	since: Float
}

type PricePoint {
	"""
	That day's UTC midnight, in Unix seconds.
	"""
	day: Float!
	price: Float!
}

"""
One paper printing of a card, as the all-printings list shows it.
"""
type Printing {
	artist: String
	"""
	`black`, `white`, `borderless`, `silver` or `gold`.
	"""
	borderColor: String
	collectorNumber: String!
	"""
	This printing's price per finish, at the marketplace `cardPrintings` was asked at.
	"""
	finishPrices: FinishPrices!
	"""
	The finishes this printing is published in. Empty when the corpus does not say.
	"""
	finishes: [Finish!]!
	"""
	Scryfall's frame effects: `showcase`, `extendedart`, `legendary`, …
	"""
	frameEffects: [String!]!
	fullArt: Boolean!
	"""
	The printing's Scryfall id (a UUID). To draw its art, pass it to the app's `CardImage`
	component (through `cardImageUrl(id, face, variant)`); never build an image URL by hand.
	"""
	id: String!
	"""
	Scryfall's id for the artwork. Two printings differ in art exactly when this does.
	"""
	illustrationId: String
	"""
	Scryfall's language code, e.g. `en`.
	"""
	lang: String!
	"""
	Scryfall's layout word.
	"""
	layout: String!
	"""
	Scryfall marks this printing a promo.
	"""
	promo: Boolean!
	rarity: String
	"""
	The printing's release date, `YYYY-MM-DD`.
	"""
	releasedAt: String
	"""
	Lowercase set code, e.g. `m21`.
	"""
	setCode: String!
	setName: String
}

"""
One printing's Oracle Tags (the card's, since every printing shares them), keyed by the
printing id.
"""
type PrintingOracleTags {
	"""
	The printing's Scryfall id.
	"""
	cardId: String!
	"""
	Oracle tag slugs (`removal`, `ramp`), sorted, with every ancestor tag included. Empty for
	an untagged card, an unknown id, and a database that has never downloaded the Oracle
	tags — check `oracleTagsStatus` to tell them apart.
	"""
	slugs: [String!]!
}

"""
One printing's prices per finish, keyed by its id.
"""
type PrintingPrices {
	"""
	The printing's Scryfall id.
	"""
	cardId: String!
	finishPrices: FinishPrices!
}

