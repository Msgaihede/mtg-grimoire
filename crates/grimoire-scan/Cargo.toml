[package]
name = "grimoire-scan"
# **The app's version**, as every workspace member's is: inherited from `[workspace.package]`
# in the root manifest, which is the one release-please writes (`release-please-config.json`), and
# `scripts/release-rule.test.ts` goes red when a member's parts from the app's. The module ships
# beside the web host's, from the same tag.
version.workspace = true
description = "MTG Grimoire, light: the card scanner as a module of its own, for a browser's Worker"
authors = ["Markus Seerup"]
license.workspace = true
edition.workspace = true
publish = false

# **The browser's scanner** (the light app's phase 7, step 7.5): `card-scanner` compiled to
# WASM and loaded by a dedicated Worker **of its own** — not the engine's Worker and not the
# engine's module. `docs/reference/light-app.md` §11.2 has the four figures that decided it: a
# panic ends the instance, so it must not be the instance that holds the database; a frame a
# reader runs on blocks its Worker; a WASM memory is never given back, so the page ends the
# Worker when the reader leaves the Scanner; and it is a module only a reader who scans has to
# fetch.
#
# **The crate alone.** `card-scanner` with **no feature, and never `corpus`**: `corpus` is SQLite,
# and the labels this module needs arrive as bytes the engine encoded
# (`card_scanner::labels`, `grimoire_web`'s `scanner_labels`). No `grimoire-core`, no `tokio`,
# no `reqwest` — nothing here fetches, stores or waits. `cargo tree -p grimoire-scan` is the
# check, and what `scripts/build-wasm.ts` builds is `-p grimoire-scan` alone, so the features
# the engine turns on for the same crate elsewhere in the workspace do not reach it.
#
# **A workspace member.** A member shares the root lockfile — so its `wasm-bindgen` is the
# engine's by construction, the one CLI version `scripts/build-wasm.ts` checks fits both modules
# — and the root's `wasm` profile, and `cargo test --workspace`, `clippy --workspace` and
# `cargo fmt -p grimoire-scan` reach it on a desktop.
#
# **Built with `-C target-feature=+simd128`, in a build tree of its own** — `rten`'s WASM kernels
# are compiled only under the flag, and a tree of its own is how the flag never reaches the
# engine's artifacts.
# `scripts/build-wasm.ts` has both.
#
# **It builds natively as nearly nothing, on purpose**, as the web host does: only the
# `#[wasm_bindgen]` shell (`src/glue.rs`) is gated to the target, so everything with a decision
# in it is compiled and tested on a desktop.

[lib]
name = "grimoire_scan"
# `cdylib` is the `.wasm` `wasm-bindgen` reads; `rlib` is what this crate's own tests link.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The session and its recogniser, `card-neural`'s networks and gallery — whose files the page
# fetches from the app's origin and hands over with `load_neural`; none is compiled in
# (`card-neural`'s `bundled` is the native hosts'). See above for why never `corpus`.
card-scanner = { path = "../card-scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# The root lockfile's, which is the version of the CLI `scripts/build-wasm.ts` insists on.
wasm-bindgen = "0.2"

[dev-dependencies]
# For the tests' frames: a card drawn on a table, as a JPEG. The scanner's own line, less the
# two codecs a test never needs.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
