[package]
name = "card-scanner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Identify a physical Magic card from a camera frame, locally."
publish = false

# Deliberately NOT a member of the cargo workspace at the repository root, which excludes it by
# name: this crate is not `cargo fmt`-clean and carries clippy warnings
# (`docs/reference/card-scanner.md` §8), and membership would put both under the workspace's
# lints. `src-tauri` takes it as a plain `path` dependency. (Until 2026-10-02 there was no
# workspace at all, and this comment said why not: one would move `target/`. It arrived that
# day with `target/` pinned where it was — the root `Cargo.toml` has the record.)

[lib]
name = "card_scanner"
path = "src/lib.rs"

# **Empty on purpose, and not optional.** It makes this package its own workspace root, so cargo
# stops looking for one. Without it cargo walks up the parent directories: the root manifest of
# *this* checkout excludes the crate, so the walk carries on — and every agent worktree lives
# under the main checkout (`.claude/worktrees/<name>/`), whose own root manifest is next. That
# one knows nothing of a crate inside a worktree, and the answer is `current package believes
# it's in a workspace when it's not`. Reproduced 2026-10-02 in a scratch copy of the layout:
# refused without this table, resolved with it.
[workspace]

[features]
default = []
# **`corpus` is the app's one**: `grimoire-core` takes this crate with it enabled. It is the
# optional join back to the app's `corpus.db` — `Reference::load_labels` and `labels::read_page`
# read the `cards` table through it. A host with no SQLite (the browser's scanner) is handed the
# labels as bytes instead (`labels`), and needs no feature at all.
corpus = ["dep:rusqlite"]
# The developer tool — the replay of readers' scans (`bin/replay.rs`), never compiled into the
# app. It takes `card-neural/cli` for `card_neural::read_dir`: it reads the recogniser's files
# from `crates/card-neural/models/` (or `--neural-models`), not compiled in.
cli = ["dep:clap", "corpus", "card-neural/cli"]

[dependencies]
# `jpeg` is what a camera frame and a reader's scan arrive as; `png` is for the tests.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

clap = { version = "4", features = ["derive"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# **The recogniser** — `crates/card-neural`'s two CNNs and gallery of looks, run per frame by the
# session once a host hands it the files (`Session::load_neural`).
card-neural = { path = "../card-neural" }

# Readers' scans, replayed and scored (`docs/reference/card-scanner.md`, *The replay*).
[[bin]]
name = "replay"
path = "src/bin/replay.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3

# A JPEG decode on a debug build is unusably slow, and so are the recogniser's sampler, its
# gallery search and the network runtime under it. These make `cargo test` and `cargo run`
# bearable without giving up debug symbols in our own code.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.card-neural]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
