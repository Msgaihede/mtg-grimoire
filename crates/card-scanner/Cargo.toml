[package]
name = "card-scanner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Identify a physical Magic card from a camera frame, locally."
publish = false

# Deliberately NOT a member of the cargo workspace at the repository root, which excludes it by
# name: this crate is not `cargo fmt`-clean and carries clippy warnings
# (`docs/reference/card-scanner.md` §8), and membership would put both under the workspace's
# lints. `src-tauri` takes it as a plain `path` dependency. (Until 2026-10-02 there was no
# workspace at all, and this comment said why not: one would move `target/`. It arrived that
# day with `target/` pinned where it was — the root `Cargo.toml` has the record.)

[lib]
name = "card_scanner"
path = "src/lib.rs"

# **Empty on purpose, and not optional.** It makes this package its own workspace root, so cargo
# stops looking for one. Without it cargo walks up the parent directories: the root manifest of
# *this* checkout excludes the crate, so the walk carries on — and every agent worktree lives
# under the main checkout (`.claude/worktrees/<name>/`), whose own root manifest is next. That
# one knows nothing of a crate inside a worktree, and the answer is `current package believes
# it's in a workspace when it's not`. Reproduced 2026-10-02 in a scratch copy of the layout:
# refused without this table, resolved with it.
[workspace]

[features]
default = []
# **`corpus` and `ocr` are the app's two**, and have been since 2026-09-08:
# `apps/desktop/src-tauri/Cargo.toml` takes this crate as a path dependency with exactly those enabled.
# `cli` and `builder` below are the developer tools, and *those* are the two that never enter
# the app's dependency graph — the sentence that used to stand here said "neither" of the pair
# under it, which stopped being true the day the app took the crate.
#
# `corpus` is the optional join back to the app's `corpus.db` — it turns a matched id into
# a card name. Separate from `cli` because the library can match without it, and a bundle
# with no corpus beside it still answers, just with ids.
corpus = ["dep:rusqlite"]
# OCR. Pure Rust: `ocrs` on `rten`, whose whole dependency closure was walked for `cc`,
# `cmake`, `bindgen` and `*-sys` and has none.
ocr = ["dep:ocrs", "dep:rten", "dep:rten-imageproc"]
# The two developer tools — the debug server (`bin/serve.rs`), and the bundle builder with the
# synthetic evaluation (`bin/build_hashes.rs`, `bin/eval.rs`). Each turns the app's two on for
# its own use; neither is ever compiled into the app. `builder` takes `ocr` for the evaluation,
# which runs both modes with their readers: Exact without a collector read is not Exact.
cli = ["dep:clap", "dep:tiny_http", "corpus", "ocr"]
builder = ["dep:clap", "dep:ureq", "dep:rayon", "corpus", "ocr"]

[dependencies]
# `webp` is not optional here: every reference image the builder hashes comes from
# cards.scryfall.io, which serves WebP exclusively since Scryfall retired the JPG/PNG
# family. `jpeg`/`png` are what a sample scan or a camera frame arrives as.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Canny, Otsu, contours, and — the one that matters — `Projection::from_control_points`,
# which is the entire rectification homography in a single call.
imageproc = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

clap = { version = "4", features = ["derive"], optional = true }
# 0.12.0, last published 2022-10-06. Stale, and taken anyway: it is pure Rust, it gets
# HTTP/1.1 keep-alive and Content-Length right — which is what a 30 fps stream of POSTed
# frames actually needs — and it is reachable only under `--features cli`, so a stale
# dev-tool dependency can never reach a shipped binary. Hand-rolling this over TcpListener
# was the alternative and it is more trap than it looks.
tiny_http = { version = "0.12", optional = true }

# Builder only, and desktop only. `ureq` rather than `reqwest`: blocking calls with a thread
# pool is the whole concurrency model a batch fetcher needs, and it keeps tokio out of this
# crate entirely.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
ureq = { version = "3", optional = true }
rayon = { version = "1", optional = true }

# **`default-features = false` is a subtraction of one thing, for the web module's sake.**
# `ocrs`'s defaults are `export-wasm` and `rten`. `export-wasm` gates one module, `wasm_api`,
# and only under `target_arch = "wasm32"`: a `#[wasm_bindgen]` JavaScript API of ocrs's own
# (`OcrEngine`, `OcrEngineInit`, `Image`, `DetectedLine`, `TextLine`, `TextWord`, `RotatedRect`),
# for somebody shipping ocrs itself as an npm package. A `#[wasm_bindgen]` item is an export of
# whatever module links the crate, so with the default on those seven classes were exports of the
# light app's `grimoire_web.js` and roots that kept the whole OCR runtime past LTO in a build that
# calls none of it. `rten` is the other default and is named back: it is `rten/rten_format`, the
# reader for the `.rten` models the app ships. **Natively this line compiles what it always did**
# — the gate reads the target as well as the feature, so no desktop or Android source file is
# in or out because of it, and `cargo tree -e features` for the desktop, the Android host and
# the web host each lost `ocrs feature "default"` and `ocrs feature "export-wasm"` and nothing
# else. The root `Cargo.toml`'s `wasm` profile has the bytes: 1 882 984 of them.
ocrs = { version = "0.13", default-features = false, features = ["rten"], optional = true }
rten = { version = "0.26", optional = true }
# For `RotatedRect`, which `ocrs::OcrEngine::recognize_text` takes and `ocrs` does not
# re-export. Held to `ocrs`'s own `0.26` so the type is the one it expects — a second
# version would be a second, incompatible `RotatedRect`.
rten-imageproc = { version = "0.26", optional = true }

[[bin]]
name = "scan"
path = "src/bin/scan.rs"
required-features = ["cli"]

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["cli"]

[[bin]]
name = "build-hashes"
path = "src/bin/build_hashes.rs"
required-features = ["builder"]

[[bin]]
name = "eval"
path = "src/bin/eval.rs"
required-features = ["builder"]

[[bin]]
name = "detect-bench"
path = "src/bin/detect_bench.rs"
required-features = ["builder"]

[[bin]]
name = "ocr-bench"
path = "src/bin/ocr_bench.rs"
required-features = ["builder"]

# The readers scored per read against labels — see the module doc. Beside `eval` rather than
# a mode of it: it asks a narrower question, and `eval` is the file every scanner branch edits.
[[bin]]
name = "read_eval"
path = "src/bin/read_eval.rs"
required-features = ["builder"]

# The measurements behind the appearance watch (#710), beside `eval` so CI's `--bins` builds it.
[[bin]]
name = "stacking"
path = "src/bin/stacking.rs"
required-features = ["builder"]

# The frame bench's inputs (`bench/`, the light app's phase 7): a bundle, labels, models and
# frames in one directory, from real files or invented. Behind `builder` for `synth` and the
# corpus; the bench itself is a package of its own, with neither.
[[bin]]
name = "bench-prep"
path = "src/bin/bench_prep.rs"
required-features = ["builder"]

[profile.release]
opt-level = 3

# Detection on a debug build is unusably slow — a Canny pass over a 12 MP photo is seconds
# rather than milliseconds. These two make `cargo test` and `cargo run` bearable without
# giving up debug symbols in our own code.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.imageproc]
opt-level = 3
