# The cargo workspace: every package that shares one lockfile, one build tree and one set of
# profiles. Since 2026-10-02 — until then `src-tauri` was a standalone package and the root held
# no manifest at all.
#
# **Why a workspace, and why here.** The light app (docs/superpowers/specs/2026-10-01-light-app-
# android-and-web-design.md §2) moves the engine into `crates/grimoire-core` so three hosts can
# link it — this desktop, an Android shell and a WASM build. Measured the day it landed: a path
# dependency that is *not* a workspace member cannot be tested from the package that depends on
# it once it has a dev-dependency ("requires dev-dependencies and is not a member of the
# workspace"), so without a workspace the core would have needed its own `Cargo.lock` and its own
# multi-gigabyte `target/` beside this one, and two lockfiles for one engine drift.
#
# **The build tree is `<root>/target`**, cargo's default for a workspace, since 2026-10-08. Until
# then `.cargo/config.toml` pinned it to `src-tauri/target` so that the workspace conversion moved
# nothing; the layout change moved the desktop host to `apps/desktop/src-tauri` and the pin now
# says `target`. The file restates cargo's default on purpose: a nested worktree with no file of
# its own reads the main checkout's, and builds into that tree — `.cargo/config.toml` has the
# argument. A debug build keeps `data/` beside its executable, so a checkout's dev database is
# `target/debug/data`.
#
# **`crates/card-scanner` is excluded on purpose**, and the `exclude` is not optional: a path
# dependency that lives under the workspace root becomes a member automatically. It stays a
# standalone package with its own `Cargo.lock` because it is not `cargo fmt`-clean and carries
# clippy warnings (`docs/reference/card-scanner.md` §8), so membership would turn `--workspace`
# lints red for something no change here is about.
#
# ⚠️ **A manifest here reaches every checkout nested under this directory, and the agent
# worktrees are nested under the main checkout** (`.claude/worktrees/<name>/`). Cargo finds a
# workspace by walking up parent directories, with no notion of a git boundary. Reproduced
# 2026-10-02 in a scratch copy of the layout:
#
# - **A worktree whose branch predates this file has no root manifest of its own**, so the walk
#   from its `src-tauri` reaches the main checkout's — which does not list it — and every cargo
#   command there stops on `current package believes it's in a workspace when it's not`. The
#   fix is merging `main`, which brings that worktree its own root manifest. A worktree parked
#   on an older commit on purpose (a release tag, a bisect) needs an empty `[workspace]` table
#   added to its desktop host's `Cargo.toml` (`src-tauri/` on such a commit) by hand.
# - **`crates/card-scanner` carries an empty `[workspace]` table for the same reason**: excluded
#   here, cargo would walk on up to the main checkout's manifest from inside any worktree.
# - **Never add `.claude` to `exclude` to "fix" a stale worktree.** It makes one build again —
#   into the *main checkout's* `target`, because `.cargo/config.toml` is found by the same
#   upward walk (a worktree whose branch carries its own file is spared) — so its app opens the main
#   checkout's dev database and two checkouts share one build tree. A loud refusal is the
#   better failure.
[workspace]
# Explicit, because a virtual manifest has no `edition` to imply it: without this line cargo
# falls back to resolver 1, which unifies features across targets — and the core's WASM build
# asks `rusqlite` for a different feature set than the desktop's does.
resolver = "2"
# **`crates/grimoire-scan` is the scanner as a module of its own for a browser** (the light
# app's step 7.5): `card-scanner` with `ocr` and without `corpus`, and nothing of the engine.
# A member for the lockfile — one `wasm-bindgen` for both of the web host's modules — and for
# the `wasm` profile below. ⚠️ **It is only that crate alone when it is built alone**:
# `cargo build -p grimoire-scan` resolves the features of its own graph, while any build that
# names the workspace unifies them with the engine's, which asks the scanner for `corpus` and
# with it SQLite. `scripts/build-wasm.mjs` builds it with `-p`, in a build tree of its own.
members = ["apps/desktop/src-tauri", "crates/grimoire-core", "apps/light/src-tauri", "crates/grimoire-web", "crates/grimoire-scan"]
exclude = ["crates/card-scanner"]

# One version, edition and license for the five members, which inherit each with
# `<key>.workspace = true` (since 2026-10-08). **The version is release-please's to write**:
# `release-please-config.json` bumps `$.workspace.package.version` here, where it used to bump
# five manifests (and the lockfile). `crates/card-scanner` is not a member and keeps its own.
[workspace.package]
version = "0.43.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# **The scanner's crates at full optimisation in a debug build.** The `image`/`imageproc`
# overrides live in `crates/card-scanner/Cargo.toml` too, and there they do nothing for this
# package: cargo reads `[profile.*]` from the build root only. Measured 2026-09-08 on the debug
# server: one rectification 2022 ms against 48 ms in release, a 960 px JPEG decode 230 ms
# against 3–4, so a `tauri dev` scanner without these is a slideshow.
#
# **The crate itself and the OCR runtime are on the list because the first live pass measured
# them in** (2026-09-08, `tauri dev` with only the two image crates optimised): the pump's
# budget read rectify 1 829 ms and 5 012 ms of unitemised hash, search and reader time per
# frame — 7.0 s a frame, 0.1 frames a second. The warp is `imageproc`'s, so what stayed slow
# was `card-scanner`'s own loops (cardness, trim, the descriptor) and `rten`'s inference. Every
# `rten-*` crate in the lock file is named, because a graph with one unoptimised member inherits
# its speed. **`zune-jpeg` is the JPEG decoder `image` 0.25 delegates to**, and it is the same
# lesson one crate down: with `image` alone optimised, a 960 px frame still decoded in 117 ms
# against release's 3–4.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.imageproc]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.card-scanner]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3

# **The web host's module** — `node scripts/build-wasm.mjs`, which builds `grimoire-web` for
# `wasm32-unknown-unknown` with `--profile wasm`. A profile of its own, inheriting `release`,
# so that nothing here reaches the desktop's or the APK's build: **`[profile.release]` is
# deliberately not written in this file**, and a change to it for the browser's sake would
# change the binaries people have installed.
#
# What it adds, each for a module a phone downloads once and then runs an ingest in:
# - `lto = "fat"` and `codegen-units = 1` — one unit for the whole graph, so what no export
#   reaches is dropped rather than carried. **That is the whole of how the card scanner stays
#   out of this module**: the core links it on every target, no command in the table reaches
#   its session *on this target* — since step 7.3 the table names the scanner's commands, and
#   each is shut on a page by a refusal that is a constant here (`scanner::not_in_a_browser_yet`;
#   an `async fn` needs `platform::host::with_files` for the same effect, which step 7.5
#   measured: 9 961 418 B with the OCR runtime still linked, 7 030 970 B without) — and so its
#   detection, its hashes, `ocrs`, the eleven `rten*` crates and the
#   image codecs are all dropped at link time — read off the name section on 2026-10-04, what
#   is left of the scanner is 35 583 B of code: the review tray's and the preferences' reads
#   and writes, which a browser does call, and the drop glue of what they name. ⚠️ **An export is a root, and that is how it went wrong
#   once**: `ocrs`'s default `export-wasm` feature is a `#[wasm_bindgen]` API of its own, its
#   seven classes were exports of *this* module, and they kept the whole OCR runtime — 1 882 984 B
#   — in a build that calls none of it. `crates/card-scanner/Cargo.toml` takes `ocrs` without
#   its defaults since step 5.5; the glue now exports `reqwest`'s three stream classes and
#   nothing else that is not ours. **A new class in `dist-wasm/grimoire_web.js` is the symptom
#   to look for**, and no build fails on one.
# - `panic = "abort"` — what this target does anyway (there is no unwinding on
#   `wasm32-unknown-unknown`), said, so no landing pad is emitted for one.
# - **`opt-level` is left at `release`'s 3.** SQLite's C is compiled at the profile's level
#   too — `sqlite-wasm-rs`'s build script hands `cc` the profile's `OPT_LEVEL` — and the first
#   web host's figures, a 15.6–16.3 s first ingest and a 53 ms search, were taken at 3. What a
#   size-optimised level buys is the table below; **what it costs was timed in a browser, and
#   is why 3 stays** — four first runs of each build in headless Chrome 154, the same bytes off
#   loopback for all of them: the card phase's download and ingest was 14.03 s at 3, 16.38 s
#   at `"s"`, 21.03 s at `"z"`, and 16.38 s again with only SQLite's C left at 3 — so the cost
#   is in the Rust, and that last build buys nothing back. Searches, the finishes and a reload
#   did not separate. `docs/reference/light-app.md` §9.6 has the table and what it does not
#   prove: one desktop CPU, and no slow link.
#
# The script prints the module's size; the artifact lands in
# `<target>/wasm32-unknown-unknown/wasm/`. **Measured 2026-10-04, step 5.5, this machine, no
# `wasm-opt`, the name section stripped** — each a build of the same tree, differing in this
# profile's `opt-level` alone (`CARGO_PROFILE_WASM_OPT_LEVEL` sets it without an edit here):
#
# | `opt-level` | Module | `gzip -9` | Its code section |
# | --- | --- | --- | --- |
# | 3 | 6 801 761 B | 2 388 746 B | 5 992 636 B |
# | `"s"` | 5 535 141 B | 1 865 782 B | 4 714 312 B |
# | `"z"` | 4 771 206 B | 1 617 653 B | 3 938 573 B |
# | `"s"`, with `[profile.wasm.package.sqlite-wasm-rs] opt-level = 3` | 6 090 581 B | 2 055 851 B | — |
#
# **Of what `"s"` takes out of the code, 547 320 B of 1 278 324 is SQLite's C** (1 303 141 B at
# 3, 755 821 B at `"s"`), which is the ingest's own hot path — the last row is the build that
# shrinks the Rust and leaves that alone. Before the `ocrs` line the module at 3 was
# 8 684 745 B, 3 030 884 B through `gzip -9`. With the function names kept (`--names`) the
# module at 3 is 7 729 043 B. **The table is of the tree the four were timed on; the module
# that step shipped is 6 767 338 B, 2 372 783 B through `gzip -9`** — the same profile, with
# the step's last engine changes in it — and was not timed again.
#
# **Two modules are built with this profile since step 7.5 (2026-10-07)**, and the second is
# where the scanner runs: `crates/grimoire-scan`, the crate alone in a Worker of its own, with
# `-C target-feature=+simd128` from `scripts/build-wasm.mjs`'s environment and never from here
# or from `.cargo/config.toml` — the engine's module has to load in a browser without it.
# Measured that day, no `wasm-opt`, names stripped: **the scanner's module is 4 473 528 B,
# 985 315 B through brotli at quality 11**. **The engine's went from 6 871 580 B to
# 6 902 679 B** (1 659 056 B to 1 664 011 B through brotli) for one new export,
# `scanner_labels` — the labels' encoder, a paged read of `cards` and the glue of an async
# export; its classes are still `reqwest`'s three, so nothing of the session came with it.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
