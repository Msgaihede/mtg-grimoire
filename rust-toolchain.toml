# The Rust toolchain every build of this repo uses — `cargo` run anywhere under the root, every
# CI job, every release leg and the scanner-bundle workflow alike.
#
# **Pinned, never `stable`.** CI runs `clippy -D warnings`, and a new stable ships new lints: with
# a floating channel one Rust release could turn every open PR red with no change to the code,
# and a release binary was built by whatever stable happened to be current that day. Moving the
# pin is a deliberate commit that runs the whole gate — `rust-toolchain.toml` routes to every
# job that compiles Rust in `scripts/ci-route.mjs`.
#
# Workflows never install a toolchain of their own: `.github/actions/rust-toolchain` reads the
# channel below, and `scripts/toolchain.test.mjs` fails if any workflow names one directly.
#
# Locally, after moving the pin, re-add `llvm-tools-preview` (for `npm run test:coverage:rust`)
# with `rustup component add` — components are per-toolchain, so the old pin's do not carry over.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
